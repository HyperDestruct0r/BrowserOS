      tabs[cur + 1] ||
      tabs[cur - 1] ||
      tabs.find((t, i) => i !== cur);
    if (other) setSplitId(other.id);
  };

  const setSplitWithTab = (tabId) => {
    if (tabId === tabs[cur]?.id) return;
    setSplitId(tabId);
  };

  // Keep split valid when tabs change
  useEffect(() => {
    if (splitId == null) return;
    const stillThere = tabs.some(t => t.id === splitId);
    if (!stillThere) setSplitId(null);
    if (tabs[cur]?.id === splitId) setSplitId(null);
  }, [tabs, cur, splitId]);

  /* ─────────────────────────────
     ⌨️ KEYBOARD SHORTCUTS
     Alt+Shift+T  → new tab
     Alt+Shift+W  → close current tab
     Alt+Shift+H  → open history.os
     Ctrl+Alt+Shift+E → open terminal.os
  ───────────────────────────── */
  useEffect(() => {
    const onKey = (e) => {
      const key = (e.key || "").toLowerCase();
      if (!e.altKey || !e.shiftKey) return;

      // Ctrl+Alt+Shift+E → terminal
      if (e.ctrlKey && key === "e") {
        e.preventDefault();
        openApp("terminal");
        return;
      }

      // Don't steal plain Alt+Shift if Ctrl is also required for E only
      if (e.ctrlKey) return;

      if (key === "t") {
        e.preventDefault();
        newTab();
        return;
      }
      if (key === "w") {
        e.preventDefault();
        closeTab(cur);
        return;
      }
      if (key === "h") {
        e.preventDefault();
        openApp("history");
        return;
      }
    };

    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [cur, tabs, openApp]);

  useEffect(() => {
    const onOpenChat = () => {
      try {
        openApp("chat");
      } catch (_) {}
    };
    window.addEventListener("browseros-open-chat", onOpenChat);
    return () => window.removeEventListener("browseros-open-chat", onOpenChat);
  }, [openApp]);

  /* ─────────────────────────────
     🎨 RENDER
  ───────────────────────────── */

  useEffect(() => {
    const onKey = (e) => {
      const meta = e.metaKey || e.ctrlKey;
      const tag = (e.target && e.target.tagName) || "";
      const typing =
        tag === "INPUT" || tag === "TEXTAREA" || (e.target && e.target.isContentEditable);
      // Ctrl/Cmd + Shift + K → launcher
      if (meta && e.shiftKey && (e.key === "k" || e.key === "K")) {
        e.preventDefault();
        setLauncherOpen(true);
        return;
      }
      // Ctrl/Cmd + Shift + D → toggle dock
      if (meta && e.shiftKey && (e.key === "d" || e.key === "D")) {
        e.preventDefault();
        setDockVisible(v => {
          const next = !v;
          try {
            localStorage.setItem("browserOS_dock_hidden", next ? "0" : "1");
          } catch (_) {}
          return next;
        });
        return;
      }
      // Ctrl/Cmd + / → cheat sheet
      if (meta && (e.key === "/" || e.code === "Slash")) {
        e.preventDefault();
        setCheatOpen(true);
        return;
      }
      // ? → cheat sheet when not typing
      if (!typing && !meta && e.key === "?") {
        e.preventDefault();
        setCheatOpen(true);
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  // Sleep / Resume session from Home
  useEffect(() => {
    const onSleep = () => {
      setTabs(prev => {
        saveSleepSession(prev, cur);
        return prev;
      });
      if (typeof browserOSNotify === "function") {
        browserOSNotify({ title: "Session slept", body: "Tabs saved on this device." });
      }
    };
    const onResume = () => {
      const data = getSleepSession();
      if (!data || !data.tabs || !data.tabs.length) {
        if (typeof browserOSNotify === "function") {
          browserOSNotify({ title: "Nothing to resume", body: "Sleep a session first." });
        }
        return;
      }
      const tabCap = typeof maxTabsAllowed === "function" ? maxTabsAllowed() : 11;
      const restored = data.tabs.slice(0, tabCap).map(t =>
        createTabState({
          title: t.title || "Tab",
          icon: t.icon || "🌐",
          type: t.type || "internal",
          data: t.data || "homepage",
          sandboxPerms: t.sandboxPerms || defaultSandboxPerms(),
          history: t.history,
          historyIndex: t.historyIndex
        })
      );
      if (!restored.length) return;
      setTabs(restored);
      setCur(Math.min(Math.max(0, data.cur || 0), restored.length - 1));
      if (typeof browserOSNotify === "function") {
        browserOSNotify({
          title: "Session resumed",
          body: restored.length + " tab(s) restored"
        });
      }
    };
    window.addEventListener("browseros-sleep-session", onSleep);
    window.addEventListener("browseros-resume-session", onResume);
    return () => {
      window.removeEventListener("browseros-sleep-session", onSleep);
      window.removeEventListener("browseros-resume-session", onResume);
    };
  }, [cur]);

  const currentAppKey =
    tabs[cur] && tabs[cur].type === "internal" ? tabs[cur].data : null;

  return (
    <div className={"shell" + (dockVisible ? " has-dock" : " dock-hidden")}>
      <NotificationHost />
      <OsAppLauncher
        open={launcherOpen}
        onClose={() => setLauncherOpen(false)}
        onLaunch={key => {
          if (key === "homepage") openApp("homepage");
          else openApp(key);
        }}
        onPin={toggleDockPin}
        dockPins={dockPins}
      />
      <OsCheatSheet open={cheatOpen} onClose={() => setCheatOpen(false)} />
      {dockVisible ? (
        <OsDock
          openApp={openApp}
          currentAppKey={currentAppKey}
          onOpenLauncher={() => setLauncherOpen(true)}
          onHide={toggleDock}
          pins={dockPins}
          onPinsChange={setDockPins}
        />
      ) : (
        <button
          type="button"
          className="os-dock-show"
          onClick={toggleDock}
          title="Show dock (Ctrl+Shift+D)"

          ▴ Dock
        </button>

      {/* DEV MODE INDICATOR (NEW) */}
      {devMode && (
        <div style={{
          position: "fixed",
          top: 6,
          right: 10,

      <div className="chrome">

        {/* TAB ROW */}
        <div className="tabrow">
          <button className="new-tab-btn" onClick={newTab}>+</button>

          {tabs.map((t, i) => (
            <div
              key={t.id}
              className={
                "tab" +
                (i === cur ? " active" : "") +
                (splitId === t.id ? " split-side" : "") +
                (dragIndex === i ? " dragging" : "") +
                (dragOverIndex === i && dragIndex !== i ? " drag-over" : "")
              }
              title={
                splitId === t.id
                  ? "Split view (right pane)"

              }
              draggable={!isNarrow}
              onClick={(e) => {
                if (dragMoved.current) {
                  dragMoved.current = false;
                  return;
                }
                if (e.shiftKey && i !== cur) {
                  setSplitWithTab(t.id);
                  return;
                }
                setCur(i);
              }}
              onDragStart={(e) => {
                if (isNarrow) {
                  e.preventDefault();
                  return;
                }
                // don't start a drag from the close button
                if (e.target.closest && e.target.closest(".close-btn")) {
                  e.preventDefault();
                  return;
                }
                dragMoved.current = false;
                setDragIndex(i);
                e.dataTransfer.effectAllowed = "move";
                try {
                  const img = new Image();
                  img.src = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
                  e.dataTransfer.setDragImage(img, 0, 0);
                } catch (_) {}
              }}
              onDragOver={(e) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = "move";
                dragMoved.current = true;
                if (dragOverIndex !== i) setDragOverIndex(i);
              }}
              onDragLeave={() => {
                if (dragOverIndex === i) setDragOverIndex(null);
              }}
              onDrop={(e) => {
                e.preventDefault();
                dragMoved.current = true;
                reorderTabs(dragIndex, i);
                setDragIndex(null);
                setDragOverIndex(null);
              }}
              onDragEnd={() => {
                setDragIndex(null);
                setDragOverIndex(null);
              }}
            >
              <span style={{ pointerEvents: "none" }}>{t.icon}</span>
              <span className="tab-title">{t.title}</span>
              <span className="close-btn" onClick={(e) => closeTab(i, e)}>✕</span>

          ))}

        {/* TOOLBAR */}
        <div className="toolbar">
          <div className="toolbar-row toolbar-nav">
            <button
              className="nav-btn"
              title="Back"
              disabled={!canGoBack}

            <button

              title="Forward"

            <button

            <button

            <button

            {/* Site permissions — desktop only in toolbar */}
            {currentTab?.type === "web" && (

                {showSandboxPanel && (

                    {[

                      { key: "forms",      label: "Forms" },

                      { key: "downloads",  label: "Downloads" },

        {/* Mobile actions sheet */}

              {currentTab?.type === "web" && (
                <div style={{ marginTop: 8, paddingTop: 8, borderTop: "1px solid var(--border)" }}>
                  <div style={{
                    fontSize: 11,
                    fontWeight: 700,
                    letterSpacing: "0.08em",
                    textTransform: "uppercase",
                    color: "var(--text-muted)",
                    padding: "8px 10px 4px"

                    Site permissions
                  </div>
                  {[
                    { key: "scripts",    label: "JavaScript",           special: true },
                    { key: "sameOrigin", label: "Same-origin access" },
                    { key: "forms",      label: "Forms" },
                    { key: "popups",     label: "Popups / new windows" },
                    { key: "modals",     label: "Dialogs (alert…)" },
                    { key: "downloads",  label: "Downloads" },
                    { key: "topNav",     label: "Navigate top page" },

                        <div
                          className={"sandbox-toggle" + (on ? " on" : "")}
                          onClick={() => {
                            if (item.special && item.key === "scripts") {

              <button

        {/* BOOKMARKS */}
        <div className="bookmarks-bar">
          {bookmarks.map((b, i) => (
            <div

              className="bookmark-item"

            </div>
          ))}
        </div>

      </div>

        <OsStatusBar />

        {/* CONTENT */}
        <div className={"content" + (splitId != null && tabs.some(t => t.id === splitId) && tabs[cur]?.id !== splitId ? " content-split" : "")}>
          <div
            className={"wallpaper-layer" + (wallpaper?.dataUrl ? " on" : "")}
            style={
              wallpaper?.dataUrl
                ? {
                    backgroundImage: "url(" + wallpaper.dataUrl + ")",
                    filter: "blur(" + ((wallpaper.blur || 0) * 24) + "px)"
                  }
                : undefined
            }
          />
          {(() => {
            const renderPage = (t, i, forceShow) => {
              const sandboxVal = t.type === "web"
                ? buildSandboxAttr(t.sandboxPerms || defaultSandboxPerms())
                : null;
              const frameKey = t.type === "web"
                ? `${t.id}-${t.sandboxRev || 0}-${sandboxVal ?? "open"}`
                : t.id;
              const isPrimary = i === cur;
              const isSplitPane = splitId != null && t.id === splitId;
              const show = forceShow || isPrimary || isSplitPane;

              return (
                <div
                  key={t.id}
                  className={
                    "page" +
                    (isPrimary ? " active" : "") +
                    (isSplitPane && !isPrimary ? " split-active" : "") +
                    (t.type === "internal" ? " page-internal" : "")
                  }
                  style={show && forceShow ? { display: "flex", flexDirection: "column", flex: 1, height: "100%" } : undefined}
                  onClick={() => {
                    if (isSplitPane && !isPrimary) setCur(i);
                  }}
                >
                  {t.type === "web" ? (
                    <WebFrame
                      src={t.data}
                      title={t.title}
                      sandboxVal={sandboxVal}
                      frameKey={frameKey}
                      productName="BrowserOS"
                    />
                  ) : (
                    <InternalPage
                      name={t.data}
                      openApp={openApp}
                      openSite={openSite}
                    />
                  )}
                </div>
              );
            };

            const splitIndex = splitId != null ? tabs.findIndex(t => t.id === splitId) : -1;
            const isSplit =
              splitIndex >= 0 &&
              tabs[cur] &&
              tabs[cur].id !== splitId;

            if (isSplit) {
              return (
                <>
                  <div className="split-pane" onClick={() => setCur(cur)}>
                    {renderPage(tabs[cur], cur, true)}
                  </div>
                  <div className="split-divider" title="Split" />
                  <div
                    className="split-pane"
                    onClick={() => setCur(splitIndex)}
                  >
                    {renderPage(tabs[splitIndex], splitIndex, true)}
                  </div>
                </>
              );
            }

            return tabs.map((t, i) => renderPage(t, i, false));
          })()}
        </div>

        {/* JS disable warning modal */}
        {pendingJsOff && (
          <div className="sandbox-warning-overlay">
            <div className="sandbox-warning-box">
              <h3>Disable JavaScript?</h3>
              <p>
                Most modern websites need JavaScript to work.
                Turning it off will likely break this page and many others.
              </p>
              <div className="sandbox-warning-actions">
                <button onClick={cancelDisableJs}>Cancel</button>
                <button className="danger" onClick={confirmDisableJs}>
                  Turn off JavaScript
                </button>
              </div>
            </div>
          </div>
        )}

      {/* FEEDBACK */}
        {showFeedback && (
          <div
            style={{
              position: "fixed",
              bottom: "18px",
              right: "18px",
              display: "flex",
              alignItems: "center",
              gap: "8px",
              zIndex: 99999
            }}
          >
        
            <a
              className="feedback-chip"
              href="https://forms.gle/SnXoZpFuJM1sxEdv6"
              target="_blank"
              rel="noreferrer"
            >
              💬 Feedback
            </a>
        
            <button
              onClick={closeFeedback}
              style={{
                width: "28px",
                height: "28px",
                borderRadius: "999px",
                border: "1px solid var(--border)",
                background: "var(--surface2)",
                color: "var(--text)",
                cursor: "pointer",
                fontWeight: 700,
                fontSize: "13px",
                display: "flex",
                alignItems: "center",
                justifyContent: "center"
              }}
            >
              ✕
            </button>
        
          </div>
        )}

    </div>
  );
}

/** Force-update gate: compare local build token to Supabase config. */
async function fetchRequiredBuildToken(client) {
  const c = client || (typeof getSupabaseClient === "function" ? getSupabaseClient() : null);
  if (!c) return null;
  try {
    const { data, error } = await c
      .from("browseros_app_config")
      .select("min_build_token, min_version, force_update_message")
      .eq("id", 1)
      .maybeSingle();
    if (error) {
      // Table missing or RLS — do not lock users out
      console.warn("build config", error.message || error);
      return null;
    }
    return data || null;
  } catch (err) {
    console.warn("build config fetch", err);
    return null;
  }
}

function localBuildToken() {
  return typeof BROWSEROS_BUILD_TOKEN !== "undefined"
    ? String(BROWSEROS_BUILD_TOKEN)
    : "";
}

function localBuildVersion() {
  return typeof BROWSEROS_VERSION !== "undefined"
    ? String(BROWSEROS_VERSION)
    : "dev";
}

/**
 * Returns { ok: true } or { ok: false, message }
 * If server has no row / empty min_build_token → allow (ok).
 */
async function checkClientBuildFreshness(client) {
  const cfg = await fetchRequiredBuildToken(client);
  if (!cfg) return { ok: true, skipped: true };
  const required = String(cfg.min_build_token || "").trim();
  if (!required) return { ok: true, skipped: true };
  const local = localBuildToken();
  if (local && local === required) return { ok: true };
  const msg =
    (cfg.force_update_message && String(cfg.force_update_message).trim()) ||
    "New Update: Refresh to regain access. Download the latest BrowserOS file and open it again.";
  return {
    ok: false,
    message: msg,
    required,
    local,
    min_version: cfg.min_version || null
  };
}

    !BROWSEROS_SUPABASE.anonKey.includes("YOUR_SUPABASE")
  );
}

const BROWSEROS_PRIMARY_OWNER_EMAIL = "mhing@uiowa.edu";

function isPrimaryOwnerEmail(email) {
  return (
    String(email || "").toLowerCase() ===
    String(BROWSEROS_PRIMARY_OWNER_EMAIL || "").toLowerCase()
  );
}

function isPrimaryOwnerClient() {
  try {
    const p = window.__browserOSProfile;
    if (p && isPrimaryOwnerEmail(p.email)) return true;
    const em =
      (p && p.email) ||
      (window.__browserOSUserEmail || "");
    return isPrimaryOwnerEmail(em);
  } catch (_) {
    return false;
  }
}

function isConfiguredAdminEmail(email) {
  // Deprecated: admin is only profiles.is_admin from Supabase (never trust HTML).
  return false;
}

function isBrowserOSAdminClient() {
  const p = window.__browserOSProfile;
  return !!(p && p.is_admin);
}

function getSupabaseClient() {
  if (!isSupabaseConfigured()) return null;
  if (typeof window === "undefined" || !window.supabase || !window.supabase.createClient) {
    return null;
  }
  if (!window.__browserOSSupabase) {
    // Email/password auth for a downloadable file (works while online).
    // Session lives for this page load; Root clears it on a fresh open.
    window.__browserOSSupabase = window.supabase.createClient(
      BROWSEROS_SUPABASE.url,
      BROWSEROS_SUPABASE.anonKey,
      {
        auth: {
          persistSession: false,
          autoRefreshToken: true,
          detectSessionInUrl: false
        }
      }
    );
  }
  return window.__browserOSSupabase;
}

async function fetchUserProfile(client, user) {
  let { data, error } = await client
    .from("profiles")
    .select("user_id, email, status, is_admin, is_dev, is_nitro, role, created_at, access_expires_at, nitro_expires_at, activated, activation_plan")
    .eq("user_id", user.id)
    .maybeSingle();
  if (error && /is_dev|column/i.test(error.message || "")) {
    const retry = await client
      .from("profiles")
      .select("user_id, email, status, is_admin, created_at")
      .eq("user_id", user.id)
      .maybeSingle();
    data = retry.data;
    error = retry.error;
    if (data) data = { ...data, is_dev: false, role: data.is_admin ? "admin" : "user" };
  }
  if (error) throw error;
  return data;
}

async function ensureUserProfile(client, user) {
  const email = (user.email || "").toLowerCase();
  let profile = null;
  try {
    profile = await fetchUserProfile(client, user);
  } catch (err) {
    throw err;
  }

  if (!profile) {
    const row = {
      user_id: user.id,
      email,
      status: "pending",
      is_admin: false
    };
    const { data, error } = await client
      .from("profiles")
      .insert(row)
      .select("user_id, email, status, is_admin, created_at")
      .single();
    if (error) {
      profile = await fetchUserProfile(client, user);
      if (!profile) throw error;
    } else {
      profile = data;
    }
  }

  // Never promote admin from client — only DB / SQL
  if (profile && profile.is_dev == null) profile.is_dev = false;
  if (profile && profile.is_admin == null) profile.is_admin = false;
  profile = applyProfileExpirations(profile, client);
  window.__browserOSProfile = profile;
  try {
    refreshServerEntitlements();
  } catch (_) {}
  return profile;
}

      p_code: coupon.trim()

      return;

    setInfo("Code redeemed! Unlocking BrowserOS…");
    const { data: sessionData } = await client.auth.getSession();

            <button

function AuthScreen({ onUnlock, onPending, revokeMessage }) {
  const [mode, setMode] = useState("signin"); // signin | register | reset
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [password2, setPassword2] = useState("");
  const [error, setError] = useState("");
  const [info, setInfo] = useState("");
  const [busy, setBusy] = useState(false);
  const emailRef = useRef(null);

  useEffect(() => {
    emailRef.current?.focus();
  }, [mode]);

  const submit = async (e) => {
    e && e.preventDefault && e.preventDefault();
    if (busy) return;
    setError("");
    setInfo("");
    setBusy(true);

    try {
      if (!isSupabaseConfigured()) {
        setError("Auth is not configured. Set Supabase URL and anon key.");
        return;
      }
      const client = getSupabaseClient();
      if (!client) {
        setError("Supabase client failed to load. Check your network.");
        return;
      }

      const trimmed = email.trim().toLowerCase();
      if (!trimmed || !trimmed.includes("@")) {
        setError("Enter a valid email address.");
        return;
      }

      // Password reset help (no email sent — rate limits)
      if (mode === "reset") {
        setInfo(
          "Password reset emails are disabled. Ask a BrowserOS admin to set a temporary password for your account in Supabase (Authentication → Users)."
        );
        return;
      }

      if (mode === "register") {
        if (password.length < 6) {
          setError("Password must be at least 6 characters.");
          return;
        }
        if (password !== password2) {
          setError("Passwords do not match.");
          return;
        }

        const { data, error: signUpError } = await client.auth.signUp({
          email: trimmed,
          password
        });

        if (signUpError) {
          const msg = (signUpError.message || "").toLowerCase();
          if (msg.includes("already") || msg.includes("registered")) {
            setError("That email is already registered. Use Sign in.");
          } else {
            setError(signUpError.message || "Registration failed.");
          }
          return;
        }

        if (data.user && data.session) {
          try {
            await ensureUserProfile(client, data.user);
          } catch (_) {}
        }

        if (!data.session) {
          // Email confirm still on in project, or signup disabled
          setInfo(
            "Account created. If you cannot sign in yet: Supabase → Authentication → Providers → Email → turn OFF “Confirm email”, and ensure Email signup is enabled. Then Sign in."
          );
          setMode("signin");
          setPassword("");
          setPassword2("");
          return;
        }

        let profile;
        try {
          profile = await ensureUserProfile(client, data.user);
        } catch (err) {
          setError(
            (err && err.message) ||
              "Account created but profile setup failed. Check the profiles table/trigger in Supabase."
          );
          await client.auth.signOut({ scope: "local" }).catch(() => {});
          return;
        }

        setPassword("");
        setPassword2("");
        if (profile._accessExpired) {
          setError("Your BrowserOS access period has expired.");
          await client.auth.signOut({ scope: "local" }).catch(() => {});
          return;
        }
        if (profile.status === "approved" || profile.is_admin || profile.is_dev) {
          onUnlock(data.session, profile);
        } else if (profile.status === "rejected") {
          setError("Your registration was rejected by an administrator.");
          await client.auth.signOut({ scope: "local" }).catch(() => {});
        } else {
          onPending(profile);
        }
        return;
      }

      // Sign in (email + password)
      const { data, error: authError } = await client.auth.signInWithPassword({
        email: trimmed,
        password
      });

      if (authError) {
        const msg = (authError.message || "").toLowerCase();
        if (msg.includes("invalid login") || msg.includes("invalid credentials")) {
          setError("Incorrect email or password.");
        } else if (msg.includes("email not confirmed")) {
          setError(
            "Email not confirmed in Supabase. Owner: Authentication → Providers → Email → disable Confirm email, then Users → Confirm user."
          );
        } else {
          setError(authError.message || "Sign-in failed.");
        }
        setPassword("");
        return;
      }

      if (!data || !data.session) {
        setError("Sign-in failed. No session returned.");
        return;
      }

      let profile;
      try {
        profile = await ensureUserProfile(client, data.user);
      } catch (err) {
        setError(
          (err && err.message) ||
            "Could not load profile. Check the profiles table in Supabase."
        );
        await client.auth.signOut({ scope: "local" }).catch(() => {});
        return;
      }

      setPassword("");
      if (profile._accessExpired) {
        setError("Your BrowserOS access period has expired.");
        await client.auth.signOut({ scope: "local" }).catch(() => {});
        return;
      }
      if (profile.is_admin || profile.is_dev || profile.status === "approved") {
        onUnlock(data.session, profile);
      } else if (profile.status === "rejected") {
        setError("Your registration was rejected by an administrator.");
        await client.auth.signOut({ scope: "local" }).catch(() => {});
      } else {
        onPending(profile);
      }
    } catch (err) {
      setError(
        "Could not reach Supabase. Check your connection. (" +
          ((err && err.message) || "network error") +
          ")"
      );
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="auth-screen">
      <form className="auth-card" onSubmit={submit}>
        <div className="auth-logo">BrowserOS</div>
        <div className="auth-sub">
          {mode === "signin"
            ? "Sign in to continue"
            : mode === "reset"
            ? "Reset help"
            : "Request access"}
        </div>
        {revokeMessage && (
          <div className="auth-error" style={{ marginBottom: 12 }}>
            {revokeMessage}
          </div>
        )}

        <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
          <button
            type="button"
            className="notes-btn"
            style={{
              opacity: mode === "signin" ? 1 : 0.55,
              borderColor: mode === "signin" ? "var(--accent)" : undefined
            }}
            onClick={() => {
              setMode("signin");
              setError("");
              setInfo("");
            }}
          >
            Sign in
          </button>
          <button
            type="button"
            className="notes-btn"
            style={{
              opacity: mode === "register" ? 1 : 0.55,
              borderColor: mode === "register" ? "var(--accent)" : undefined
            }}
            onClick={() => {
              setMode("register");
              setError("");
              setInfo("");
            }}
          >
            Register
          </button>
          <button
            type="button"
            className="notes-btn"
            style={{
              opacity: mode === "reset" ? 1 : 0.55,
              borderColor: mode === "reset" ? "var(--accent)" : undefined
            }}
            onClick={() => {
              setMode("reset");
              setError("");
              setInfo("");
              setPassword("");
              setPassword2("");
            }}
          >
            Reset
          </button>
        </div>

        <div className="auth-label">Email</div>
        <input
          ref={emailRef}
          className="auth-input"
          type="email"
          autoComplete="username"
          value={email}
          onChange={e => setEmail(e.target.value)}
          placeholder="you@example.com"
          disabled={busy}
          style={{ marginBottom: 12 }}
        />

        {mode !== "reset" && (
          <>
            <div className="auth-label">Password</div>
            <input
              className="auth-input"
              type="password"
              autoComplete={mode === "register" ? "new-password" : "current-password"}
              value={password}
              onChange={e => setPassword(e.target.value)}
              placeholder="Password"
              disabled={busy}
              style={{ marginBottom: mode === "register" ? 12 : 0 }}
            />
          </>
        )}

        {mode === "register" && (
          <>
            <div className="auth-label">Confirm password</div>
            <input
              className="auth-input"
              type="password"
              autoComplete="new-password"
              value={password2}
              onChange={e => setPassword2(e.target.value)}
              placeholder="Confirm password"
              disabled={busy}
            />
          </>
        )}

        <button
          className="auth-btn"
          type="submit"
          disabled={
            busy ||
            !email.trim() ||
            (mode !== "reset" && !password) ||
            (mode === "register" && !password2)
          }
        >
          {busy
            ? mode === "register"
              ? "Submitting…"
              : "Signing in…"
            : mode === "register"
            ? "Request access"
            : mode === "reset"
            ? "Show reset help"
            : "Sign in"}
        </button>
        {error && <div className="auth-error">{error}</div>}
        {info && (
          <div style={{ marginTop: 12, fontSize: 12, color: "var(--accent)", lineHeight: 1.45 }}>
            {info}
          </div>
        )}
        <div className="auth-hint">
          {mode === "register"
            ? "New accounts stay pending until an admin approves them. Works from a downloaded file while online."
            : "Approved accounts only. New here? Use Register."}
        </div>
      </form>
    </div>
  );
}
