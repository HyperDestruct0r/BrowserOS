                  key={item.code}
                  type="button"
                  className={"chat-emoji-item" + (idx === emojiMenu.index ? " active" : "")}
                  onMouseDown={e => {
                    e.preventDefault();
                    const before = text.slice(0, emojiMenu.start);
                    const after = text.slice(emojiMenu.end);
                    const next = before + ":" + item.code + ":" + after;
                    setText(next);
                    setEmojiMenu({ open: false, items: [], index: 0, start: 0, end: 0 });
                  }}
                >
                  <span className="ee">{item.emoji}</span>
                  <span className="ec">:{item.code}:</span>
                </button>
              ))}
            </div>
          )}
          <textarea
            value={text}
            maxLength={chatCharLimit()}
            onChange={e => {
              const lim = chatCharLimit();
              const v = e.target.value.slice(0, lim);
              const cursor = e.target.selectionStart;
              setText(v);
              if (v.trim()) broadcastTyping();
              const isAdm = !!(
                window.__browserOSProfile &&
                (window.__browserOSProfile.is_admin || window.__browserOSProfile.is_dev)
              );
              if (isAdm && v.startsWith("/")) {
                const q = v.slice(1).toLowerCase();
                const items = ADMIN_SLASH_COMMANDS.filter(
                  c => c.cmd.slice(1).startsWith(q) || c.cmd.includes(q)
                );
                setCmdMenu({ open: items.length > 0, items, index: 0 });
                setEmojiMenu({ open: false, items: [], index: 0, start: 0, end: 0 });
                setMentionMenu({ open: false, items: [], index: 0, start: 0, end: 0 });
              } else if (v.startsWith("/")) {
                const q = v.slice(1).toLowerCase();
                const items = ADMIN_SLASH_COMMANDS.filter(
                  c => !c.admin && (c.cmd.slice(1).startsWith(q) || c.cmd.includes(q))
                );
                setCmdMenu({ open: items.length > 0, items, index: 0 });
                setEmojiMenu({ open: false, items: [], index: 0, start: 0, end: 0 });
                setMentionMenu({ open: false, items: [], index: 0, start: 0, end: 0 });
              } else {
                setCmdMenu({ open: false, items: [], index: 0 });
                const mq = typeof findMentionQuery === "function" ? findMentionQuery(v, cursor) : null;
                if (mq) {
                  const items = filterMentionCandidates(
                    mq.query,
                    memberList,
                    nickMap,
                    avatarMap
                  );
                  setMentionMenu({
                    open: items.length > 0,
                    items,
                    index: 0,
                    start: mq.start,
                    end: mq.end
                  });
                  setEmojiMenu({ open: false, items: [], index: 0, start: 0, end: 0 });
                } else {
                  setMentionMenu({ open: false, items: [], index: 0, start: 0, end: 0 });
                  const eq = findEmojiQuery(v, cursor);
                  if (eq) {
                    const items = filterEmojiShortcodes(eq.query);
                    setEmojiMenu({
                      open: items.length > 0,
                      items,
                      index: 0,
                      start: eq.start,
                      end: eq.end
                    });
                  } else {
                    setEmojiMenu({ open: false, items: [], index: 0, start: 0, end: 0 });
                  }
                }
              }
            }}
            onKeyDown={e => {
              if (mentionMenu.open && mentionMenu.items.length) {
                if (e.key === "ArrowDown") {
                  e.preventDefault();
                  setMentionMenu(m => ({
                    ...m,
                    index: (m.index + 1) % m.items.length
                  }));
                  return;
                }
                if (e.key === "ArrowUp") {
                  e.preventDefault();
                  setMentionMenu(m => ({
                    ...m,
                    index: (m.index - 1 + m.items.length) % m.items.length
                  }));
                  return;
                }
                if (e.key === "Tab" || (e.key === "Enter" && !e.shiftKey)) {
                  e.preventDefault();
                  const item = mentionMenu.items[mentionMenu.index];
                  if (item) {
                    const before = text.slice(0, mentionMenu.start);
                    const after = text.slice(mentionMenu.end);
                    setText(before + item.insert + after);
                  }
                  setMentionMenu({ open: false, items: [], index: 0, start: 0, end: 0 });
                  return;
                }
                if (e.key === "Escape") {
                  setMentionMenu({ open: false, items: [], index: 0, start: 0, end: 0 });
                  return;
                }
              }
              if (cmdMenu.open && cmdMenu.items.length) {
                if (e.key === "ArrowDown") {
                  e.preventDefault();
                  setCmdMenu(m => ({
                    ...m,
                    index: (m.index + 1) % m.items.length
                  }));
                  return;
                }
                if (e.key === "ArrowUp") {
                  e.preventDefault();
                  setCmdMenu(m => ({
                    ...m,
                    index: (m.index - 1 + m.items.length) % m.items.length
                  }));
                  return;
                }
                if (e.key === "Tab" || (e.key === "Enter" && !e.shiftKey && cmdMenu.items[cmdMenu.index])) {
                  e.preventDefault();
                  const item = cmdMenu.items[cmdMenu.index];
                  setText(item.cmd + " ");
                  setCmdMenu({ open: false, items: [], index: 0 });
                  return;
                }
                if (e.key === "Escape") {
                  setCmdMenu({ open: false, items: [], index: 0 });
                  return;
                }
              }
              if (emojiMenu.open && emojiMenu.items.length) {
                if (e.key === "ArrowDown") {
                  e.preventDefault();
                  setEmojiMenu(m => ({
                    ...m,
                    index: (m.index + 1) % m.items.length
                  }));
                  return;
                }
                if (e.key === "ArrowUp") {
                  e.preventDefault();
                  setEmojiMenu(m => ({
                    ...m,
                    index: (m.index - 1 + m.items.length) % m.items.length
                  }));
                  return;
                }
                if (e.key === "Tab" || (e.key === "Enter" && !e.shiftKey)) {
                  e.preventDefault();
                  const item = emojiMenu.items[emojiMenu.index];
                  if (item) {
                    const before = text.slice(0, emojiMenu.start);
                    const after = text.slice(emojiMenu.end);
                    setText(before + ":" + item.code + ":" + after);
                  }
                  setEmojiMenu({ open: false, items: [], index: 0, start: 0, end: 0 });
                  return;
                }
                if (e.key === "Escape") {
                  setEmojiMenu({ open: false, items: [], index: 0, start: 0, end: 0 });
                  return;
                }
              }
              if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                send(e);
              }
            }}
            placeholder={
              channel === "general"
                ? "Message #general… (@Name · /appshare slug)"
                : "Message " + (dmPeerFromChannel(channel, userEmail) || "user") + "…"
            }
            rows={2}
            style={{
              width: "100%",
              resize: "none",
              padding: "12px 12px 22px",
              borderRadius: 10,
              border: "1px solid var(--border)",
              background: "var(--surface2)",
              color: "var(--text)",
              fontFamily: "inherit",
              fontSize: 13,
              outline: "none",
              boxSizing: "border-box"
            }}
          />
          <span
            className={
              "msg-char-count" +
              (text.length >= (isNitroUser() ? 4000 : 2000)
                ? " limit"
                : text.length > (isNitroUser() ? 3600 : 1800)
                ? " warn"
                : "")
            }
          >
            {text.length}/{chatCharLimit()}
          </span>
          </div>
          <button
            type="submit"
            className="notes-btn"
            disabled={sending || (!text.trim() && !(pendingImage && pendingImage.file))}
            style={{ height: 40 }}
          >
            {sending ? "…" : "Send"}
          </button>
        </form>
        ) : null}
      </div>

      {/* Member list */}
      {showMembers && (
        <div className="chat-member-panel">
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "0 6px 8px" }}>
            <strong style={{ fontSize: 12 }}>Members</strong>
            <button type="button" className="notes-btn" style={{ fontSize: 10, padding: "2px 6px" }} onClick={() => setShowMembers(false)}>
              Hide
            </button>
          </div>
          {(() => {
            const admins = memberList.filter(p => p.is_admin);
            const others = memberList.filter(p => !p.is_admin);
            const online = others.filter(p => onlineSet.has(String(p.email || "").toLowerCase()));
            const offline = others.filter(p => !onlineSet.has(String(p.email || "").toLowerCase()));
            const memberRowFx = (p, em) => {
              const elite = !!(p.is_admin || p.is_dev || p.is_nitro || nitroEmails.has(em) || adminEmails.has(em) || devEmails.has(em));
              if (!elite) return "";
              const style =
                (memberStyleMap && memberStyleMap[em]) ||
                p.member_card_style ||
                "";
              if (style === "matrix") return " member-row-fx member-row-fx-matrix";
              if (style === "cosmic") return " member-row-fx member-row-fx-cosmic";
              if (style === "cyber" || style === "neon") return " member-row-fx member-row-fx-cyber";
              if (style === "aurora") return " member-row-fx member-row-fx-aurora";
              if (style === "gold") return " member-row-fx member-row-fx-gold";
              // No forced default from profile banner — only explicit member_card_style
              return "";
            };
            const memberRingClass = (p, em) => {
              const elite = !!(p.is_admin || p.is_dev || p.is_nitro || nitroEmails.has(em) || adminEmails.has(em) || devEmails.has(em));
              if (!elite) return "";
              const deco = avatarDecoMap[em] || "";
              if (deco.indexOf("cyber") >= 0 || deco.indexOf("hologram") >= 0) return "ring-cyan";
              if (deco.indexOf("flame") >= 0 || deco.indexOf("void") >= 0) return "ring-pink";
              return "ring-gold";
            };
            const renderRow = (p) => {
              const em = String(p.email || "").toLowerCase();
              const pStatus = presenceMap[em] || (onlineSet.has(em) ? "online" : "invisible");
              const showOnline = pStatus !== "invisible" && onlineSet.has(em);
              const fx = memberRowFx(p, em);
              const ring = memberRingClass(p, em);
              const deco = avatarDecoMap[em] || "";
              return (
                <button
                  key={em}
                  type="button"
                  className={
                    "chat-member-row" +
                    fx +
                    (p.is_turbo || turboEmails.has(em) || (p.tier || 0) >= 2
                      ? " turbo-card-glow"
                      : "")
                  }
                  onClick={() => openProfileCard(em)}
                  onContextMenu={e => {
                    e.preventDefault();
                    setMemberMenu({ x: e.clientX, y: e.clientY, email: em, isAdmin: !!p.is_admin });
                  }}
                >
                  <span style={{ position: "relative", width: 22, height: 22, flexShrink: 0 }}>
                  {ring && <span className={"member-avatar-ring " + ring} />}
                  <span
                    className={
                      "avatar-deco force-play" +
                      (deco ? " deco-" + deco : "")
                    }
                    style={{ width: 22, height: 22 }}
                  >
                    <span className="avatar-deco-inner" style={{ width: 22, height: 22, background: "var(--surface2)", fontSize: 10 }}>
                      {(avatarMap[em] || p.avatar_url) ? (
                        <img src={avatarMap[em] || p.avatar_url} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} />
                      ) : "👤"}
                    </span>
                  </span>
                  <span
                    className={
                      "presence-dot " +
                      (showOnline
                        ? pStatus === "dnd"
                          ? "dnd"
                          : pStatus === "idle"
                          ? "idle"
                          : "online"
                        : "invisible")
                    }
                    style={{ position: "absolute", right: -1, bottom: -1 }}
                    title={showOnline ? pStatus : "offline"}
                  />
                  </span>
                  <span style={{ overflow: "hidden", minWidth: 0 }}>
                    <div style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                      {p.display_name || em}
                    </div>
                    {(() => {
                      const turbo =
                        !!p.is_turbo ||
                        (p.tier || 0) >= 2 ||
                        turboEmails.has(em) ||
                        !!p.is_dev ||
                        !!p.is_admin;
                      const nitro =
                        !!p.is_nitro ||
                        nitroEmails.has(em) ||
                        turbo;
                      const pref =
                        (badgePrefMap && badgePrefMap[em]) ||
                        p.badge_display ||
                        "auto";
                      const show = resolveShowBadge(pref, turbo, nitro);
                      if (show === "turbo")
                        return (
                          <span
                            className="turbo-badge"
                            style={{ marginLeft: 0, marginTop: 2 }}
                          >
                            ⚡ TURBO
                          </span>
                        );
                      if (show === "nitro")
                        return (
                          <span
                            className="nitro-badge"
                            style={{ marginLeft: 0, marginTop: 2 }}
                          >
                            NITRO 🚀
                          </span>
                        );
                      return null;
                    })()}
                    {(p.custom_status || activityMap[em]) && (
                      <div className="member-activity">
                        {p.custom_status || activityMap[em]}
                      </div>
                    )}
                  </span>
                </button>
              );
            };
            return (
              <>
                <div className="chat-member-section">🤖 BOTS — 1</div>
                <button
                  type="button"
                  className="chat-member-row"
                  onClick={() =>
                    setProfileCard({
                      email: MODOS_EMAIL,
                      displayName: MODOS_NAME,
                      avatarUrl: "",
                      isBot: true,
                      presenceStatus: "online",
                      bio: "Official BrowserOS moderation bot. Posts public staff actions and DMs penalized users.",
                      customStatus: "Watching the server",
                      loading: false
                    })
                  }
                  style={{ cursor: "pointer" }}
                >
                  <span style={{ position: "relative", width: 22, height: 22, flexShrink: 0, fontSize: 14 }}>
                    {MODOS_AVATAR}
                    <span className="presence-dot online" style={{ position: "absolute", right: -1, bottom: -1 }} />
                  </span>
                  <span style={{ overflow: "hidden", minWidth: 0 }}>
                    <div style={{ fontWeight: 700, overflow: "hidden", textOverflow: "ellipsis" }}>
                      {MODOS_NAME}
                      <span className="bot-badge">BOT</span>
                    </div>
                    <div className="member-activity">Moderation system</div>
                  </span>
                </button>
                {admins.length > 0 && (
                  <>
                    <div className="chat-member-section">👑 ADMINS</div>
                    {admins.map(renderRow)}
                  </>
                )}
                <div className="chat-member-section">🟢 ONLINE — {online.length}</div>
                {online.map(renderRow)}
                <div className="chat-member-section">⚪ OFFLINE — {offline.length}</div>
                {offline.map(renderRow)}
              </>
            );
          })()}
        </div>
      )}
      {!showMembers && (
        <button
          type="button"
          className="notes-btn"
          style={{ position: "absolute", right: 8, top: 8, zIndex: 5, fontSize: 11 }}
          onClick={() => setShowMembers(true)}
        >
          Members
        </button>
      )}

      {memberMenu && (
        <div
          className="chat-ctx-menu"
          style={{ left: memberMenu.x, top: memberMenu.y }}
          onMouseLeave={() => setMemberMenu(null)}
        >
          <button type="button" onClick={() => { openDm(memberMenu.email); setMemberMenu(null); }}>
            ✉️ Send Direct Message
          </button>
          <button type="button" onClick={() => { openProfileCard(memberMenu.email); setMemberMenu(null); }}>
            👤 View Profile
          </button>
          {(window.__browserOSProfile && window.__browserOSProfile.is_admin) && (
            <>
              <button
                type="button"
                onClick={() => {
                  setText("/timeout " + memberMenu.email + " 60 ");
                  setMemberMenu(null);
                }}
              >
                ⏱️ Timeout…
              </button>
              <button
                type="button"
                onClick={() => {
                  setText("/kick " + memberMenu.email + " ");
                  setMemberMenu(null);
                }}
              >
                🚪 Kick…
              </button>
              <button
                type="button"
                onClick={() => {
                  setText("/ban " + memberMenu.email + " ");
                  setMemberMenu(null);
                }}
              >
                🔨 Ban…
              </button>
              <button
                type="button"
                onClick={() => {
                  setText("/warn " + memberMenu.email + " ");
                  setMemberMenu(null);
                }}
              >
                👑 Manage / Warn…
              </button>
              {isPrimaryOwnerClient() && (
                <>
                  <button
                    type="button"
                    onClick={async () => {
                      const client = getSupabaseClient();
                      const em = memberMenu.email;
                      const enabling = !nitroEmails.has(em);
                      setMemberMenu(null);
                      if (!client) return;
                      const { error } = await client.rpc("owner_set_tier", {
                        target_email: em,
                        new_tier: enabling ? 1 : 0
                      });
                      if (error) {
                        setError(error.message || "Nitro toggle failed.");
                        return;
                      }
                      setNitroEmails(prev => {
                        const n = new Set(prev);
                        if (enabling) n.add(em);
                        else n.delete(em);
                        return n;
                      });
                      if (!enabling) {
                        setTurboEmails(prev => {
                          const n = new Set(prev);
                          n.delete(em);
                          return n;
                        });
                      }
                      setMemberList(prev =>
                        prev.map(p =>
                          String(p.email || "").toLowerCase() === em
                            ? {
                                ...p,
                                is_nitro: enabling,
                                is_turbo: enabling ? p.is_turbo : false,
                                tier: enabling ? Math.max(1, p.tier || 0) : 0
                              }
                            : p
                        )
                      );
                    }}
                  >
                    🚀{" "}
                    {nitroEmails.has(memberMenu.email)
                      ? "Revoke Nitro"
                      : "Grant Nitro"}
                  </button>
                  <button
                    type="button"
                    onClick={async () => {
                      const client = getSupabaseClient();
                      const em = memberMenu.email;
                      const enabling = !turboEmails.has(em);
                      setMemberMenu(null);
                      if (!client) return;
                      const { error } = await client.rpc("owner_set_tier", {
                        target_email: em,
                        new_tier: enabling ? 2 : 0
                      });
                      if (error) {
                        setError(error.message || "Turbo toggle failed.");
                        return;
                      }
                      setTurboEmails(prev => {
                        const n = new Set(prev);
                        if (enabling) n.add(em);
                        else n.delete(em);
                        return n;
                      });
                      setNitroEmails(prev => {
                        const n = new Set(prev);
                        if (enabling) n.add(em);
                        else n.delete(em);
                        return n;
                      });
                      setMemberList(prev =>
                        prev.map(p =>
                          String(p.email || "").toLowerCase() === em
                            ? {
                                ...p,
                                is_turbo: enabling,
                                is_nitro: enabling || p.is_nitro,
                                tier: enabling ? 2 : 0
                              }
                            : p
                        )
                      );
                    }}
                  >
                    ⚡{" "}
                    {turboEmails.has(memberMenu.email)
                      ? "Revoke Turbo"
                      : "Grant Turbo"}
                  </button>
                  <button
                    type="button"
                    onClick={async () => {
                      const client = getSupabaseClient();
                      const em = memberMenu.email;
                      setMemberMenu(null);
                      if (!client) return;
                      const role = prompt(
                        "Set role for " + em + " (user / admin / dev):",
                        "admin"
                      );
                      if (!role) return;
                      const { error } = await client.rpc("owner_set_role", {
                        target_email: em,
                        new_role: String(role).toLowerCase().trim()
                      });
                      if (error) {
                        setError(error.message || "Role change failed.");
                        return;
                      }
                      setError("");
                      alert("Role updated to " + role);
                    }}
                  >
                    👑 Set role…
                  </button>
                </>
              )}
            </>
          )}
        </div>
      )}
    </div>
  );
}

    js: `function App() {
  const canvasRef = React.useRef(null);
  const drawing = React.useRef(false);

  const getPos = (e) => {
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    return {
      x: e.clientX - rect.left,
      y: e.clientY - rect.top
    };
  };

  const onMouseDown = (e) => {
    drawing.current = true;
    const ctx = canvasRef.current.getContext("2d");
    const { x, y } = getPos(e);
    ctx.beginPath();
    ctx.moveTo(x, y);
  };

  const onMouseMove = (e) => {
    if (!drawing.current) return;
    const ctx = canvasRef.current.getContext("2d");
    const { x, y } = getPos(e);
    ctx.strokeStyle = "#6ee7b7";
    ctx.lineWidth = 3;
    ctx.lineCap = "round";
    ctx.lineTo(x, y);
    ctx.stroke();
  };

  const onMouseUp = () => {
    drawing.current = false;
  };

  const clear = () => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  };

  return (
    <div className="wrap">
      <h2 style={{ margin: 0 }}>Paint Pad</h2>
      <canvas
        ref={canvasRef}
        width={480}
        height={320}
        onMouseDown={onMouseDown}
        onMouseMove={onMouseMove}
        onMouseUp={onMouseUp}
        onMouseLeave={onMouseUp}
      />
      <button type="button" onClick={clear}>Clear</button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("app-root")).render(<App />);`

  } catch (e) {

    js: `function App() {
  const canvasRef = React.useRef(null);
  const keys = React.useRef({});
  const player = React.useRef({ x: 40, y: 40, w: 24, h: 24 });

  React.useEffect(() => {
    const onDown = (e) => { keys.current[e.key] = true; };
    const onUp = (e) => { keys.current[e.key] = false; };
    window.addEventListener("keydown", onDown);
    window.addEventListener("keyup", onUp);

    let raf = 0;
    const loop = () => {
      const canvas = canvasRef.current;
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      const p = player.current;
      const speed = 3;
      if (keys.current["ArrowLeft"] || keys.current["a"]) p.x -= speed;
      if (keys.current["ArrowRight"] || keys.current["d"]) p.x += speed;
      if (keys.current["ArrowUp"] || keys.current["w"]) p.y -= speed;
      if (keys.current["ArrowDown"] || keys.current["s"]) p.y += speed;
      p.x = Math.max(0, Math.min(canvas.width - p.w, p.x));
      p.y = Math.max(0, Math.min(canvas.height - p.h, p.y));

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#6ee7b7";
      ctx.fillRect(p.x, p.y, p.w, p.h);

      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);

    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener("keydown", onDown);
      window.removeEventListener("keyup", onUp);
    };
  }, []);

  return (
    <div>
      <h2 style={{ margin: "0 0 10px" }}>Game Loop Starter</h2>
      <canvas ref={canvasRef} width={480} height={320} tabIndex={0} />
      <div className="hint">Move with Arrow keys or WASD</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("app-root")).render(<App />);`

    setFormError("");

      title: p.title || "",
      slug: p.slug || "",

      html: p.html || "",
      css: p.css || "",

    const payload = {
      format: "osapp",
      version: 1,
      title: p.title,
      slug: p.slug,
      icon: p.icon,
      html: p.html,
      css: p.css,
      js: p.js
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {
      type: "application/json"
    });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = (p.slug || "app") + ".osapp";
    a.click();
    URL.revokeObjectURL(a.href);

  const uniqueSlug = (base) => {
    let slug = normalizeProjectSlug(base) || "imported";
    if (isReservedOsSlug(slug)) slug = slug + "-app";
    const existing = new Set(UserProjects.get().map(p => p.slug));
    if (!existing.has(slug)) return slug;
    let n = 2;
    while (existing.has(slug + "-copy" + (n === 2 ? "" : n))) n++;
    // first conflict → slug-copy, then slug-copy3...
    if (!existing.has(slug + "-copy")) return slug + "-copy";
    n = 2;
    while (existing.has(slug + "-copy" + n)) n++;
    return slug + "-copy" + n;
  };

  const importAppFile = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try {

        if (!data || typeof data !== "object") throw new Error("Invalid file");
        let slug = normalizeProjectSlug(data.slug || data.title || "imported");
        if (!slug) slug = "imported";

const ArcadeStore = {
  key: "browserOS_arcade_v1",
  defaultState() {
    return {
      xp: 0,
      level: 1,
      best: { overload: 0, packet: 0, tabs: 0, terminal: 0 },
      recent: [],
      achievements: {},
      daily: null,
      stats: { gamesPlayed: 0 }
    };
  },
  load() {
    try {
      const raw = localStorage.getItem(this.key);
      if (!raw) return this.defaultState();
      return Object.assign(this.defaultState(), JSON.parse(raw));
    } catch (_) {
      return this.defaultState();
    }
  },
  save(state) {
    try {
      localStorage.setItem(this.key, JSON.stringify(state));
    } catch (_) {}
  },
  xpForLevel(lv) {
    return 500 + (lv - 1) * 400;
  },
  addXp(amount) {
    const s = this.load();
    s.xp += Math.max(0, amount | 0);
    while (s.xp >= this.xpForLevel(s.level)) {
      s.xp -= this.xpForLevel(s.level);
      s.level += 1;
    }
    this.save(s);
    return s;
  },
  recordScore(game, score, meta) {
    const s = this.load();
    const sc = Math.max(0, Math.min(5000000, Math.floor(Number(score) || 0)));
    if (sc > (s.best[game] || 0)) s.best[game] = sc;
    s.recent.unshift({
      game,
      score: sc,
      at: Date.now(),
      meta: meta || null
    });
    s.recent = s.recent.slice(0, 12);
    s.stats.gamesPlayed = (s.stats.gamesPlayed || 0) + 1;
    // XP: soft formula, not a privilege
    const xpGain = Math.min(250, Math.floor(sc / 80) + 10);
    s.xp += xpGain;
    while (s.xp >= this.xpForLevel(s.level)) {
      s.xp -= this.xpForLevel(s.level);
      s.level += 1;
    }
    this.save(s);
    try {
      if (typeof Leaderboards !== "undefined" && Leaderboards.save) {
        Leaderboards.save("arcade_" + game, {
          name:
            (typeof localStorage !== "undefined" && localStorage.getItem("username")) ||
            "Player",
          score: sc,
          date: Date.now()
        });
      }
    } catch (_) {}
    return { state: s, xpGain };
  },
  unlock(id) {
    const s = this.load();
    if (s.achievements[id]) return s;
    s.achievements[id] = Date.now();
    s.xp += 40;
    while (s.xp >= this.xpForLevel(s.level)) {
      s.xp -= this.xpForLevel(s.level);
      s.level += 1;
    }
    this.save(s);
    return s;
  },
  dailyChallenge() {
    // Deterministic by UTC date string (cosmetic — not security)
    const day = new Date().toISOString().slice(0, 10);
    const s = this.load();
    if (s.daily && s.daily.day === day) return s.daily;
    const pool = [
      { game: "overload", desc: "Survive System Overload for 60 seconds", target: 60, kind: "survive_sec" },
      { game: "packet", desc: "Deliver 25 packets in Packet Rush", target: 25, kind: "deliver" },
      { game: "tabs", desc: "Complete 12 Tab Frenzy tasks", target: 12, kind: "tasks" },
      { game: "terminal", desc: "Escape Terminal with under 40 commands", target: 40, kind: "escape_cmds" }
    ];
    let h = 0;
    for (let i = 0; i < day.length; i++) h = (h * 31 + day.charCodeAt(i)) >>> 0;
    const challenge = Object.assign({ day, progress: 0, done: false }, pool[h % pool.length]);
    s.daily = challenge;
    this.save(s);
    return challenge;
  },
  updateDaily(kind, value) {
    const s = this.load();
    const d = this.dailyChallenge();
    if (!d || d.done || d.kind !== kind) return d;
    d.progress = Math.max(d.progress || 0, value);
    if (d.progress >= d.target) {
      d.done = true;
      s.xp += 120;
      while (s.xp >= this.xpForLevel(s.level)) {
        s.xp -= this.xpForLevel(s.level);
        s.level += 1;
      }
    }
    s.daily = d;
    this.save(s);
    return d;
  }
};

// Extend local Leaderboards keys for arcade (client-side only)
if (typeof Leaderboards !== "undefined" && Leaderboards.keys) {
  Leaderboards.keys.arcade_overload = "browserOS_arcade_overload";
  Leaderboards.keys.arcade_packet = "browserOS_arcade_packet";
  Leaderboards.keys.arcade_tabs = "browserOS_arcade_tabs";
  Leaderboards.keys.arcade_terminal = "browserOS_arcade_terminal";
  const _save = Leaderboards.save.bind(Leaderboards);
  Leaderboards.save = function (key, entry) {
    if (String(key).indexOf("arcade_") === 0) {
      const scores = this.get(key);
      scores.push(entry);
      scores.sort((a, b) => (b.score || 0) - (a.score || 0));
      try {
        localStorage.setItem(this.keys[key], JSON.stringify(scores.slice(0, 50)));
      } catch (_) {}
      return scores;
    }
    return _save(key, entry);
  };
}

function arcadeFmtTime(sec) {
  const s = Math.max(0, Math.floor(sec));
  const m = Math.floor(s / 60);
  const r = s % 60;
  return (m < 10 ? "0" : "") + m + ":" + (r < 10 ? "0" : "") + r;
}

/* ── System Overload ── */
const SO_EVENTS = [
  { id: "mem", title: "Memory leak detected", detail: "Process renderer-worker growing", correct: "KILL" },
  { id: "cpu", title: "CPU process runaway", detail: "chrome-helper at 99% core", correct: "KILL" },
  { id: "net", title: "Network connection unstable", detail: "Packet loss on uplink", correct: "RESTART" },
  { id: "disk", title: "Storage almost full", detail: "Cache partition 97%", correct: "FIX" },
  { id: "app", title: "Application crashed", detail: "notes.os exited code 1", correct: "RESTART" },
  { id: "sus", title: "Suspicious process detected", detail: "unknown binary in /tmp", correct: "KILL" },
  { id: "rend", title: "Browser renderer stopped responding", detail: "Tab freeze reported", correct: "RESTART" },
  { id: "bg", title: "Background task consuming resources", detail: "sync-daemon elevated", correct: "KILL" },
  { id: "dns", title: "DNS resolution lagging", detail: "Queries timing out", correct: "FIX" },
  { id: "noise", title: "Harmless log spam", detail: "Verbose telemetry noise", correct: "IGNORE" }
];

function SystemOverloadGame({ onBack, onFinish }) {
  const [running, setRunning] = useState(false);
  const [paused, setPaused] = useState(false);
  const [stability, setStability] = useState(100);
  const [cpu, setCpu] = useState(30);
  const [ram, setRam] = useState(40);
  const [net, setNet] = useState(20);
  const [events, setEvents] = useState([]);
  const [score, setScore] = useState(0);
  const [combo, setCombo] = useState(0);
  const [bestCombo, setBestCombo] = useState(0);
  const [handled, setHandled] = useState(0);
  const [correctN, setCorrectN] = useState(0);
  const [elapsed, setElapsed] = useState(0);
  const [over, setOver] = useState(null);
  const tickRef = useRef(null);
  const spawnRef = useRef(null);
  const stateRef = useRef({});

  stateRef.current = { stability, cpu, ram, net, events, score, combo, bestCombo, handled, correctN, elapsed, paused, running };

  const cleanup = () => {
    if (tickRef.current) clearInterval(tickRef.current);
    if (spawnRef.current) clearInterval(spawnRef.current);
    tickRef.current = null;
    spawnRef.current = null;
  };

  useEffect(() => () => cleanup(), []);

  useEffect(() => {
    const onVis = () => {
      if (document.hidden) setPaused(true);
    };
    document.addEventListener("visibilitychange", onVis);
    return () => document.removeEventListener("visibilitychange", onVis);
  }, []);

  const endGame = useCallback(() => {
    cleanup();
    setRunning(false);
    const s = stateRef.current;
    const accuracy = s.handled ? Math.round((s.correctN / s.handled) * 100) : 0;
    const finalScore = Math.min(
      500000,
      Math.floor(s.score + s.elapsed * 8 + s.bestCombo * 25 + accuracy * 5)
    );
    const result = {
      score: finalScore,
      elapsed: s.elapsed,
      handled: s.handled,
      accuracy,
      bestCombo: s.bestCombo
    };
    setOver(result);
    ArcadeStore.recordScore("overload", finalScore, result);
    if (s.elapsed >= 60) ArcadeStore.unlock("so_under_pressure");
    if (s.handled >= 1) ArcadeStore.unlock("so_first");
    if (s.bestCombo >= 10) ArcadeStore.unlock("so_overclocked");
    ArcadeStore.updateDaily("survive_sec", s.elapsed);
    if (onFinish) onFinish(result);
  }, [onFinish]);

  const start = () => {
    cleanup();
    setStability(100);
    setCpu(28);
    setRam(35);
    setNet(22);
    setEvents([]);
    setScore(0);
    setCombo(0);
    setBestCombo(0);
    setHandled(0);
    setCorrectN(0);
    setElapsed(0);
    setOver(null);
    setPaused(false);
    setRunning(true);

    tickRef.current = setInterval(() => {
      const st = stateRef.current;
      if (!st.running || st.paused) return;
      setElapsed(e => e + 1);
      setCpu(c => Math.min(99, c + (Math.random() * 3 - 0.5)));
      setRam(r => Math.min(99, r + (Math.random() * 2.5 - 0.4)));
      setNet(n => Math.min(99, Math.max(5, n + (Math.random() * 4 - 1.5))));
      setStability(s => {
        let next = s - 0.15 - st.events.length * 0.12;
        if (st.cpu > 85) next -= 0.2;
        if (st.ram > 90) next -= 0.25;
        next = Math.max(0, Math.min(100, next));
        if (next <= 0) {
          setTimeout(() => endGame(), 0);
        }
        return next;
      });
    }, 1000);

    const scheduleSpawn = () => {
      if (spawnRef.current) clearInterval(spawnRef.current);
      const interval = () => {
        const st = stateRef.current;
        if (!st.running || st.paused) return;
        const pace = Math.max(900, 2800 - st.elapsed * 25);
        // re-arm with dynamic pace via recursive timeout-like interval adjust
        const ev = SO_EVENTS[Math.floor(Math.random() * SO_EVENTS.length)];
        const id = "e" + Date.now() + Math.random();
        setEvents(prev => {
          if (prev.length >= 4) return prev;
          return prev.concat([{ ...ev, uid: id, born: Date.now() }]);
        });
      };
      spawnRef.current = setInterval(interval, Math.max(1000, 2600 - stateRef.current.elapsed * 20));
      interval();
    };
    scheduleSpawn();
    // refresh spawn rate every 5s
    const paceIv = setInterval(() => {
      if (!stateRef.current.running) {
        clearInterval(paceIv);
        return;
      }
      if (spawnRef.current) clearInterval(spawnRef.current);
      spawnRef.current = setInterval(() => {
        const st = stateRef.current;
        if (!st.running || st.paused) return;
        const ev = SO_EVENTS[Math.floor(Math.random() * SO_EVENTS.length)];
        const id = "e" + Date.now() + Math.random();
        setEvents(prev => (prev.length >= 4 ? prev : prev.concat([{ ...ev, uid: id, born: Date.now() }])));
      }, Math.max(800, 2600 - stateRef.current.elapsed * 22));
    }, 5000);
    // store paceIv on spawnRef cleanup via effect — attach to tick cleanup
    const _c = cleanup;
    // monkey: clear pace on unmount via additional ref
    tickRef.current._pace = paceIv;
  };

  useEffect(() => {
    return () => {
      if (tickRef.current && tickRef.current._pace) clearInterval(tickRef.current._pace);
    };
  }, []);

  const act = (uid, action) => {
    const st = stateRef.current;
    if (!st.running || st.paused) return;
    const ev = st.events.find(e => e.uid === uid);
    if (!ev) return;
    setEvents(prev => prev.filter(e => e.uid !== uid));
    setHandled(h => h + 1);
    const speedBonus = Math.max(0, 8 - Math.floor((Date.now() - ev.born) / 400));
    if (action === ev.correct) {
      setCorrectN(c => c + 1);
      setCombo(c => {
        const n = c + 1;
        setBestCombo(b => Math.max(b, n));
        return n;
      });
      setScore(sc => sc + 40 + speedBonus * 5 + stateRef.current.combo * 3);
      setStability(s => Math.min(100, s + 4));
      if (ev.correct === "KILL") setCpu(c => Math.max(10, c - 8));
      if (ev.correct === "FIX") setRam(r => Math.max(15, r - 6));
      if (ev.correct === "RESTART") setNet(n => Math.max(10, n - 5));
    } else {
      setCombo(0);
      setStability(s => Math.max(0, s - 12));
      setCpu(c => Math.min(99, c + 6));
      setScore(sc => Math.max(0, sc - 15));
    }
  };

  const meter = (label, val, color) => (
    <div className="arcade-meter" key={label}>
      <label>
        <span>{label}</span>
        <span>{Math.round(val)}%</span>
      </label>
      <div className="track">
        <div className="fill" style={{ width: Math.round(val) + "%", background: color }} />
      </div>
    </div>
  );

  return (
    <div className="arcade-game">
      <div className="arcade-bar">
        <button type="button" onClick={() => { cleanup(); onBack && onBack(); }}>← Arcade</button>
        <span className="arcade-stat">⏱ {arcadeFmtTime(elapsed)}</span>
        <span className="arcade-stat">Score {score}</span>
        <span className="arcade-stat">Combo ×{combo}</span>
        {!running && !over && (
          <button type="button" onClick={start}>Start</button>
        )}
        {running && (
          <button type="button" onClick={() => setPaused(p => !p)}>{paused ? "Resume" : "Pause"}</button>
        )}
      </div>
      <div className="arcade-stage">
        {meter("CPU", cpu, "#f59e0b")}
        {meter("RAM", ram, "#818cf8")}
        {meter("NETWORK", net, "#38bdf8")}
        {meter("STABILITY", stability, stability > 40 ? "#34d399" : "#f87171")}
        {events.map(ev => (
          <div className="arcade-event" key={ev.uid}>
            <div style={{ fontWeight: 800, fontSize: 13 }}>{ev.title}</div>
            <div style={{ fontSize: 11, color: "var(--text-muted)" }}>{ev.detail}</div>
            <div className="arcade-actions">
              {["FIX", "RESTART", "KILL", "IGNORE"].map(a => (
                <button key={a} type="button" onClick={() => act(ev.uid, a)}>{a}</button>
              ))}
            </div>
          </div>
        ))}
        {!running && !over && (
          <p style={{ fontSize: 13, color: "var(--text-muted)", marginTop: 16 }}>
            Keep SYSTEM STABILITY above 0%. Match the right response to each alert. Speed builds combo.
          </p>
        )}
        {over && (
          <div className="arcade-overlay">
            <div className="arcade-modal">
              <h2>SYSTEM FAILURE</h2>
              <p>
                Runtime: {arcadeFmtTime(over.elapsed)}
                <br />Events handled: {over.handled}
                <br />Accuracy: {over.accuracy}%
                <br />Best combo: {over.bestCombo}
                <br />Score: {over.score.toLocaleString()}
              </p>
              <div style={{ display: "flex", gap: 8, justifyContent: "center", marginTop: 12 }}>
                <button type="button" className="notes-btn" onClick={start}>Retry</button>
                <button type="button" className="notes-btn" onClick={() => onBack && onBack()}>Arcade</button>
              </div>
            </div>
          </div>
        )}
        {paused && running && (
          <div className="arcade-overlay">
            <div className="arcade-modal">
              <h2>Paused</h2>
              <button type="button" className="notes-btn" onClick={() => setPaused(false)}>Resume</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ── Packet Rush ── */
function PacketRushGame({ onBack }) {
  const canvasRef = useRef(null);
  const [running, setRunning] = useState(false);
  const [paused, setPaused] = useState(false);
  const [score, setScore] = useState(0);
  const [delivered, setDelivered] = useState(0);
  const [lost, setLost] = useState(0);
  const [blocked, setBlocked] = useState(0);
  const [stability, setStability] = useState(100);
  const [over, setOver] = useState(null);
  const g = useRef(null);
  const raf = useRef(null);

  const cleanup = () => {
    if (raf.current) cancelAnimationFrame(raf.current);
    raf.current = null;
  };
  useEffect(() => () => cleanup(), []);

  const initGraph = () => {
    const nodes = [
      { id: 0, x: 0.12, y: 0.5, cap: 3, load: 0, label: "A" },
      { id: 1, x: 0.35, y: 0.28, cap: 3, load: 0, label: "B" },
      { id: 2, x: 0.35, y: 0.72, cap: 3, load: 0, label: "C" },
      { id: 3, x: 0.58, y: 0.5, cap: 4, load: 0, label: "D" },
      { id: 4, x: 0.82, y: 0.5, cap: 5, load: 0, label: "SRV", server: true }
    ];
    const edges = [
      [0, 1], [0, 2], [1, 3], [2, 3], [3, 4], [1, 2]
    ].map(([a, b]) => ({ a, b, ok: true, cong: 0 }));
    return {
      nodes,
      edges,
      packets: [],
      selected: null,
      t: 0,
      spawnAcc: 0,
      score: 0,
      delivered: 0,
      lost: 0,
      blocked: 0,
      stability: 100
    };
  };

  const loop = () => {
    const state = g.current;
    const canvas = canvasRef.current;
    if (!state || !canvas || state.paused || state.dead) {
      raf.current = requestAnimationFrame(loop);
      return;
    }
    const ctx = canvas.getContext("2d");
    const w = canvas.width;
    const h = canvas.height;
    state.t += 1;
    state.spawnAcc += 1;
    const spawnEvery = Math.max(25, 70 - Math.floor(state.t / 120));
    if (state.spawnAcc >= spawnEvery) {
      state.spawnAcc = 0;
      const types = ["normal", "normal", "priority", "large", "suspicious"];
      const type = types[Math.floor(Math.random() * types.length)];
      state.packets.push({
        id: "p" + state.t + Math.random(),
        type,
        node: 0,
        progress: 0,
        edge: null,
        target: type === "suspicious" ? -1 : 4,
        age: 0
      });
    }
    // random edge issues
    if (state.t % 180 === 0) {
      const e = state.edges[Math.floor(Math.random() * state.edges.length)];
      e.ok = Math.random() > 0.25;
      e.cong = Math.random() * 0.6;
    }
    state.packets.forEach(p => {
      p.age++;
      if (p.edge) {
        const ed = state.edges[p.edge];
        const speed = (p.type === "priority" ? 0.04 : p.type === "large" ? 0.018 : 0.028) * (1 - (ed.cong || 0) * 0.5);
        p.progress += speed;
        if (p.progress >= 1) {
          const dest = ed.b === p.from ? ed.a : ed.b;
          p.node = dest;
          p.edge = null;
          p.progress = 0;
          p.from = null;
          state.nodes[dest].load = Math.max(0, (state.nodes[dest].load || 0) - 1);
          if (state.nodes[dest].server) {
            if (p.type === "suspicious") {
              state.stability -= 8;
              state.lost++;
            } else {
              state.delivered++;
              state.score += p.type === "priority" ? 80 : p.type === "large" ? 50 : 30;
            }
            p.dead = true;
          } else if ((state.nodes[dest].load || 0) > state.nodes[dest].cap) {
            state.lost++;
            state.stability -= 5;
            p.dead = true;
          }
        }
      } else if (p.type !== "suspicious" && p.age > 400) {
        state.lost++;
        state.stability -= 4;
        p.dead = true;
      }
    });
    state.packets = state.packets.filter(p => !p.dead);
    state.stability = Math.max(0, Math.min(100, state.stability));
    if (state.stability <= 0 || state.lost >= 20) {
      state.dead = true;
      const finalScore = Math.min(500000, state.score + state.delivered * 15 + state.blocked * 40);
      setOver({
        score: finalScore,
        delivered: state.delivered,
        lost: state.lost,
        blocked: state.blocked
      });
      setRunning(false);
      ArcadeStore.recordScore("packet", finalScore, {
        delivered: state.delivered,
        lost: state.lost,
        blocked: state.blocked
      });
      if (state.delivered >= 1) ArcadeStore.unlock("pr_first");
      if (state.blocked >= 5) ArcadeStore.unlock("pr_firewall");
      if (state.delivered >= 25) ArcadeStore.unlock("pr_storm");
      ArcadeStore.updateDaily("deliver", state.delivered);
    }
    setScore(state.score);
    setDelivered(state.delivered);
    setLost(state.lost);
    setBlocked(state.blocked);
    setStability(state.stability);

    // draw
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = "#0b1220";
    ctx.fillRect(0, 0, w, h);
    state.edges.forEach((e, i) => {
      const a = state.nodes[e.a];
      const b = state.nodes[e.b];
      ctx.beginPath();
      ctx.moveTo(a.x * w, a.y * h);
      ctx.lineTo(b.x * w, b.y * h);
      ctx.strokeStyle = !e.ok ? "#f87171" : e.cong > 0.3 ? "#f59e0b" : "#334155";
      ctx.lineWidth = 3;
      ctx.stroke();
    });
    state.nodes.forEach(n => {
      const x = n.x * w;
      const y = n.y * h;
      ctx.beginPath();
      ctx.arc(x, y, n.server ? 18 : 14, 0, Math.PI * 2);
      ctx.fillStyle = n.server ? "#34d399" : state.selected === n.id ? "#818cf8" : "#1e293b";
      ctx.fill();
      ctx.strokeStyle = "#94a3b8";
      ctx.stroke();
      ctx.fillStyle = "#e2e8f0";
      ctx.font = "11px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(n.label, x, y + 4);
    });
    state.packets.forEach(p => {
      let x, y;
      if (p.edge != null) {
        const ed = state.edges[p.edge];
        const a = state.nodes[ed.a];
        const b = state.nodes[ed.b];
        const from = p.from === ed.a ? a : b;
        const to = p.from === ed.a ? b : a;
        x = (from.x + (to.x - from.x) * p.progress) * w;
        y = (from.y + (to.y - from.y) * p.progress) * h;
      } else {
        x = state.nodes[p.node].x * w;
        y = state.nodes[p.node].y * h - 20;
      }
      const colors = { normal: "#38bdf8", priority: "#fbbf24", large: "#a78bfa", suspicious: "#f87171" };
      ctx.beginPath();
      ctx.arc(x, y, p.type === "large" ? 8 : 5, 0, Math.PI * 2);
      ctx.fillStyle = colors[p.type] || "#fff";
      ctx.fill();
    });
    raf.current = requestAnimationFrame(loop);
  };

  const start = () => {
    cleanup();
    g.current = initGraph();
    g.current.paused = false;
    g.current.dead = false;
    setOver(null);
    setRunning(true);
    setPaused(false);
    setScore(0);
    setDelivered(0);
    setLost(0);
    setBlocked(0);
    setStability(100);
    raf.current = requestAnimationFrame(loop);
  };

  useEffect(() => {
    const c = canvasRef.current;
    if (!c) return;
    const resize = () => {
      const rect = c.getBoundingClientRect();
      c.width = Math.floor(rect.width * (window.devicePixelRatio || 1));
      c.height = Math.floor(320 * (window.devicePixelRatio || 1));
    };
    resize();
    window.addEventListener("resize", resize);
    return () => window.removeEventListener("resize", resize);
  }, []);

  const onPointer = e => {
    const state = g.current;
    const canvas = canvasRef.current;
    if (!state || !canvas || state.dead) return;
    const rect = canvas.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width);
    const y = ((e.clientY - rect.top) / rect.height);
    let hit = null;
    state.nodes.forEach(n => {
      const dx = n.x - x;
      const dy = n.y - y;
      if (dx * dx + dy * dy < 0.01) hit = n.id;
    });
    if (hit == null) return;
    // block suspicious at selected node
    const sus = state.packets.find(p => p.node === hit && p.type === "suspicious" && p.edge == null);
    if (sus) {
      sus.dead = true;
      state.blocked++;
      state.score += 60;
      state.packets = state.packets.filter(p => !p.dead);
      return;
    }
    if (state.selected == null) {
      state.selected = hit;
      return;
    }
    if (state.selected === hit) {
      state.selected = null;
      return;
    }
    // route packets from selected to hit if edge exists
    const edgeIdx = state.edges.findIndex(
      e => (e.a === state.selected && e.b === hit) || (e.b === state.selected && e.a === hit)
    );
    if (edgeIdx >= 0 && state.edges[edgeIdx].ok) {
      state.packets.forEach(p => {
        if (p.node === state.selected && p.edge == null && p.type !== "suspicious") {
          p.edge = edgeIdx;
          p.from = state.selected;
          p.progress = 0;
          state.nodes[state.selected].load = (state.nodes[state.selected].load || 0) + 1;
        }
      });
    }
    state.selected = hit;
  };

  return (
    <div className="arcade-game">
      <div className="arcade-bar">
        <button type="button" onClick={() => { cleanup(); onBack && onBack(); }}>← Arcade</button>
        <span className="arcade-stat">Score {score}</span>
        <span className="arcade-stat">OK {delivered}</span>
        <span className="arcade-stat">Lost {lost}</span>
        <span className="arcade-stat">Blocked {blocked}</span>
        <span className="arcade-stat">Stab {Math.round(stability)}%</span>
        {!running && <button type="button" onClick={start}>Start</button>}
        {running && (
          <button type="button" onClick={() => {
            setPaused(p => {
              if (g.current) g.current.paused = !p;
              return !p;
            });
          }}>{paused ? "Resume" : "Pause"}</button>
        )}
      </div>
      <div className="arcade-stage">
        <p style={{ fontSize: 12, color: "var(--text-muted)", marginBottom: 8 }}>
          Tap a node to select, tap a connected node to route. Tap a node holding a red packet to block it.
        </p>
        <div className="pr-canvas-wrap">
          <canvas
            ref={canvasRef}
            className="pr-canvas"
            style={{ height: 320 }}
            onPointerDown={onPointer}
          />
        </div>
        {over && (
          <div className="arcade-overlay">
            <div className="arcade-modal">
              <h2>Network Down</h2>
              <p>
                Delivered: {over.delivered}<br />
                Lost: {over.lost}<br />
                Blocked: {over.blocked}<br />
                Score: {over.score.toLocaleString()}
              </p>
              <div style={{ display: "flex", gap: 8, justifyContent: "center", marginTop: 12 }}>
                <button type="button" className="notes-btn" onClick={start}>Retry</button>
                <button type="button" className="notes-btn" onClick={() => onBack && onBack()}>Arcade</button>
              </div>
            </div>
          </div>

}

/* ── Tab Frenzy ── */
const TF_HOSTS = ["home", "github.com", "docs.browseros", "search", "mail", "chat.os", "example.com", "news", "wiki", "music"];
function tfRandTabs(n) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const host = TF_HOSTS[Math.floor(Math.random() * TF_HOSTS.length)];
    out.push({
      id: "t" + Date.now() + i + Math.random(),
      title: host,
      host,
      pinned: false,
      audio: false,
      born: Date.now() - Math.random() * 60000,
      suspicious: Math.random() < 0.08
    });
  }
  return out;
}

function TabFrenzyGame({ onBack }) {
  const [running, setRunning] = useState(false);
  const [tabs, setTabs] = useState([]);
  const [active, setActive] = useState(null);
  const [task, setTask] = useState(null);
  const [score, setScore] = useState(0);
  const [streak, setStreak] = useState(0);
  const [done, setDone] = useState(0);
  const [mistakes, setMistakes] = useState(0);
  const [timeLeft, setTimeLeft] = useState(12);
  const [over, setOver] = useState(null);
  const timer = useRef(null);
  const taskTimer = useRef(null);

  const cleanup = () => {
    if (timer.current) clearInterval(timer.current);
    if (taskTimer.current) clearInterval(taskTimer.current);
  };
  useEffect(() => () => cleanup(), []);

  const nextTask = (list) => {
    const t = list || tabs;
    const types = ["dupes", "audio", "host", "oldest", "suspicious", "pin"];
    const kind = types[Math.floor(Math.random() * types.length)];
    if (kind === "dupes") {
      return { kind, text: "Close all duplicate tabs", check: (tabsAfter, action) => {
        const counts = {};
        tabsAfter.forEach(x => { counts[x.host] = (counts[x.host] || 0) + 1; });
        return Object.values(counts).every(c => c === 1);
      }};
    }
    if (kind === "audio") {
      const withAudio = t.filter(x => x.audio);
      if (!withAudio.length) {
        const id = t[Math.floor(Math.random() * t.length)];
        if (id) id.audio = true;
      }
      return { kind, text: "Close the tab playing audio", needsCloseAudio: true };
    }
    if (kind === "host") {
      const host = t[Math.floor(Math.random() * t.length)].host;
      return { kind, text: "Close all tabs from " + host, host };
    }
    if (kind === "oldest") {
      return { kind, text: "Close the oldest tab", needsOldest: true };
    }
    if (kind === "suspicious") {
      if (!t.some(x => x.suspicious)) {
        const id = t[Math.floor(Math.random() * t.length)];
        if (id) { id.suspicious = true; id.title = "?? " + id.title; }
      }
      return { kind, text: "Close the suspicious tab", needsSus: true };
    }
    return { kind, text: "Pin the active tab (tap Pin)", needsPin: true };
  };

  const start = () => {
    cleanup();
    let list = tfRandTabs(5);
    list[0].pinned = true;
    setTabs(list);
    setActive(list[0].id);
    setScore(0);
    setStreak(0);
    setDone(0);
    setMistakes(0);
    setOver(null);
    setRunning(true);
    setTask(nextTask(list));
    setTimeLeft(14);
    taskTimer.current = setInterval(() => {
      setTimeLeft(tl => {
        if (tl <= 1) {
          setMistakes(m => m + 1);
          setStreak(0);
          setTabs(prev => {
            const nt = nextTask(prev);
            setTask(nt);
            return prev;
          });
          return 14;
        }
        return tl - 1;
      });
    }, 1000);
  };

  const succeed = () => {
    setDone(d => d + 1);
    setStreak(s => s + 1);
    setScore(sc => sc + 50 + streak * 8 + timeLeft * 2);
    setTabs(prev => {
      let list = prev.slice();
      if (list.length < 14 && Math.random() > 0.4) {
        list = list.concat(tfRandTabs(1 + Math.floor(Math.random() * 2)));
      }
      const nt = nextTask(list);
      setTask(nt);
      setTimeLeft(Math.max(8, 14 - Math.floor(done / 3)));
      return list;
    });
    ArcadeStore.updateDaily("tasks", done + 1);
  };

  const fail = () => {
    setMistakes(m => m + 1);
    setStreak(0);
    if (mistakes + 1 >= 8) {
      cleanup();
      setRunning(false);
      const finalScore = Math.min(500000, score);
      setOver({ score: finalScore, done, mistakes: mistakes + 1 });
      ArcadeStore.recordScore("tabs", finalScore, { done, mistakes: mistakes + 1 });
      if (done >= 1) ArcadeStore.unlock("tf_first");
      if (done >= 10 && mistakes < 3) ArcadeStore.unlock("tf_clean");
    }
  };

  const closeTab = (id) => {
    if (!running) return;
    const tab = tabs.find(t => t.id === id);
    if (!tab) return;
    if (tab.pinned && task && task.kind !== "dupes") {
      fail();
      return;
    }
    const next = tabs.filter(t => t.id !== id);
    setTabs(next);
    if (active === id) setActive(next[0] ? next[0].id : null);

    let ok = false;
    if (task.needsCloseAudio && tab.audio) ok = true;
    if (task.needsSus && tab.suspicious) ok = true;
    if (task.needsOldest) {
      const oldest = tabs.reduce((a, b) => (a.born < b.born ? a : b));
      ok = oldest.id === id;
    }
    if (task.host) {
      ok = next.every(t => t.host !== task.host);
    }
    if (task.kind === "dupes") {
      const counts = {};
      next.forEach(x => { counts[x.host] = (counts[x.host] || 0) + 1; });
      ok = Object.values(counts).every(c => c === 1);
    }
    if (ok) succeed();
    else if (task.kind === "dupes" || task.host) {
      /* partial progress allowed */
    } else {
      fail();
    }
  };

  const pinActive = () => {
    if (!task || !task.needsPin || !active) return;
    setTabs(prev => prev.map(t => t.id === active ? { ...t, pinned: true } : t));
    succeed();
  };

  return (
    <div className="arcade-game">
      <div className="arcade-bar">
        <button type="button" onClick={() => { cleanup(); onBack && onBack(); }}>← Arcade</button>
        <span className="arcade-stat">Score {score}</span>
        <span className="arcade-stat">Tasks {done}</span>
        <span className="arcade-stat">⏱ {timeLeft}s</span>
        <span className="arcade-stat">Streak {streak}</span>
        {!running && <button type="button" onClick={start}>Start</button>}
        {running && task && task.needsPin && (
          <button type="button" onClick={pinActive}>Pin active</button>
        )}
      </div>
      <div className="arcade-stage">
        {task && <div className="tf-task">{task.text}</div>}
        <div className="tf-tabs">
          {tabs.map(t => (
            <button
              key={t.id}
              type="button"
              className={
                "tf-tab" +
                (active === t.id ? " active" : "") +
                (t.audio ? " audio" : "") +
                (t.pinned ? " pinned" : "")
              }
              onClick={() => setActive(t.id)}
              onDoubleClick={() => closeTab(t.id)}
            >
              {t.pinned ? "📌 " : ""}{t.audio ? "🔊 " : ""}{t.title}
            </button>
          ))}
        </div>
        <p style={{ fontSize: 12, color: "var(--text-muted)", marginTop: 10 }}>
          Tap a tab to focus. Double-tap (or use Close) to close. Red outline = audio.
        </p>
        {active && (
          <button type="button" className="notes-btn" style={{ marginTop: 8 }} onClick={() => closeTab(active)}>
            Close active tab
          </button>
        )}
        {over && (
          <div className="arcade-overlay">
            <div className="arcade-modal">
              <h2>Tab Chaos Contained</h2>
              <p>
                Tasks: {over.done}<br />
                Mistakes: {over.mistakes}<br />
                Score: {over.score.toLocaleString()}
              </p>
              <div style={{ display: "flex", gap: 8, justifyContent: "center", marginTop: 12 }}>
                <button type="button" className="notes-btn" onClick={start}>Retry</button>
                <button type="button" className="notes-btn" onClick={() => onBack && onBack()}>Arcade</button>
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ── Terminal Escape (virtual FS only) ── */
function TerminalEscapeGame({ onBack }) {
  const [lines, setLines] = useState([
    "BrowserOS recovery shell v0.3",
    "Type 'help' for commands. Find the escape sequence.",
    ""
  ]);
  const [input, setInput] = useState("");
  const [cwd, setCwd] = useState("/home/player");
  const [stage, setStage] = useState(0);
  const [cmds, setCmds] = useState(0);
  const [hints, setHints] = useState(0);
  const [started, setStarted] = useState(false);
  const [t0, setT0] = useState(0);
  const [escaped, setEscaped] = useState(false);
  const [failed, setFailed] = useState(false);
  const inputRef = useRef(null);

  const fs = useRef({
    "/": { type: "dir" },
    "/home": { type: "dir" },
    "/home/player": { type: "dir" },
    "/home/player/readme.txt": {
      type: "file",
      body: "Welcome. Logs may help. Try /logs.\nHint fragment: the key is not under the bed."
    },
    "/bin": { type: "dir" },
    "/logs": { type: "dir" },
    "/logs/boot.log": {
      type: "file",
      body: "boot ok\nwarn: config missing passphrase\nnote: see /config/gate.cfg\nauth_token_hint=BLUE"
    },
    "/logs/auth.log": {
      type: "file",
      body: "failed login\nhint=SKY\ncombine with boot color word"
    },
    "/config": { type: "dir" },
    "/config/gate.cfg": {
      type: "file",
      body: "escape_requires=BLUESKY\nusage: unlock <code>"
    },
    "/secret": { type: "dir" },
    "/secret/vault.txt": {
      type: "file",
      body: "locked — unlock first"
    }
  });

  const resolve = (path) => {
    if (!path || path === ".") return cwd;
    if (path === "..") {
      if (cwd === "/") return "/";
      const parts = cwd.split("/").filter(Boolean);
      parts.pop();
      return "/" + parts.join("/") || "/";
    }
    if (path.startsWith("/")) return path.replace(/\/+$/, "") || "/";
    const base = cwd === "/" ? "" : cwd;
    return (base + "/" + path).replace(/\/+/g, "/");
  };

  const listDir = (path) => {
    const prefix = path === "/" ? "/" : path + "/";
    const names = new Set();
    Object.keys(fs.current).forEach(k => {
      if (k === path) return;
      if (path === "/" && k.split("/").filter(Boolean).length === 1) {
        names.add(k.split("/").filter(Boolean)[0] + (fs.current[k].type === "dir" ? "/" : ""));
      } else if (k.startsWith(prefix)) {
        const rest = k.slice(prefix.length);
        if (!rest) return;
        const name = rest.split("/")[0];
        const full = prefix + name;
        names.add(name + (fs.current[full] && fs.current[full].type === "dir" ? "/" : ""));
      }
    });
    return Array.from(names).sort();
  };

  const run = (raw) => {
    if (escaped || failed) return;
    const line = String(raw || "").trim();
    if (!line) return;
    if (!started) {
      setStarted(true);
      setT0(Date.now());
    }
    setCmds(c => c + 1);
    setLines(prev => prev.concat(["$ " + line]));
    const parts = line.split(/\s+/);
    const cmd = parts[0].toLowerCase();
    const arg = parts[1] || "";

    if (cmd === "help") {
      setLines(prev => prev.concat([
        "commands: ls cd pwd cat clear help hint unlock",
        "(virtual FS only — no real system access)"
      ]));
    } else if (cmd === "clear") {
      setLines([]);
    } else if (cmd === "pwd") {
      setLines(prev => prev.concat([cwd]));
    } else if (cmd === "ls") {
      const p = resolve(arg || ".");
      if (!fs.current[p] || fs.current[p].type !== "dir") {
        setLines(prev => prev.concat(["ls: not a directory"]));
      } else {
        const items = listDir(p);
        setLines(prev => prev.concat([items.join("  ") || "(empty)"]));
      }
    } else if (cmd === "cd") {
      const p = resolve(arg || "/home/player");
      if (!fs.current[p] || fs.current[p].type !== "dir") {
        setLines(prev => prev.concat(["cd: no such directory"]));
      } else {
        setCwd(p);
        if (p === "/logs") setStage(s => Math.max(s, 1));
        if (p === "/config") setStage(s => Math.max(s, 2));
      }
    } else if (cmd === "cat") {
      const p = resolve(arg);
      if (!fs.current[p] || fs.current[p].type !== "file") {
        setLines(prev => prev.concat(["cat: no such file"]));
      } else {
        setLines(prev => prev.concat([fs.current[p].body]));
        if (p.indexOf("boot") >= 0 || p.indexOf("auth") >= 0) setStage(s => Math.max(s, 2));
        if (p.indexOf("gate") >= 0) setStage(s => Math.max(s, 3));
      }
    } else if (cmd === "hint") {
      setHints(h => h + 1);
      const hintsText = [
        "Start in /home/player — read readme.txt",
        "Check /logs for color fragments",
        "Combine BLUE + SKY → unlock code",
        "Run: unlock BLUESKY"
      ];
      setLines(prev => prev.concat([hintsText[Math.min(hints, hintsText.length - 1)]]));
    } else if (cmd === "unlock") {
      const code = String(arg || "").toUpperCase();
      if (code === "BLUESKY") {
        setEscaped(true);
        const elapsed = Math.floor((Date.now() - (t0 || Date.now())) / 1000);
        const finalScore = Math.min(
          500000,
          Math.max(500, 12000 - cmds * 40 - hints * 300 - elapsed * 5)
        );
        setLines(prev => prev.concat(["", "*** ACCESS GRANTED — ESCAPED ***", "Score: " + finalScore]));
        ArcadeStore.recordScore("terminal", finalScore, { cmds, hints, elapsed });
        ArcadeStore.unlock("te_escape");
        if (cmds < 40) ArcadeStore.updateDaily("escape_cmds", cmds);
        ArcadeStore.unlock("te_first");
      } else {
        setLines(prev => prev.concat(["unlock: invalid code"]));
        if (cmds > 80) {
          setFailed(true);
          setLines(prev => prev.concat(["Too many attempts. Session locked."]));
        }
      }
    } else {
      setLines(prev => prev.concat([cmd + ": command not found"]));
    }
    setInput("");
  };

  return (
    <div className="arcade-game">
      <div className="arcade-bar">
        <button type="button" onClick={() => onBack && onBack()}>← Arcade</button>
        <span className="arcade-stat">cmds {cmds}</span>
        <span className="arcade-stat">hints {hints}</span>
        {escaped && <span className="arcade-stat">ESCAPED</span>}
      </div>
      <div className="arcade-stage">
        <div className="te-term">
          <div className="te-out">{lines.join("\n")}</div>
          {!escaped && !failed && (
            <form
              className="te-in"
              onSubmit={e => {
                e.preventDefault();
                run(input);
              }}
            >
              <span>{cwd}$</span>
              <input
                ref={inputRef}
                value={input}
                onChange={e => setInput(e.target.value)}
                autoComplete="off"
                spellCheck={false}
                placeholder="command"
              />
            </form>
          )}
        </div>
        <p style={{ fontSize: 11, color: "var(--text-muted)", marginTop: 8 }}>
          Safe virtual filesystem only. No real disk or shell access.
        </p>
      </div>
    </div>
  );
}

function WebFrame({ src, title, sandboxVal, frameKey, productName }) {
  const [status, setStatus] = useState("loading"); // loading | loaded | slow

  useEffect(() => {
    setStatus("loading");
    const id = setTimeout(() => {
      setStatus(s => (s === "loading" ? "slow" : s));
    }, 7000);
    return () => clearTimeout(id);
  }, [frameKey]);

  const openExternal = () => {
    try {
      window.open(src, "_blank", "noopener,noreferrer");
    } catch (_) {}
  };

  return (
    <div className="frame-wrap">
      {(status === "loading" || status === "slow") && (
        <div className={"frame-overlay" + (status === "slow" ? " interactive" : "")}>
          {status === "loading" ? (
            <>
              <div className="frame-spinner" />
              <h3>Loading page…</h3>
              <p>Fetching the site inside {productName || "BrowserOS"}.</p>
            </>
          ) : (
            <>
              <h3>This page isn’t loading</h3>
              <p>
                Many sites block being embedded (X-Frame-Options / CSP).
                If you still see a blank area, open it in your system browser.
              </p>
              <button
                className="go-btn"
                style={{ pointerEvents: "auto", marginTop: 4 }}
                onClick={openExternal}
              >
                Open in system browser
              </button>
              <button
                className="nav-btn"
                style={{ width: "auto", padding: "0 12px", pointerEvents: "auto" }}
                onClick={() => setStatus("loaded")}
              >
                Dismiss
              </button>
            </>
          )}
        </div>
      )}

      <iframe
        key={frameKey}
        src={src}
        title={title}
        onLoad={() => setStatus("loaded")}
        {...(sandboxVal !== null && sandboxVal !== undefined
          ? { sandbox: sandboxVal }
          : {})}
      />

      <div className="frame-hintbar">
        <span>
          {status === "slow"
            ? "Site may block embedding inside " + (productName || "BrowserOS") + "."
            : "Embedded view — some sites won’t display here."}
        </span>
        <button type="button" onClick={openExternal}>
          Open externally
        </button>
      </div>
    </div>
  );
}

/* ─── MAIN APP ─── */
const MAX_TABS = 11;
    /* ─── TAB ID GENERATOR ─── */
let nextTabId = 1;
const createTabId = () => nextTabId++;

/* ─── DEFAULT SANDBOX PERMISSIONS ─── */
const defaultSandboxPerms = () => ({
  scripts: true,
  sameOrigin: true,
  forms: true,
  popups: true,
  modals: true,
  downloads: true,
  topNav: false
});

function buildSandboxAttr(perms) {
  if (!perms) return null;
  const tokens = [];
  if (perms.scripts)    tokens.push("allow-scripts");
  if (perms.sameOrigin) tokens.push("allow-same-origin");
  if (perms.forms)      tokens.push("allow-forms");
  if (perms.popups)     tokens.push("allow-popups");
  if (perms.modals)     tokens.push("allow-modals");
  if (perms.downloads)  tokens.push("allow-downloads");
  if (perms.topNav)     tokens.push("allow-top-navigation-by-user-activation");

  const fullyOpen =
    perms.scripts && perms.sameOrigin && perms.forms &&
    perms.popups && perms.modals && perms.downloads;

  if (fullyOpen && !perms.topNav) return null;
  return tokens.join(" ");
}

function hasAnyRestriction(perms) {
  if (!perms) return false;
  return (
    !perms.scripts || !perms.sameOrigin || !perms.forms ||
    !perms.popups || !perms.modals || !perms.downloads || perms.topNav
  );
}

/* ─── TAB HISTORY HELPERS ─── */
function makeHistoryEntry(tabLike) {
  return {
    type: tabLike.type,
    data: tabLike.data,
    title: tabLike.title,
    icon: tabLike.icon,
    sandboxPerms: tabLike.sandboxPerms
      ? { ...tabLike.sandboxPerms }
      : defaultSandboxPerms()
  };
}

/** Create a brand-new tab object with an initial history entry */
function createTabState(partial) {
  const entry = makeHistoryEntry(partial);
  return {
    id: partial.id ?? createTabId(),
    title: entry.title,
    icon: entry.icon,
    type: entry.type,
    data: entry.data,
    sandboxPerms: entry.sandboxPerms,
    sandboxRev: partial.sandboxRev || 0,
    history: [entry],
    historyIndex: 0
  };
}

/** Apply a new navigation to a tab: truncate any forward history, push entry */
function withPushedHistory(tab, newFields) {
  const merged = { ...tab, ...newFields };
  const entry = makeHistoryEntry(merged);
  const hist = (tab.history || []).slice(0, (tab.historyIndex ?? -1) + 1);
  hist.push(entry);
  return {
    ...merged,
    history: hist,
    historyIndex: hist.length - 1
  };
}
