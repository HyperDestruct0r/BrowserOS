<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrowserOS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f172a'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-size='36'%3E%F0%9F%9A%80%3C/text%3E%3C/svg%3E" />
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<!-- React / Babel load after the boot screen HTML so #root paints immediately -->

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  background:#0f172a;
  color:#e2e8f0;
}

:root{
  --bg: #f5f7fb;
  --surface: rgba(0,0,0,0.04);
  --surface2: rgba(0,0,0,0.07);
  --surface3: rgba(0,0,0,0.10);
  --border: rgba(0,0,0,0.10);
  --border2: rgba(0,0,0,0.16);
  --text: #111827;
  --text-muted: #6b7280;
  --accent: #059669;
  --accent2: #6366f1;
  --danger: #dc2626;
  --tab-h: 34px;
  --toolbar-h: 48px;
  --radius: 10px;
  --chrome-bg: rgba(250,250,252,0.90);
  --iframe-bg: #ffffff;
  --terminal-bg: #ffffff;
  --terminal-fg: #14532d;
  --terminal-input-bg: #f3f4f6;
  --terminal-input-border: #d1d5db;
}

[data-theme="dark"] {
  --bg: #080c12;
  --chrome-bg: rgba(10,14,22,0.92);

  --surface: rgba(255,255,255,0.04);
  --surface2: rgba(255,255,255,0.07);
  --surface3: rgba(255,255,255,0.10);

  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.14);

  --text: #e8eaf0;
  --text-muted: #6b7280;

  --accent: #6ee7b7;
  --accent2: #818cf8;
  --danger: #f87171;

  /* ── TERMINAL DARK MODE ── */
  --terminal-bg: #050816;
  --terminal-fg: #6ee7b7;

  --terminal-input-bg: rgba(255,255,255,0.05);
  --terminal-input-border: rgba(255,255,255,0.10);
}
    
html,body{height:100%;overflow:hidden}

body{
  font-family:'Syne',sans-serif;
  background: var(--bg);
  color: var(--text);
}

/* ── NOISE OVERLAY ── */
body::before{
  content:'';
  position:fixed;inset:0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
  pointer-events:none;
  z-index:9999;
  opacity:.4;
}

.discord-popup{
  position:absolute;
  right:4px;
  top:100%;
  margin-top:6px;

  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px 12px;

  font-size:11px;
  font-weight:600;
  color:var(--text);

  backdrop-filter: blur(10px);
  z-index:9999;

  display:flex;
  align-items:center;
  gap:6px;

  white-space:nowrap;
}

.discord-popup a{
  color:var(--accent2);
  text-decoration:none;
}

.discord-popup a:hover{
  text-decoration:underline;
}
    
/* ── SHELL ── */
.shell{
  display:flex;
  flex-direction:column;
  height:100vh;
  position:relative;
}

/* ── AUTH GATE ── */
.auth-screen{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:var(--bg);
  color:var(--text);
  font-family:'Syne',sans-serif;
}
.auth-card{
  width:100%;
  max-width:380px;
  padding:28px 26px 24px;
  border-radius:16px;
  border:1px solid var(--border2);
  background:var(--chrome-bg);
  backdrop-filter:blur(20px);
  box-shadow:0 20px 50px rgba(0,0,0,0.35);
}
.auth-logo{
  font-size:28px;
  font-weight:800;
  letter-spacing:-0.02em;
  background:linear-gradient(135deg,#6ee7b7,#818cf8);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-bottom:6px;
}
.auth-sub{
  font-size:12px;
  color:var(--text-muted);
  letter-spacing:0.06em;
  text-transform:uppercase;
  margin-bottom:22px;
}
.auth-label{
  font-size:12px;
  font-weight:600;
  color:var(--text-muted);
  margin-bottom:8px;
}
.auth-input{
  width:100%;
  height:42px;
  padding:0 14px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--surface2);
  color:var(--text);
  font-family:'DM Mono',monospace;
  font-size:14px;
  outline:none;
  box-sizing:border-box;
  transition:border-color .2s, box-shadow .2s;
}
.auth-input:focus{
  border-color:var(--accent2);
  box-shadow:0 0 0 2px rgba(129,140,248,0.15);
}
.auth-btn{
  width:100%;
  margin-top:14px;
  height:42px;
  border-radius:10px;
  border:1px solid rgba(110,231,183,0.35);
  background:rgba(110,231,183,0.12);
  color:var(--accent);
  font-family:'Syne',sans-serif;
  font-weight:700;
  font-size:13px;
  letter-spacing:0.04em;
  cursor:pointer;
  transition:background .15s, border-color .15s;
}
.auth-btn:hover{
  background:rgba(110,231,183,0.18);
  border-color:rgba(110,231,183,0.5);
}
.auth-btn:disabled{
  opacity:0.5;
  cursor:default;
}
.auth-error{
  margin-top:12px;
  font-size:12px;
  color:var(--danger);
  font-weight:600;
}
.auth-hint{
  margin-top:16px;
  font-size:11px;
  color:var(--text-muted);
  line-height:1.45;
}

/* ── CHROME BAR ── */
.chrome{
  flex-shrink:0;
  background: var(--chrome-bg);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0 8px;
  display:flex;
  flex-direction:column;
  gap:0;
  position:relative;
  z-index:100;
}

/* ── THEME TOGGLE ── */
.theme-toggle{
  border:none;
  background:transparent;
  cursor:pointer;
  padding:0;
  display:flex;
  align-items:center;
}

.theme-toggle-track{
  width:54px;
  height:28px;
  border-radius:999px;

  background:var(--surface2);
  border:1px solid var(--border);

  position:relative;
  transition:
    background .25s,
    border-color .25s;
}

.theme-toggle-thumb{
  position:absolute;
  top:2px;
  left:2px;

  width:22px;
  height:22px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:var(--chrome-bg);

  font-size:12px;

  transition:
    transform .25s cubic-bezier(.4,0,.2,1),
    background .25s;

  box-shadow:
    0 2px 8px rgba(0,0,0,.25);
}

/* Dark mode position */
.theme-toggle.dark .theme-toggle-thumb{
  transform:translateX(26px);
}

.bookmarks-bar{
  display:flex;
  gap:6px;
  padding:6px 8px 10px;
  overflow-x:auto;
  border-top:1px solid var(--border);
  background:var(--chrome-bg);
}

.bookmark-item{
  font-size:11px;
  padding:4px 8px;
  border-radius:8px;
  background:var(--surface);
  border:1px solid var(--border);
  cursor:pointer;
  white-space:nowrap;
  transition:all .15s;
}

.bookmark-item:hover{
  background:var(--surface2);
  border-color:var(--border2);
}

/* ── TAB ROW ── */
.tabrow{
  display:flex;
  align-items:flex-end;
  gap:2px;
  padding:8px 0 0;
  overflow-x:auto;
  scrollbar-width:none;
}
.tabrow::-webkit-scrollbar{display:none}

.tab{
  height:var(--tab-h);
  padding:0 10px 0 12px;
  display:flex;
  align-items:center;
  gap:8px;
  border-radius:8px 8px 0 0;
  background:transparent;
  color:var(--text-muted);
  font-size:12px;
  font-weight:600;
  font-family:'Syne',sans-serif;
  letter-spacing:.03em;
  cursor:pointer;
  white-space:nowrap;
  max-width:160px;
  transition: background .15s, color .15s;
  border: 1px solid transparent;
  border-bottom: none;
  position:relative;
  flex-shrink:0;
}
.tab:hover{
  background: var(--surface2);
  color: var(--text);
}
.tab.active{
  background:var(--surface2);
  color:var(--text);
  border-color:var(--border);
}
.tab.dragging{
  opacity:0.4;
}
.tab.drag-over{
  box-shadow: inset 3px 0 0 var(--accent);
}
.tab .tab-title{
  overflow:hidden;
  text-overflow:ellipsis;
  flex:1;
  pointer-events:none;
}
.tab .close-btn{
  width:16px;height:16px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:9px;
  opacity:0;
  transition:opacity .15s, background .15s;
  flex-shrink:0;
}
.tab:hover .close-btn{opacity:1}
.tab .close-btn:hover{
  background:rgba(248,113,113,0.25);
  color: var(--danger);
}
.tab.active .close-btn{opacity:.6}

.new-tab-btn{
  height:var(--tab-h);
  width:32px;
  display:flex;align-items:center;justify-content:center;
  border-radius:8px 8px 0 0;
  background:transparent;
  color:var(--text-muted);
  cursor:pointer;
  font-size:16px;
  transition: color .15s, background .15s;
  flex-shrink:0;
  border:none;
}
.new-tab-btn:hover{color:var(--accent);background:var(--surface)}

/* ── TOOLBAR ── */
.toolbar{
  display:flex;
  flex-direction:column;
  gap:0;
  padding:0 4px 6px;
}
.toolbar-row{
  display:flex;
  align-items:center;
  gap:8px;
  min-height:var(--toolbar-h);
  flex-wrap:nowrap;
}
.toolbar-address-cluster{
  flex:1;
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
}
.toolbar-desktop-only{display:flex;align-items:center}
.toolbar-mobile-only{display:none}
button.toolbar-desktop-only{display:flex}

.nav-btn{
  width:28px;height:28px;
  border-radius:7px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text-muted);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  font-size:13px;
  transition:all .15s;
  flex-shrink:0;
}
.nav-btn:hover{background:var(--surface2);color:var(--text);border-color:var(--border2)}
.nav-btn:disabled,
.nav-btn.disabled{
  opacity:0.35;
  cursor:default;
  pointer-events:none;
}

.url-bar{
  flex:1;
  height:30px;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:8px;
  padding:0 12px;
  color:var(--text);
  font-family:'DM Mono',monospace;
  font-size:12px;
  outline:none;
  transition: border-color .2s, background .2s, box-shadow .2s;
  min-width:0;
}
.url-bar:focus{
  border-color:var(--accent2);
  background:var(--surface3);
  box-shadow: 0 0 0 2px rgba(129,140,248,0.15);
}
.url-bar::placeholder{color:var(--text-muted)}

.go-btn{
  height:30px;padding:0 14px;
  border-radius:8px;
  border:1px solid rgba(110,231,183,0.3);
  background:rgba(110,231,183,0.08);
  color:var(--accent);
  font-family:'Syne',sans-serif;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
  transition:all .15s;
  letter-spacing:.05em;
  flex-shrink:0;
}
.go-btn:hover{background:rgba(110,231,183,0.15);border-color:rgba(110,231,183,0.5)}

/* Mobile actions sheet */
.mobile-sheet-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.45);
  z-index:100000;
  display:flex;
  align-items:flex-end;
  justify-content:center;
}
.mobile-sheet{
  width:100%;
  max-width:480px;
  background:var(--chrome-bg);
  border:1px solid var(--border2);
  border-radius:16px 16px 0 0;
  padding:16px 16px 22px;
  box-shadow:0 -12px 40px rgba(0,0,0,0.35);
  backdrop-filter:blur(16px);
}
.mobile-sheet-handle{
  width:36px;height:4px;border-radius:99px;
  background:var(--border2);
  margin:0 auto 14px;
}
.mobile-sheet-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 10px;
  border-radius:10px;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
}
.mobile-sheet-row:hover{background:var(--surface)}
.mobile-sheet-cancel{
  margin-top:8px;
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  font-family:'Syne',sans-serif;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
}

@media (max-width: 800px){
  :root{
    --tab-h: 38px;
    --toolbar-h: 44px;
  }
  html, body, .shell{
    height:100dvh;
    max-height:100dvh;
  }
  .toolbar{
    gap:6px;
    padding:4px 8px 8px;
  }
  .toolbar-row.toolbar-nav{
    flex-wrap:wrap;
    min-height:auto;
    gap:8px;
  }
  .toolbar-nav .nav-spacer{flex:1}
  .toolbar-address-cluster{
    flex:1 1 100%;
    order:3;
  }
  .toolbar-desktop-only{display:none !important}
  .toolbar-mobile-only{display:flex !important}
  button.toolbar-mobile-only{display:flex !important}

  .nav-btn{
    width:40px;height:40px;
    border-radius:10px;
    font-size:16px;
  }
  .url-bar{
    height:40px;
    font-size:14px;
    border-radius:10px;
  }
  .go-btn{
    height:40px;
    padding:0 16px;
    border-radius:10px;
    font-size:13px;
  }
  .tab{
    height:38px;
    max-width:140px;
    padding:0 12px;
    font-size:13px;
  }
  .tab .close-btn{
    opacity:0.7;
    width:20px;height:20px;
    font-size:11px;
  }
  .new-tab-btn{
    height:38px;
    width:38px;
    font-size:18px;
  }
  .tabrow{
    padding:6px 4px 0;
    -webkit-overflow-scrolling:touch;
  }
  .bookmarks-bar{
    padding:6px 8px 8px;
    gap:8px;
  }
  .bookmark-item{
    padding:6px 10px;
    font-size:12px;
  }
  .sandbox-btn{
    width:40px;height:40px;
  }
  .discord-popup{
    display:none;
  }
}

/* ── SANDBOX CONTROLS ── */
.sandbox-btn{
  width:28px;height:28px;
  border-radius:7px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text-muted);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  font-size:14px;
  transition:all .15s;
  flex-shrink:0;
  position:relative;
}
.sandbox-btn:hover{background:var(--surface2);color:var(--text);border-color:var(--border2)}
.sandbox-btn.active{
  color:var(--accent);
  border-color:rgba(110,231,183,0.35);
  background:rgba(110,231,183,0.10);
}
.sandbox-btn.has-restrictions{
  color:#f59e0b;
  border-color:rgba(245,158,11,0.35);
}
.sandbox-panel{
  position:absolute;
  top:100%;
  left:0;
  margin-top:8px;
  width:280px;
  background:var(--chrome-bg);
  border:1px solid var(--border2);
  border-radius:12px;
  padding:12px;
  z-index:1000;
  backdrop-filter:blur(16px);
  box-shadow:0 12px 40px rgba(0,0,0,0.35);
}
.sandbox-panel h4{
  font-size:11px;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--text-muted);
  margin-bottom:10px;
}
.sandbox-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:7px 4px;
  border-radius:8px;
  font-size:12px;
  font-weight:600;
}
.sandbox-row:hover{background:var(--surface)}
.sandbox-toggle{
  width:36px;
  height:20px;
  border-radius:999px;
  border:1px solid var(--border);
  background:var(--surface2);
  position:relative;
  cursor:pointer;
  transition:background .2s, border-color .2s;
  flex-shrink:0;
}
.sandbox-toggle.on{
  background:rgba(110,231,183,0.25);
  border-color:rgba(110,231,183,0.45);
}
.sandbox-toggle-thumb{
  position:absolute;
  top:1px;
  left:1px;
  width:16px;
  height:16px;
  border-radius:50%;
  background:var(--text-muted);
  transition:transform .2s, background .2s;
}
.sandbox-toggle.on .sandbox-toggle-thumb{
  transform:translateX(16px);
  background:var(--accent);
}
.sandbox-warning-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.55);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:100000;
  backdrop-filter:blur(4px);
}
.sandbox-warning-box{
  background:var(--chrome-bg);
  border:1px solid var(--border2);
  border-radius:14px;
  padding:24px 28px;
  max-width:360px;
  width:90%;
  text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,0.45);
}
.sandbox-warning-box h3{
  font-size:16px;
  font-weight:800;
  margin-bottom:10px;
}
.sandbox-warning-box p{
  font-size:13px;
  color:var(--text-muted);
  line-height:1.5;
  margin-bottom:18px;
}
.sandbox-warning-actions{
  display:flex;
  gap:10px;
  justify-content:center;
}
.sandbox-warning-actions button{
  padding:8px 16px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  font-family:'Syne',sans-serif;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
  transition:all .15s;
}
.sandbox-warning-actions button.danger{
  background:rgba(248,113,113,0.12);
  border-color:rgba(248,113,113,0.35);
  color:var(--danger);
}
.sandbox-warning-actions button:hover{
  background:var(--surface2);
}

/* ── CONTENT ── */
.content{flex:1;position:relative;overflow:hidden}
.content.content-split{
  display:flex;
  flex-direction:row;
  gap:0;
}
.split-pane{
  flex:1;
  min-width:0;
  height:100%;
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.split-pane .page{
  position:relative;
  inset:auto;
  display:flex !important;
  flex:1;
  height:100%;
  width:100%;
}
.split-divider{
  width:4px;
  flex-shrink:0;
  background:var(--border);
  cursor:col-resize;
  position:relative;
  z-index:2;
}
.split-divider:hover{background:var(--accent)}
.tab.split-side{
  box-shadow: inset 0 -2px 0 var(--accent2);
}
.nav-btn.split-on{
  color:var(--accent);
  border-color:rgba(110,231,183,0.4);
  background:rgba(110,231,183,0.10);
}
.wallpaper-layer{
  position:absolute;
  inset:0;
  z-index:0;
  pointer-events:none;
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  transform:scale(1.12);
  filter:blur(var(--wp-blur, 0px));
  opacity:0;
  transition:opacity .25s ease;
}
.wallpaper-layer.on{opacity:1}
.page{
  position:absolute;inset:0;
  display:none;
  overflow:hidden;
  z-index:1;
}
.page.active{display:flex;flex-direction:column}
/* Readable scrim over wallpaper on internal pages */
[data-wallpaper="on"] .page.active.page-internal{
  background:rgba(8,12,18,0.52);
}
[data-theme="light"][data-wallpaper="on"] .page.active.page-internal{
  background:rgba(245,247,251,0.62);
}
[data-wallpaper="on"] .page.active.page-internal .internal{
  background:transparent !important;
}

iframe{
  width:100%;
  height:100%;
  border:none;
  background:var(--iframe-bg);
}

.frame-wrap{
  flex:1;
  display:flex;
  flex-direction:column;
  min-height:0;
  position:relative;
  width:100%;
  height:100%;
}
.frame-wrap iframe{
  flex:1;
  min-height:0;
}
.frame-overlay{
  position:absolute;
  inset:0;
  z-index:5;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:12px;
  padding:24px;
  text-align:center;
  background:var(--bg);
  color:var(--text);
  pointer-events:none;
}
.frame-overlay.interactive{pointer-events:auto}
.frame-overlay h3{
  font-size:16px;
  font-weight:800;
  margin:0;
}
.frame-overlay p{
  font-size:13px;
  color:var(--text-muted);
  line-height:1.5;
  max-width:320px;
  margin:0;
}
.frame-spinner{
  width:28px;height:28px;
  border:2px solid var(--border2);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.frame-hintbar{
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  padding:8px 12px;
  border-top:1px solid var(--border);
  background:var(--chrome-bg);

  color:var(--text-muted);
}
.frame-hintbar button{
  margin-left:auto;
  padding:6px 10px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  font-family:'Syne',sans-serif;
  font-size:11px;
  font-weight:700;
  cursor:pointer;
}
.frame-hintbar button:hover{background:var(--surface2)}

.page{
  animation:fade .15s ease;
}

@keyframes fade{
  from{
    opacity:0;
    transform:translateY(4px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* ── INTERNAL PAGES ── */

/* ── NOTES ── */
.notes-wrap{

}
.notes-header{

}
.notes-saved{

}

.notes-actions{

}
.notes-btn{

}

.notes-filename{

}

/* ── STORE ── */
.store{padding:30px}
.store h2{font-size:24px;font-weight:800;margin-bottom:6px}
.store-sub{color:var(--text-muted);font-size:13px;margin-bottom:28px}
.store-list{display:flex;flex-direction:column;gap:8px}
.store-item{

.store-item .s-name{font-size:13px;font-weight:700;margin-bottom:2px}
.store-item .s-desc{font-size:11px;color:var(--text-muted)}
.store-item .s-badge{

}

/* ── PROFILE ── */
.profile{padding:30px}
.profile h2{font-size:24px;font-weight:800;margin-bottom:20px}
.profile-card{

}

}

.save-btn{

  font-family:'Syne',sans-serif;

}

.os-btn {
  padding: 10px 14px;
  border-radius: 12px;

}

/* ── REACTION TIME ── */
.reaction-wrap{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;

.reaction-msg{font-size:22px;font-weight:700;letter-spacing:.02em}

.reaction-name-row{display:flex;gap:8px;align-items:center}
.reaction-input{
  height:34px;padding:0 12px;
  background:rgba(255,255,255,0.07);

  border-radius:8px;
  color:var(--text);
  font-family:'Syne',sans-serif;
  font-size:12px;outline:none;

}
.reaction-btn{
  height:34px;padding:0 14px;

}
.reaction-btn:hover{background:var(--surface3)}
.lb{

/* ── AIM TRAINER ── */
.aim-wrap{flex:1;position:relative;overflow:hidden;cursor:crosshair}
.aim-hud{position:absolute;top:14px;left:16px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);z-index:10}
.aim-score{color:var(--text);font-size:22px;font-weight:800}
.aim-target{
  position:absolute;
  width:44px;height:44px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#f87171,#dc2626);
  box-shadow:0 0 20px rgba(220,38,38,0.5), 0 0 0 3px rgba(248,113,113,0.2);
  cursor:pointer;
  animation:pop .15s ease-out;
}
@keyframes pop{from{transform:scale(0.3);opacity:0}to{transform:scale(1);opacity:1}}

/* ── BOUNCY BALL ── */
.bouncy-wrap{flex:1;position:relative;overflow:hidden}
.ball{
  position:absolute;
  width:46px;height:46px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#a78bfa,#7c3aed);
  box-shadow:0 0 24px rgba(124,58,237,0.5);
}

/* ── TERMINAL ── */
.terminal-wrap{
  display:flex;
  flex-direction:column;
  height:100%;
  padding:20px;
  background:var(--terminal-bg);
  color:var(--terminal-fg);
  font-family:'DM Mono',monospace;
}

.terminal-log{
  flex:1;
  overflow:auto;
  margin-bottom:12px;
  display:flex;
  flex-direction:column;
  gap:4px;
}

.terminal-line{
  white-space:pre-wrap;
  word-break:break-word;
  font-size:13px;
  line-height:1.5;
}

.terminal-input{
  height:38px;
  background:var(--terminal-input-bg);
  color:var(--terminal-fg);
  border:1px solid var(--terminal-input-border);
  border-radius:8px;
  padding:0 12px;
  font-family:'DM Mono',monospace;
  font-size:13px;
  outline:none;
  transition:border-color .15s, box-shadow .15s;
}

.terminal-input:focus{
  border-color:var(--accent2);
  box-shadow:0 0 0 2px rgba(129,140,248,0.15);
}

.feedback-chip-wrap{
  position:fixed;
  bottom:18px;
  right:18px;
  display:flex;
  align-items:center;
  gap:8px;
  z-index:99999;
}

.feedback-close{
  width:26px;
  height:26px;
  border:none;
  border-radius:999px;
  cursor:pointer;
  background:var(--surface2);
  color:var(--text);
  font-size:12px;
  font-weight:700;
  transition:0.15s;
}

.feedback-close:hover{
  transform:scale(1.08);
}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:4px}

/* ── FEEDBACK CHIP ── */
.feedback-chip{
  position:fixed;bottom:14px;right:14px;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:20px;
  padding:6px 14px;
  font-size:11px;font-weight:600;letter-spacing:.05em;
  color:var(--text-muted);
  z-index:9998;
  backdrop-filter:blur(8px);
  cursor:pointer;
  transition:all .15s;
  text-decoration:none;display:flex;align-items:center;gap:6px;
}
.feedback-chip:hover{border-color:var(--border2);color:var(--text)}

* {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
        margin: 0;
        font-family: sans-serif;
    }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }

    /* ── ANIMATIONS ── */
    @keyframes popIn {
      0% {
        transform: scale(0);
        opacity: 0;
      }
      80% {
        transform: scale(1.1);
        opacity: 1;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes pulseGlow {
      0% {
        box-shadow: 0 0 10px var(--glow-color), 0 0 20px var(--glow-color);
      }
      50% {
        box-shadow: 0 0 20px var(--glow-color), 0 0 35px var(--glow-color);
      }
      100% {
        box-shadow: 0 0 10px var(--glow-color), 0 0 20px var(--glow-color);
      }
    }

    .tile-pop {
      animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .tile-glow {
      animation: pulseGlow 2s infinite ease-in-out;
    }

.game2048-page {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    padding: 20px;

    color: #fff;
    background: #080c12;

    font-family: 'Syne', sans-serif;

    user-select: none;
}

/* ── BOOT SCREEN (static HTML in #root, no JS required) ── */
.os-boot-screen{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  height:100dvh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:18px;
  background:#070b14;
  color:#e2e8f0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  user-select:none;
  -webkit-user-select:none;
  z-index:999999;
  overflow:hidden;
}
.os-boot-bg{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:0;
}
.os-boot-grid{
  position:absolute;
  inset:-20%;
  background-image:
    linear-gradient(rgba(110,231,183,0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(129,140,248,0.06) 1px, transparent 1px);
  background-size:48px 48px;
  transform:perspective(400px) rotateX(58deg) translateY(-12%);
  animation:boot-grid-drift 18s linear infinite;
  opacity:0.7;
  mask-image:radial-gradient(ellipse 70% 55% at 50% 40%, #000 20%, transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse 70% 55% at 50% 40%, #000 20%, transparent 75%);
}
.os-boot-orb{
  position:absolute;
  border-radius:50%;
  filter:blur(48px);
  opacity:0.55;
  animation:boot-orb-float 12s ease-in-out infinite;
}
.os-boot-orb.a{
  width:min(42vw, 320px);
  height:min(42vw, 320px);
  left:8%;
  top:18%;
  background:radial-gradient(circle, rgba(110,231,183,0.55), transparent 70%);
  animation-delay:0s;
}
.os-boot-orb.b{
  width:min(50vw, 380px);
  height:min(50vw, 380px);
  right:5%;
  bottom:12%;
  background:radial-gradient(circle, rgba(129,140,248,0.5), transparent 70%);
  animation-delay:-4s;
}
.os-boot-orb.c{
  width:min(36vw, 260px);
  height:min(36vw, 260px);
  left:40%;
  top:55%;
  background:radial-gradient(circle, rgba(56,189,248,0.4), transparent 70%);
  animation-delay:-8s;
}
.os-boot-ring{
  position:absolute;
  width:min(70vw, 420px);
  height:min(70vw, 420px);
  border-radius:50%;
  border:1px solid rgba(148,163,184,0.12);
  box-shadow:
    0 0 40px rgba(110,231,183,0.08) inset,
    0 0 80px rgba(129,140,248,0.06);
  animation:boot-ring-pulse 4.5s ease-in-out infinite;
}
.os-boot-ring::before{
  content:"";
  position:absolute;
  inset:18%;
  border-radius:50%;
  border:1px dashed rgba(110,231,183,0.18);
  animation:boot-spin 28s linear infinite;
}
.os-boot-content{
  position:relative;
  z-index:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:18px;
}
.os-boot-logo{
  font-size:clamp(28px, 6vw, 40px);
  font-weight:800;
  letter-spacing:-0.03em;
  background:linear-gradient(110deg,#6ee7b7 0%,#38bdf8 45%,#818cf8 100%);
  background-size:200% 200%;
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  color:transparent;
  animation:boot-logo-shine 4s ease-in-out infinite;
  filter:drop-shadow(0 0 24px rgba(56,189,248,0.25));
}
.boot-spinner{
  width:40px;
  height:40px;
  border-radius:50%;
  border:3px solid rgba(148,163,184,0.18);
  border-top-color:#6ee7b7;
  border-right-color:#818cf8;
  animation:boot-spin 0.85s linear infinite;
  box-shadow:0 0 16px rgba(110,231,183,0.2);
}
.os-boot-status{
  font-size:13px;
  color:#94a3b8;
  letter-spacing:0.06em;
  animation:boot-status-fade 2.2s ease-in-out infinite;
}
.os-boot-dots::after{
  content:"";
  animation:boot-dots 1.4s steps(4, end) infinite;
}
@keyframes boot-spin{
  to{transform:rotate(360deg)}
}
@keyframes boot-grid-drift{
  from{background-position:0 0, 0 0}
  to{background-position:0 48px, 48px 0}
}
@keyframes boot-orb-float{
  0%,100%{transform:translate(0,0) scale(1)}
  50%{transform:translate(12px,-18px) scale(1.08)}
}
@keyframes boot-ring-pulse{
  0%,100%{transform:scale(1); opacity:0.7}
  50%{transform:scale(1.04); opacity:1}
}
@keyframes boot-logo-shine{
  0%,100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}
@keyframes boot-status-fade{
  0%,100%{opacity:0.55}
  50%{opacity:1}
}
@keyframes boot-dots{
  0%{content:""}
  25%{content:"."}
  50%{content:".."}
  75%{content:"..."}
}

.chat-mention-item .mi-name{font-size:13px;font-weight:700;line-height:1.2}
.chat-mention-item .mi-email{font-size:11px;color:var(--text-muted);line-height:1.25;word-break:break-all}

/* ── NOTIFICATIONS ── */
.bos-notify-stack{

  top:16px;
  right:16px;
  z-index:100000;
  display:flex;
  flex-direction:column;
  gap:10px;
  max-width:min(360px, calc(100vw - 24px));
  pointer-events:none;
}
.bos-notify-toast{
  pointer-events:auto;
  padding:12px 14px;
  border-radius:12px;
  border:1px solid var(--border2, rgba(255,255,255,0.12));
  background:var(--chrome-bg, rgba(15,23,42,0.96));
  color:var(--text, #e2e8f0);
  box-shadow:0 12px 40px rgba(0,0,0,0.35);

  font-family:'Syne',system-ui,sans-serif;
}
.bos-notify-toast.ping{
  border-color:rgba(110,231,183,0.45);
  box-shadow:0 12px 40px rgba(0,0,0,0.35), 0 0 0 1px rgba(110,231,183,0.15);
}
.bos-notify-title{
  font-size:13px;
  font-weight:800;
  margin-bottom:4px;
}
.bos-notify-body{

  color:var(--text-muted, #94a3b8);
  line-height:1.45;
  word-break:break-word;
}
.bos-notify-close{
  float:right;
  border:none;

  color:var(--text-muted, #94a3b8);

  line-height:1;

@keyframes bos-notify-in{

}
.chat-ping-mention{

  font-weight:700;
  background:rgba(110,231,183,0.12);

}

/* ── Admin profile decorations ── */
.avatar-deco{
  position:relative;
  display:inline-flex;
  border-radius:50%;
}
.avatar-deco-inner{
  width:100%;
  height:100%;
  border-radius:50%;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  z-index:1;
}
/* Avatar: gold-ring — plays on message hover */
.msg-row:hover .avatar-deco.deco-gold-ring::before,
.avatar-deco.deco-gold-ring.force-play::before{
  content:"";
  position:absolute;
  inset:-3px;
  border-radius:50%;
  background:conic-gradient(from 0deg,#fbbf24,#f59e0b,#fff7ed,#fbbf24);
  animation:deco-spin 1.2s linear infinite;
  z-index:0;
}
.msg-row:hover .avatar-deco.deco-gold-ring::after,
.avatar-deco.deco-gold-ring.force-play::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50%;
  background:var(--surface2,#0f172a);
  z-index:0;
}
/* Avatar: pulse-glow */
.msg-row:hover .avatar-deco.deco-pulse-glow,
.avatar-deco.deco-pulse-glow.force-play{
  box-shadow:0 0 0 2px rgba(110,231,183,0.5),0 0 14px 4px rgba(110,231,183,0.55);
  animation:deco-pulse 1.1s ease-in-out infinite;
}
/* Avatar: orbit */
.msg-row:hover .avatar-deco.deco-orbit::before,
.avatar-deco.deco-orbit.force-play::before{
  content:"";
  position:absolute;
  width:6px;height:6px;
  border-radius:50%;
  background:#38bdf8;
  box-shadow:0 0 8px #38bdf8;
  top:50%;left:50%;
  animation:deco-orbit 1.4s linear infinite;
  z-index:2;
}
@keyframes deco-spin{to{transform:rotate(360deg)}}
@keyframes deco-pulse{
  0%,100%{box-shadow:0 0 0 2px rgba(110,231,183,0.35),0 0 8px 2px rgba(110,231,183,0.3)}
  50%{box-shadow:0 0 0 3px rgba(110,231,183,0.7),0 0 18px 6px rgba(110,231,183,0.65)}
}
@keyframes deco-orbit{
  from{transform:rotate(0deg) translateX(16px) rotate(0deg)}
  to{transform:rotate(360deg) translateX(16px) rotate(-360deg)}
}
/* Profile card decorations */
.profile-card-shell{position:relative;border-radius:16px;overflow:hidden}
.profile-card-shell.deco-aurora .profile-card-banner{
  background:linear-gradient(120deg,#34d399,#38bdf8,#a78bfa,#34d399);
  background-size:300% 300%;
  animation:deco-aurora 4s ease infinite;
}
.profile-card-shell.deco-prism{
  box-shadow:0 0 0 2px transparent;
  animation:deco-prism-border 3s linear infinite;
}
.profile-card-shell.deco-prism .profile-card-banner{
  background:linear-gradient(135deg,#0f172a 0%,#1e293b 40%,#312e81 100%);
}
.profile-card-shell.deco-crown-flare .profile-card-banner{
  background:linear-gradient(180deg,#fbbf24 0%,#b45309 40%,#0f172a 100%);
  position:relative;
  overflow:hidden;
}
.profile-card-shell.deco-crown-flare .profile-card-banner::after{
  content:"";
  position:absolute;
  top:-40%;left:-20%;
  width:60%;height:180%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.45),transparent);
  animation:deco-shine 2.2s ease-in-out infinite;
  transform:rotate(20deg);
}
@keyframes deco-aurora{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
@keyframes deco-prism-border{
  0%{box-shadow:0 0 0 2px #f472b6,0 12px 40px rgba(0,0,0,0.4)}
  33%{box-shadow:0 0 0 2px #38bdf8,0 12px 40px rgba(0,0,0,0.4)}
  66%{box-shadow:0 0 0 2px #a3e635,0 12px 40px rgba(0,0,0,0.4)}
  100%{box-shadow:0 0 0 2px #f472b6,0 12px 40px rgba(0,0,0,0.4)}
}
@keyframes deco-shine{
  0%{transform:translateX(-30%) rotate(20deg)}
  100%{transform:translateX(220%) rotate(20deg)}
}
.deco-picker{
  display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;
}
.deco-picker button{
  font-size:11px;padding:6px 10px;border-radius:8px;
  border:1px solid var(--border);background:var(--surface2);
  color:var(--text);cursor:pointer;
}
.deco-picker button.active{
  border-color:var(--accent);background:rgba(110,231,183,0.15);font-weight:700;
}
    

/* Extra avatar decorations */
.msg-row:hover .avatar-deco.deco-cyber-neon::before,
.avatar-deco.deco-cyber-neon.force-play::before{
  content:"";position:absolute;inset:-4px;border-radius:50%;
  border:2px solid #22d3ee;box-shadow:0 0 8px #22d3ee,0 0 16px #d946ef,inset 0 0 6px #22d3ee;
  animation:deco-neon-flicker 0.9s steps(2) infinite;z-index:0;
}
.msg-row:hover .avatar-deco.deco-cyber-neon::after,
.avatar-deco.deco-cyber-neon.force-play::after{
  content:"";position:absolute;inset:-7px;border-radius:50%;
  border:1px solid #d946ef;opacity:0.8;animation:deco-spin 2.5s linear infinite reverse;z-index:0;
}
@keyframes deco-neon-flicker{
  0%,100%{opacity:1;filter:brightness(1)}
  50%{opacity:0.65;filter:brightness(1.4)}
}
.msg-row:hover .avatar-deco.deco-flame-ring::before,
.avatar-deco.deco-flame-ring.force-play::before{
  content:"";position:absolute;inset:-4px;border-radius:50%;
  background:conic-gradient(from 0deg,#f97316,#fbbf24,#ef4444,#f97316);
  animation:deco-spin 1.5s linear infinite, deco-flicker 0.4s ease-in-out infinite;z-index:0;
}
.msg-row:hover .avatar-deco.deco-flame-ring::after,
.avatar-deco.deco-flame-ring.force-play::after{
  content:"";position:absolute;inset:1px;border-radius:50%;background:var(--surface2,#0f172a);z-index:0;
}
@keyframes deco-flicker{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}
.msg-row:hover .avatar-deco.deco-void-portal,
.avatar-deco.deco-void-portal.force-play{
  box-shadow:0 0 0 2px #6b21a8,0 0 16px 4px rgba(88,28,135,0.7),inset 0 0 12px #2e1065;
  animation:deco-void 1.6s ease-in-out infinite;
}
@keyframes deco-void{
  0%,100%{box-shadow:0 0 0 2px #6b21a8,0 0 10px 2px rgba(88,28,135,0.5)}
  50%{box-shadow:0 0 0 3px #a855f7,0 0 22px 6px rgba(168,85,247,0.75)}
}
.msg-row:hover .avatar-deco.deco-hologram .avatar-deco-inner,
.avatar-deco.deco-hologram.force-play .avatar-deco-inner{
  animation:deco-holo 0.8s steps(3) infinite;
  filter:drop-shadow(-1px 0 #f0abfc) drop-shadow(1px 0 #22d3ee);
}
@keyframes deco-holo{
  0%{transform:translate(0,0)}
  33%{transform:translate(1px,-1px)}
  66%{transform:translate(-1px,1px)}
  100%{transform:translate(0,0)}
}
/* Card decorations */
.profile-card-shell.deco-matrix .profile-card-banner{
  background:#020617;
  background-image:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(34,197,94,0.15) 2px,rgba(34,197,94,0.15) 4px),
    linear-gradient(180deg,#022c22,#020617);
  animation:deco-matrix 2s linear infinite;
}
@keyframes deco-matrix{from{background-position:0 0}to{background-position:0 24px}}
.profile-card-shell.deco-cosmic .profile-card-banner{
  background:radial-gradient(circle at 20% 30%,#c026d3,transparent 40%),
    radial-gradient(circle at 80% 20%,#4c1d95,transparent 35%),

  background-size:200% 200%;
  animation:deco-aurora 6s ease infinite;
}
.profile-card-shell.deco-synthwave .profile-card-banner{

}
.profile-card-shell.deco-synthwave .profile-card-banner::before{
  content:"";position:absolute;left:0;right:0;bottom:0;height:55%;

    repeating-linear-gradient(90deg,transparent,transparent 10px,rgba(244,114,182,0.2) 10px,rgba(244,114,182,0.2) 11px);

/* Chat layout extras */
.chat-member-panel{width:200px;flex-shrink:0;border-left:1px solid var(--border);background:var(--surface);overflow-y:auto;padding:10px 8px;font-size:12px;height:100%;min-height:0}

.chat-member-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;border:none;background:transparent;width:100%;color:var(--text);text-align:left}
.chat-member-row:hover{background:rgba(255,255,255,0.05)}
.chat-app-embed{margin-top:8px;padding:12px;border-radius:12px;border:1px solid var(--border);background:linear-gradient(135deg,rgba(110,231,183,0.08),rgba(56,189,248,0.06))}
.chat-code-block{margin-top:8px;background:#0b1220;border:1px solid #1e293b;border-radius:10px;overflow:hidden}
.chat-code-block pre{margin:0;padding:12px;overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:#e2e8f0;line-height:1.5}

.chat-cmd-item{display:block;width:100%;text-align:left;padding:8px 12px;border:none;background:transparent;color:var(--text);cursor:pointer;font-size:12px}

.chat-reactions{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}

.chat-reaction-chip.mine{border-color:var(--accent);background:rgba(110,231,183,0.12)}
.chat-ctx-menu{position:fixed;z-index:100;min-width:180px;background:var(--chrome-bg,#0f172a);border:1px solid var(--border);border-radius:10px;padding:6px;box-shadow:0 12px 30px rgba(0,0,0,0.4)}
.chat-ctx-menu button{display:block;width:100%;text-align:left;padding:8px 10px;border:none;background:transparent;color:var(--text);font-size:12px;cursor:pointer;border-radius:6px}
.chat-ctx-menu button:hover{background:rgba(255,255,255,0.06)}


.voice-speaking{
  box-shadow:0 0 0 2px #22c55e,0 0 10px rgba(34,197,94,0.55)!important;

}
.voice-dock{
  margin-top:auto;

}

  display:flex;align-items:center;gap:6px;

}

.chat-cat-head{
  display:flex;align-items:center;gap:4px;width:100%;
  font-size:11px;font-weight:800;color:var(--text-muted);
  letter-spacing:0.06em;margin:10px 0 6px;padding:4px 6px;
  border:none;background:transparent;cursor:pointer;text-align:left;

}
.chat-cat-head:hover{color:var(--text)}
.chat-new-divider{

}
.msg-row{

.voice-avatar-speak{

.chat-ping-mention{

/* Profile card popout animations */
@keyframes profile-card-in {
  0% { opacity: 0; transform: translate(-50%, -46%) scale(0.92); }
  100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}
@keyframes profile-banner-shimmer {
  0% { background-position: 0% 50%; }
  100% { background-position: 100% 50%; }
}
@keyframes profile-avatar-pop {
  0% { transform: scale(0.6); opacity: 0; }
  70% { transform: scale(1.06); }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes profile-status-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.45); }
  50% { box-shadow: 0 0 0 6px rgba(34,197,94,0); }
}
.profile-card-backdrop {

}
@keyframes profile-fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
}
.profile-card-shell.profile-card-enter {

}
.profile-card-shell .profile-card-banner {
  background-size: 200% 200%;
}
.profile-card-shell.profile-card-enter .profile-card-banner {
  animation: profile-banner-shimmer 2.8s ease-in-out infinite alternate;
}
.profile-card-shell.profile-card-enter .profile-card-avatar-wrap {
  animation: profile-avatar-pop 0.35s cubic-bezier(0.22, 1, 0.36, 1) 0.08s both;
}

}

/* Animated member list rows (Nitro / staff) — GPU-friendly */
.chat-member-row{
  position:relative;
  overflow:hidden;
  isolation:isolate;
}
.chat-member-row > *{position:relative;z-index:1}
.chat-member-row.member-row-fx::before{
  content:"";
  position:absolute;inset:0;
  z-index:0;
  pointer-events:none;
  border-radius:8px;
  opacity:0.55;
  will-change:background-position, opacity, transform;
}
/* Aurora / Nebula */
.chat-member-row.member-row-fx-aurora::before{
  background:linear-gradient(120deg,rgba(56,189,248,0.25),rgba(167,139,250,0.3),rgba(244,114,182,0.25),rgba(56,189,248,0.25));
  background-size:300% 300%;
  animation:member-aurora 6s ease infinite;
}
@keyframes member-aurora{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
/* Matrix rain (vertical shift via gradient) */
.chat-member-row.member-row-fx-matrix::before{
  background:
    repeating-linear-gradient(
      180deg,
      transparent 0px,
      transparent 6px,
      rgba(74,222,128,0.08) 6px,
      rgba(74,222,128,0.18) 8px
    ),
    linear-gradient(90deg,rgba(6,78,59,0.35),rgba(15,23,42,0.1));
  background-size:100% 24px, 100% 100%;
  animation:member-matrix 2.4s linear infinite;
  opacity:0.7;
}
@keyframes member-matrix{
  from{background-position:0 0,0 0}
  to{background-position:0 24px,0 0}
}
/* Gold prism / sparkle */
.chat-member-row.member-row-fx-gold::before{
  background:linear-gradient(110deg,rgba(245,158,11,0.05),rgba(250,204,21,0.28),rgba(253,224,71,0.12),rgba(245,158,11,0.3),rgba(245,158,11,0.05));
  background-size:220% 100%;
  animation:member-gold 3.2s linear infinite;
}
@keyframes member-gold{
  from{background-position:0% 0}
  to{background-position:220% 0}
}
/* Cyber neon */
.chat-member-row.member-row-fx-cyber::before{
  background:linear-gradient(90deg,rgba(34,211,238,0.2),rgba(236,72,153,0.22),rgba(34,211,238,0.2));
  background-size:200% 100%;
  animation:member-cyber 2.8s ease-in-out infinite;
  box-shadow:inset 0 0 12px rgba(34,211,238,0.15);
}
@keyframes member-cyber{
  0%,100%{background-position:0% 50%;opacity:0.45}
  50%{background-position:100% 50%;opacity:0.75}
}
/* Cosmic */
.chat-member-row.member-row-fx-cosmic::before{
  background:radial-gradient(circle at 20% 50%,rgba(167,139,250,0.35),transparent 40%),
    radial-gradient(circle at 80% 40%,rgba(244,114,182,0.3),transparent 42%),
    linear-gradient(135deg,rgba(30,27,75,0.4),rgba(15,23,42,0.1));
  animation:member-cosmic 5s ease-in-out infinite alternate;
}
@keyframes member-cosmic{
  from{transform:translate3d(0,0,0);opacity:0.5}
  to{transform:translate3d(0,-2px,0);opacity:0.8}
}
/* Always-on avatar frame for staff/nitro in member list */
.chat-member-row .avatar-deco.force-play{
  will-change:transform,filter;
}
.chat-member-row .member-avatar-ring{
  position:absolute;inset:-2px;
  border-radius:50%;

  z-index:2;
  will-change:transform,opacity,box-shadow;
}

}

<script>
(function () {
  function setBoot(msg) {
    var el = document.querySelector(".os-boot-status");
    if (el) el.textContent = msg;
  }
  window.addEventListener("error", function (e) {
    setBoot("Boot error: " + (e && e.message ? e.message : "see console"));
    console.error("BrowserOS boot error", e);
  });
  window.addEventListener("unhandledrejection", function (e) {
    var msg = e && e.reason && (e.reason.message || e.reason);
    if (msg) {
      setBoot("Boot error: " + msg);
      console.error("BrowserOS rejection", e.reason);
    }
  });
  if (typeof navigator !== "undefined" && navigator.onLine === false) {
    setBoot("No internet — loading offline arcade…");
  }
  setTimeout(function () {
    var boot = document.querySelector(".os-boot-screen");
    if (boot && document.body.contains(boot)) {
      setBoot("Still loading… If this persists, open Console (F12) for errors.");
    }
  }, 12000);
})();
</script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;


/** Format remaining time until an ISO expiry timestamp. */
function formatExpiryCountdown(iso) {
  if (iso == null || iso === "") return null;
  var end;
  try {
    end = new Date(iso).getTime();
  } catch (e) {
    return null;
  }
  if (!end || isNaN(end)) return null;
  var ms = end - Date.now();
  if (ms <= 0) return { expired: true, text: "Expired", ms: 0, end: end };
  var sec = Math.floor(ms / 1000);
  var d = Math.floor(sec / 86400);
  var h = Math.floor((sec % 86400) / 3600);
  var m = Math.floor((sec % 3600) / 60);
  var s = sec % 60;
  var textStr;
  if (d > 0) textStr = d + "d " + h + "h " + m + "m";
  else if (h > 0) textStr = h + "h " + m + "m " + s + "s";
  else if (m > 0) textStr = m + "m " + s + "s";
  else textStr = s + "s";
  return { expired: false, text: textStr, ms: ms, end: end };
}

function AccessExpiryBanner(props) {
  props = props || {};
  var accessExpiresAt = props.accessExpiresAt;
  var nitroExpiresAt = props.nitroExpiresAt;
  var compact = props.compact;
  var tickState = useState(0);
  var setTick = tickState[1];
  useEffect(
    function () {
      if (!accessExpiresAt && !nitroExpiresAt) return undefined;
      var id = setInterval(function () {
        setTick(function (t) {
          return t + 1;
        });
      }, 1000);
      return function () {
        clearInterval(id);
      };
    },
    [accessExpiresAt, nitroExpiresAt]
  );

  var access = formatExpiryCountdown(accessExpiresAt);
  var nitro = formatExpiryCountdown(nitroExpiresAt);
  if (!access && !nitro) return null;

  var box = {
    marginTop: compact ? 8 : 0,
    padding: compact ? "8px 10px" : "12px 14px",
    borderRadius: 10,
    border: "1px solid rgba(251, 191, 36, 0.35)",
    background: "rgba(245, 158, 11, 0.1)",
    fontSize: compact ? 12 : 13,
    lineHeight: 1.45
  };

  return (
    <div style={box}>
      <div style={{ fontWeight: 800, color: "#fbbf24", marginBottom: 4 }}>
        ⏱️ Access timers
      </div>
      {access ? (
        <div style={{ color: access.expired ? "#f87171" : "var(--text)" }}>
          BrowserOS access:{" "}
          <strong>
            {access.expired ? "Expired" : access.text + " remaining"}
          </strong>
          {!access.expired && accessExpiresAt ? (
            <span style={{ color: "var(--text-muted)", fontSize: 11 }}>
              {" "}
              · ends {new Date(accessExpiresAt).toLocaleString()}
            </span>
          ) : null}
        </div>
      ) : null}
      {nitro ? (
        <div
          style={{
            color: nitro.expired ? "#f87171" : "var(--text)",
            marginTop: access ? 4 : 0
          }}
        >
          Nitro / Turbo:{" "}
          <strong>
            {nitro.expired ? "Expired" : nitro.text + " remaining"}
          </strong>
          {!nitro.expired && nitroExpiresAt ? (
            <span style={{ color: "var(--text-muted)", fontSize: 11 }}>
              {" "}
              · ends {new Date(nitroExpiresAt).toLocaleString()}
            </span>
          ) : null}
        </div>
      ) : null}
    </div>
  );
}


/* ─── BOUNCY BALL ─── */
function BouncyBall(){
  const wrapRef = useRef(null);
  const [pos,setPos] = useState({x:100,y:100});
  const velRef = useRef({x:4,y:3});

  useEffect(()=>{
    const id = setInterval(()=>{
      const bounds = wrapRef.current?.getBoundingClientRect() || {width:800,height:500};
      const W = bounds.width - 46;
      const H = bounds.height - 46;
      setPos(p=>{
        let nx = p.x + velRef.current.x;
        let ny = p.y + velRef.current.y;
        if(nx<=0||nx>=W){ velRef.current.x=-velRef.current.x; nx=Math.max(0,Math.min(nx,W)); }
        if(ny<=0||ny>=H){ velRef.current.y=-velRef.current.y; ny=Math.max(0,Math.min(ny,H)); }
        return {x:nx,y:ny};
      });
    },14);
    return ()=>clearInterval(id);
  },[]);

  return (
    <div ref={wrapRef} className="bouncy-wrap">
      <div className="ball" style={{left:pos.x,top:pos.y}}/>
    </div>
  );
}

/* ─── REACTION TIME (UPDATED: SESSION SYSTEM) ─── */
function ReactionTime({ openApp }) {

  /* ─────────────────────────────
     🧠 CORE STATE
  ───────────────────────────── */

  const [state, setState] = useState("idle"); 
  // idle | waiting | ready | result

  const [sessionState, setSessionState] = useState("select");
  // select | playing | finished

  const [totalRounds, setTotalRounds] = useState(5);
  const [round, setRound] = useState(0);

  const [sessionResults, setSessionResults] = useState([]);

  const [message, setMessage] = useState("Hold anywhere to start");
  const [startTime, setStartTime] = useState(null);
  const [result, setResult] = useState(null);

  const [name, setName] = useState(
    localStorage.getItem("username") || ""
  );

  const [leaderboard, setLeaderboard] = useState([]);

  const holdTimer = useRef(null);
  const randomTimer = useRef(null);

  /* ─────────────────────────────
     📊 LOAD LEADERBOARD
  ───────────────────────────── */

  useEffect(() => {
    let cancelled = false;
    (async () => {
      const local = (Leaderboards.get("reaction") || []).slice(0, 5);
      if (!cancelled) setLeaderboard(local);
      try {
        const global = await Leaderboards.fetchReactionGlobal(10);
        if (!cancelled && global && global.length) setLeaderboard(global.slice(0, 10));
      } catch (_) {}
    })();
    return () => {
      cancelled = true;
    };
  }, []);

  /* ─────────────────────────────
     🧹 CLEANUP (PREVENT CRASHES)
  ───────────────────────────── */

  useEffect(() => {
    return () => {
      clearTimeout(holdTimer.current);
      clearTimeout(randomTimer.current);
    };
  }, []);

  /* ─────────────────────────────
     🎮 ROUND ENGINE
  ───────────────────────────── */

  const nextRound = (reactionTime) => {

    if (reactionTime == null || Number.isNaN(reactionTime)) return;

    setSessionResults(prev => {
      const updated = [...prev, reactionTime];

      const next = round + 1;

      if (next >= totalRounds) {
        setSessionState("finished");
        setState("idle");
        setMessage("Hold anywhere to start");
      } else {
        setRound(next);
        setState("idle");
        setMessage("Hold anywhere to start");
      }

      return updated;
    });

    setResult(null);
    setStartTime(null);

    clearTimeout(holdTimer.current);
    clearTimeout(randomTimer.current);
  };

  /* ─────────────────────────────
     🟢 START HOLD
  ───────────────────────────── */

  const handleDown = () => {

    if (sessionState !== "playing") return;
    if (state !== "idle") return;

    setMessage("Keep holding…");

    holdTimer.current = setTimeout(() => {

      setState("waiting");
      setMessage("Wait for it…");

      const delay = 1500 + Math.random() * 6000;

      randomTimer.current = setTimeout(() => {

        setState("ready");
        setMessage("NOW!");

        setStartTime(performance.now());

      }, delay);

    }, 1000);
  };

  /* ─────────────────────────────
     🔴 RELEASE
  ───────────────────────────── */

  const handleUp = () => {

    if (sessionState !== "playing") return;

    // too early
    if (state === "idle") {
      clearTimeout(holdTimer.current);
      setMessage("Hold for at least 1 second");
      return;
    }

    // false start
    if (state === "waiting") {
      clearTimeout(randomTimer.current);
      setState("idle");
      setMessage("Too early! Try again");
      return;
    }

    // success
    if (state === "ready") {

      if (!startTime) return;

      const t = Math.round(performance.now() - startTime);

      setResult(t);
      setState("result");
    }
  };

  /* ─────────────────────────────
     💾 SAVE ROUND
  ───────────────────────────── */

  const saveRound = () => {

    if (!name.trim()) return;
    if (result == null) return;

    const entry = {
      name: name.trim(),
      time: result,
      date: Date.now()
    };

    Leaderboards.save("reaction", entry);

    (async () => {
      try {
        const global = await Leaderboards.fetchReactionGlobal(10);
        if (global && global.length) setLeaderboard(global.slice(0, 10));
        else setLeaderboard((Leaderboards.get("reaction") || []).slice(0, 5));
      } catch (_) {
        setLeaderboard((Leaderboards.get("reaction") || []).slice(0, 5));
      }
    })();

    nextRound(result);
  };

  /* ─────────────────────────────
     🎨 UI HELPERS
  ───────────────────────────── */

  const bgMap = {
    idle: "#080c12",
    waiting: "#052e16",
    ready: "#2e1065",
    result: "#080c12"
  };

  const medals = ["🥇", "🥈", "🥉", "🎖", "5"];

  /* ─────────────────────────────
     🧾 SESSION SELECT SCREEN
  ───────────────────────────── */

  if (sessionState === "select") {
    return (
      <div className="reaction-wrap">

        <div className="reaction-msg">
          Choose session length
        </div>

        {[1, 3, 5, 10, 15, 20].map(n => (
          <button
            key={n}
            className="reaction-btn"
            onClick={() => {

              clearTimeout(holdTimer.current);
              clearTimeout(randomTimer.current);

              setTotalRounds(n);
              setRound(0);
              setSessionResults([]);

              setResult(null);
              setStartTime(null);

              setSessionState("playing");
              setState("idle");
            }}
          >
            {n} rounds
          </button>
        ))}

      </div>
    );
  }

  /* ─────────────────────────────
     🏁 SESSION FINISHED SCREEN
  ───────────────────────────── */

  if (sessionState === "finished") {

    const avg =
      sessionResults.reduce((a, b) => a + b, 0) /
      sessionResults.length;

    const best = Math.min(...sessionResults);
    const worst = Math.max(...sessionResults);

    return (
      <div className="reaction-wrap">

        <div className="reaction-result">

          <h2>Session Complete</h2>

          <p>Avg: {Math.round(avg)}ms</p>
          <p>Best: {best}ms</p>
          <p>Worst: {worst}ms</p>

          <button
            className="reaction-btn"
            onClick={() => {
              setSessionState("select");
              setSessionResults([]);
              setRound(0);
            }}
          >
            New Session
          </button>

        </div>
      </div>
    );
  }

  /* ─────────────────────────────
     🎮 MAIN GAME UI
  ───────────────────────────── */

  return (

    <div
      className="reaction-wrap"
      style={{ background: bgMap[state] }}

      onMouseDown={handleDown}
      onMouseUp={handleUp}
      onTouchStart={handleDown}
      onTouchEnd={handleUp}
    >

      {/* ROUND COUNTER */}
      <div
        style={{
          position: "absolute",
          top: 10,
          right: 10,
          fontSize: 12,
          opacity: 0.7
        }}
      >
        {round + 1}/{totalRounds}
      </div>

      {/* MESSAGE */}
      {state !== "result" && (
        <div className="reaction-msg">
          {state === "ready"
            ? <span style={{ color: "#c4b5fd", fontSize: "36px" }}>
                ⚡ {message}
              </span>
            : message}
        </div>
      )}

      {/* RESULT SCREEN */}
      {state === "result" && (
        <div
          className="reaction-result"
          onClick={e => e.stopPropagation()}
        >

          <div className="reaction-ms">
            {result} <span>ms</span>
          </div>

          <div className="reaction-label">
            Reaction Time
          </div>

          <div className="reaction-name-row">

            <input
              className="reaction-input"
              placeholder="Your name"
              value={name}
              onChange={e => setName(e.target.value)}
              onKeyDown={e => e.key === "Enter" && saveRound()}
            />

            <button className="reaction-btn" onClick={saveRound}>
              Save
            </button>

            <button
              className="reaction-btn"
              onClick={() => {
                setState("idle");
                setMessage("Hold anywhere to start");
                setResult(null);
              }}
            >
              Redo
            </button>

          </div>
        </div>
      )}

      {/* LEADERBOARD */}
      {leaderboard.length > 0 && (
        <div className="lb" onClick={e => e.stopPropagation()}>

          <h4>Leaderboard</h4>

          <div style={{ fontSize: 11, color: "var(--text-muted)", marginBottom: 6 }}>
            Global top times
          </div>
          {leaderboard.map((e, i) => (
            <div key={i} className="lb-row">
              <span>{medals[i]} {e.name}</span>
              <span>{e.time}ms</span>
            </div>
          ))}

          <div
            onClick={() => openApp("leaderboard")}
            style={{
              marginTop: 12,
              fontSize: 11,
              color: "var(--accent)",
              cursor: "pointer"
            }}
          >
            View leaderboard.os →
          </div>

        </div>
      )}

    </div>
  );
}

/* ─── NOTES ─── */
function Notes(){
  const [text, setText] = useState("");
  const [saved, setSaved] = useState(false);
  const [status, setStatus] = useState("");
  const [fileName, setFileName] = useState("");
  const saveTimer = useRef(null);
  const fileHandleRef = useRef(null);
  const legacyOpenRef = useRef(null);

  const supportsFsAccess =
    typeof window !== "undefined" &&
    "showOpenFilePicker" in window &&
    "showSaveFilePicker" in window;

  useEffect(() => {
    setText(localStorage.getItem("notes") || "");
  }, []);

  const flash = (msg) => {
    setStatus(msg);
    setTimeout(() => setStatus(""), 2000);
  };

  const handleChange = (v) => {
    setText(v);
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      localStorage.setItem("notes", v);
      setSaved(true);
      setTimeout(() => setSaved(false), 1500);
    }, 600);
  };

  const openFromDisk = async () => {
    if (typeof hasProAccess === "function" && !hasProAccess()) {
      flash("Save/open .txt on disk needs Nitro — notes still auto-save in the browser.");
      return;
    }
    try {
      if (supportsFsAccess) {
        const [handle] = await window.showOpenFilePicker({
          multiple: false,
          types: [
            {
              description: "Text files",
              accept: {
                "text/plain": [".txt", ".md", ".markdown", ".text"],
                "text/markdown": [".md", ".markdown"]
              }
            }
          ]
        });
        const file = await handle.getFile();
        const content = await file.text();
        fileHandleRef.current = handle;
        setFileName(file.name || "untitled.txt");
        setText(content);
        localStorage.setItem("notes", content);
        flash("Opened from disk");
        return;
      }
      // Fallback: hidden file input
      legacyOpenRef.current?.click();
    } catch (err) {
      if (err && err.name === "AbortError") return;
      flash("Could not open file");
    }
  };

  const onLegacyOpen = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    try {
      const content = await file.text();
      fileHandleRef.current = null;
      setFileName(file.name || "untitled.txt");
      setText(content);
      localStorage.setItem("notes", content);
      flash("Opened from disk");
    } catch (_) {
      flash("Could not open file");
    }
  };

  const saveToDisk = async () => {
    if (typeof hasProAccess === "function" && !hasProAccess()) {
      flash("Exporting .txt/.md needs Nitro. Your notes still save automatically in BrowserOS.");
      return;
    }
    try {
      if (supportsFsAccess) {
        let handle = fileHandleRef.current;
        if (!handle) {
          handle = await window.showSaveFilePicker({
            suggestedName: fileName || "notes.txt",
            types: [
              {
                description: "Text file",
                accept: { "text/plain": [".txt"] }
              },
              {
                description: "Markdown",
                accept: { "text/markdown": [".md"] }
              }
            ]
          });
          fileHandleRef.current = handle;
          setFileName(handle.name || fileName || "notes.txt");
        }
        const writable = await handle.createWritable();
        await writable.write(text);
        await writable.close();
        localStorage.setItem("notes", text);
        flash("Saved to disk");
        return;
      }
      // Fallback: download
      const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = fileName || "notes.txt";
      a.click();
      URL.revokeObjectURL(a.href);
      flash("Downloaded");
    } catch (err) {
      if (err && err.name === "AbortError") return;
      flash("Could not save file");
    }
  };

  const saveAsToDisk = async () => {
    if (!supportsFsAccess) {
      await saveToDisk();
      return;
    }
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: fileName || "notes.txt",
        types: [
          {
            description: "Text file",
            accept: { "text/plain": [".txt"] }
          },
          {
            description: "Markdown",
            accept: { "text/markdown": [".md"] }
          }
        ]
      });
      fileHandleRef.current = handle;
      setFileName(handle.name || "notes.txt");
      const writable = await handle.createWritable();
      await writable.write(text);
      await writable.close();
      localStorage.setItem("notes", text);
      flash("Saved to disk");
    } catch (err) {
      if (err && err.name === "AbortError") return;
      flash("Could not save file");
    }
  };

  const wc = text.trim() ? text.trim().split(/\s+/).length : 0;

  return (
    <div className="notes-wrap">
      <div className="notes-header">
        <span style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <span>Notes</span>
          {fileName ? <span className="notes-filename">{fileName}</span> : null}
        </span>
        <span className="notes-actions">
          <button type="button" className="notes-btn" onClick={openFromDisk}>
            Open…
          </button>
          <button type="button" className="notes-btn" onClick={saveToDisk}>
            Save
          </button>
          {supportsFsAccess && (
            <button type="button" className="notes-btn" onClick={saveAsToDisk}>
              Save as…
            </button>
          )}
          <span style={{ color: "var(--text-muted)" }}>{wc} words</span>
          <span className={"notes-saved" + (saved ? " show" : "")}>
            {status || "Saved ✓"}
          </span>
          {!supportsFsAccess && (
            <input
              ref={legacyOpenRef}
              type="file"
              accept=".txt,.md,.markdown,.text,text/plain,text/markdown"
              style={{ display: "none" }}
              onChange={onLegacyOpen}
            />
          )}
        </span>
      </div>
      <textarea
        className="notes-ta"
        value={text}
        onChange={e => handleChange(e.target.value)}
        placeholder="Start typing… Use Open / Save to work with real .txt or .md files on your computer."
        spellCheck={false}
      />
    </div>
  );
}

function AimTrainer() {
