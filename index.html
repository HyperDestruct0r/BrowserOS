  const [saved, setSaved] = useState(false);

  const times = [5, 10, 15, 20, 30, 45, 60];

  const spawn = () => {
    const el = wrapRef.current;
    if (!el) return;

    const { width, height } = el.getBoundingClientRect();

    setTarget({
      x: 20 + Math.random() * (width - 84),
      y: 20 + Math.random() * (height - 84),
    });
  };

  const startGame = () => {
    setScore(0);
    setMissed(0);
    setTimeLeft(selectedTime);
    setGameState("running");
    setSaved(false);
    spawn();
  };

  const hit = (e) => {
    if (gameState !== "running") return;
    e.stopPropagation();
    setScore((s) => s + 1);
    spawn();
  };

  const miss = () => {
    if (gameState !== "running") return;
    setMissed((m) => m + 1);
  };

  /* ─── TIMER ─── */
  useEffect(() => {
    if (gameState !== "running") return;

    const interval = setInterval(() => {
      setTimeLeft((t) => {
        if (t <= 1) {
          clearInterval(interval);
          setGameState("done");
          setTarget(null);
          return 0;
        }
        return t - 1;
      });
    }, 1000);

    return () => clearInterval(interval);
  }, [gameState]);

  const finalScore = Math.max(
    Math.floor((score - missed) / Math.log(10)),
    0
  );

  /* ─── SAVE SCORE (like ReactionTime) ─── */
  const saveScore = () => {
    if (!name.trim()) return;

    const entry = {
      name: name.trim(),
      score,
      missed,
      accuracy: score + missed > 0
        ? Math.round((score / (score + missed)) * 100)
        : 0,
      finalScore,
      time: selectedTime,
      date: Date.now()
    };

    Leaderboards.save("aim", entry);

    setSaved(true);
    setTimeout(() => setSaved(false), 1500);
  };

  return (
    <div
      ref={wrapRef}
      className="aim-wrap"
      onClick={miss}
    >

      {/* ─── HUD ─── */}
      {gameState !== "idle" && (
        <div className="aim-hud">
          <div style={{ display: "flex", gap: "20px" }}>
            <span>
              Score <span className="aim-score">{score}</span>
            </span>

            <span>
              Missed{" "}
              <span style={{
                color: "var(--danger)",
                fontSize: "22px",
                fontWeight: "800"
              }}>
                {missed}
              </span>
            </span>

            <span>
              Time <span className="aim-score">{timeLeft}</span>
            </span>
          </div>
        </div>
      )}

      {/* ─── START SCREEN ─── */}
      {gameState === "idle" && (
        <div style={{
          position: "absolute",
          inset: 0,
          display: "flex",
          flexDirection: "column",
          alignItems: "center",
          justifyContent: "center",
          gap: "18px"
        }}>

          <div style={{ fontSize: "18px", opacity: 0.8 }}>
            Select Time
          </div>

          <div style={{
            display: "flex",
            flexWrap: "wrap",
            gap: "10px",
            justifyContent: "center",
            maxWidth: "320px"
          }}>
            {times.map((t) => (
              <button
                key={t}
                onClick={() => setSelectedTime(t)}
                style={{
                  padding: "8px 12px",
                  borderRadius: "10px",
                  border: "1px solid var(--border)",
                  background: selectedTime === t
                    ? "var(--surface2)"
                    : "transparent",
                  color: "var(--text)",
                  cursor: "pointer"
                }}
              >
                {t}s
              </button>
            ))}
          </div>

          <button
            onClick={startGame}
            style={{
              padding: "12px 26px",
              fontSize: "16px",
              fontWeight: 700,
              borderRadius: "14px",
              border: "1px solid var(--border)",
              background: "var(--surface2)",
              color: "var(--text)",
              cursor: "pointer"
            }}
          >
            Start
          </button>
        </div>
      )}

      {/* ─── END SCREEN ─── */}
        {gameState === "done" && (
          <div style={{
            position: "absolute",
            inset: 0,
            display: "flex",
            alignItems: "center",
            justifyContent: "center",
            flexDirection: "column",
            gap: "12px"
          }}>
        
            <div style={{ fontSize: "22px" }}>
              Final Score: <b>{finalScore}</b>
            </div>
        
            <div style={{
              display: "flex",
              gap: "10px",
              alignItems: "center",
              marginTop: "10px"
            }}>
        
              <input
                value={name}
                onChange={(e) => setName(e.target.value)}
                placeholder="Your name"
                style={{
                  padding: "10px 12px",
                  borderRadius: "10px",
                  border: "1px solid var(--border)",
                  background: "var(--surface)",
                  color: "var(--text)",
                  fontFamily: "'DM Mono', monospace",
                  outline: "none",
                  width: "140px"
                }}
              />
        
              {/* SAVE BUTTON */}
              <button
                onClick={saveScore}
                style={{
                  padding: "10px 14px",
                  borderRadius: "10px",
                  border: "1px solid rgba(110,231,183,0.3)",
                  background: "rgba(110,231,183,0.10)",
                  color: "var(--accent)",
                  fontWeight: 700,
                  fontSize: "12px",
                  letterSpacing: "0.06em",
                  cursor: "pointer",
                  transition: "all 0.2s ease",
                  backdropFilter: "blur(10px)"
                }}
                onMouseEnter={(e) => {
                  e.currentTarget.style.transform = "translateY(-2px)";
                  e.currentTarget.style.background = "rgba(110,231,183,0.18)";
                }}
                onMouseLeave={(e) => {
                  e.currentTarget.style.transform = "translateY(0px)";
                  e.currentTarget.style.background = "rgba(110,231,183,0.10)";
                }}
              >
                Save
              </button>
        
              {/* REDO BUTTON */}
              <button
                onClick={() => setGameState("idle")}
                style={{
                  padding: "10px 14px",
                  borderRadius: "10px",
                  border: "1px solid var(--border)",
                  background: "var(--surface)",
                  color: "var(--text)",
                  fontWeight: 600,
                  fontSize: "12px",
                  cursor: "pointer",
                  transition: "all 0.2s ease",
                  backdropFilter: "blur(10px)"
                }}
                onMouseEnter={(e) => {
                  e.currentTarget.style.transform = "translateY(-2px)";
                  e.currentTarget.style.background = "var(--surface2)";
                }}
                onMouseLeave={(e) => {
                  e.currentTarget.style.transform = "translateY(0px)";
                  e.currentTarget.style.background = "var(--surface)";
                }}
              >
                Redo
              </button>
        
            </div>
        
            {saved && (
              <div style={{
                color: "var(--accent)",
                fontSize: "12px"
              }}>
                Saved ✓
              </div>
            )}
        
          </div>
        )}

      {/* ─── TARGET ─── */}
      {gameState === "running" && target && (
        <div
          className="aim-target"
          style={{ left: target.x, top: target.y }}
          onClick={hit}
        />
      )}
    </div>
  );
}

/* ─── PROFILE ─── */
function Profile(){
  const [name, setName] = useState("");
  const [pronouns, setPronouns] = useState("");
  const [bio, setBio] = useState("");
  const [customStatus, setCustomStatus] = useState("");
  const [shareActivity, setShareActivity] = useState(true);
  const [customActivity, setCustomActivity] = useState("");
  const [presenceStatus, setPresenceStatus] = useState("online");
  const [avatarUrl, setAvatarUrl] = useState("");
  const [bannerUrl, setBannerUrl] = useState("");
  const [cropEditor, setCropEditor] = useState(null);
  const [email, setEmail] = useState("");
  const [isAdmin, setIsAdmin] = useState(false);
  const [isDev, setIsDev] = useState(false);
  const [isNitro, setIsNitro] = useState(false);
  const [isTurbo, setIsTurbo] = useState(false);
  const [userTier, setUserTier] = useState(0);
  const [turboTagline, setTurboTagline] = useState("");
  const [turboIcon, setTurboIcon] = useState("⚡");
  const [turboTheme, setTurboTheme] = useState("none");
  const [turboAccent, setTurboAccent] = useState("#22d3ee");
  const [turboHeaderAura, setTurboHeaderAura] = useState("#6366f1");
  const [turboCardGlow, setTurboCardGlow] = useState("#a78bfa");
  const [badgeDisplay, setBadgeDisplay] = useState("auto"); // auto|turbo|nitro|none (sub)
  const [staffBadge, setStaffBadge] = useState("auto"); // auto|dev|admin|none
  const [nameColor, setNameColor] = useState("");
  const [nameAnimation, setNameAnimation] = useState("none");
  const [nameFont, setNameFont] = useState("default");
  const [bannerMotion, setBannerMotion] = useState(() => {
    try {
      return localStorage.getItem("browserOS_banner_motion") === "1";
    } catch (_) {
      return false;
    }
  });
  const [avatarDeco, setAvatarDeco] = useState("none"); // legacy
  const [cardDeco, setCardDeco] = useState("none"); // legacy
  const [memberCardStyle, setMemberCardStyle] = useState("none");
  const [bannerEffect, setBannerEffect] = useState("none");
  const [avatarFrame, setAvatarFrame] = useState("none");
  const [saved, setSaved] = useState(false);
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const fileRef = useRef(null);

  useEffect(() => {
    (async () => {
      const client = getSupabaseClient();
      if (!client) {
        setName(localStorage.getItem("username") || "");
        return;
      }
      const { data: sessionData } = await client.auth.getSession();
      const session = sessionData && sessionData.session;
      if (!session) return;
      setEmail(session.user.email || "");
      const { data } = await client
        .from("profiles")
        .select("display_name, avatar_url, email, bio, pronouns, custom_status, is_admin, is_dev, is_nitro, is_turbo, tier, turbo_tagline, turbo_icon, turbo_theme, turbo_accent, turbo_header_aura, turbo_card_glow, badge_display, staff_badge, name_color, name_animation, name_font, avatar_decoration, card_decoration, member_card_style, banner_effect, avatar_frame, share_activity, custom_activity, presence_status, custom_banner_url")
        .eq("user_id", session.user.id)
        .maybeSingle();
      if (data) {
        setName(data.display_name || "");
        setAvatarUrl(data.avatar_url || "");
        setBannerUrl(data.custom_banner_url || "");
        setBio(data.bio || "");
        setPronouns(data.pronouns || "");
        setCustomStatus(data.custom_status || "");
        setShareActivity(data.share_activity != null ? !!data.share_activity : true);
        setCustomActivity(data.custom_activity || "");
        setPresenceStatus(data.presence_status || "online");
        setIsAdmin(!!data.is_admin);
        setIsDev(!!data.is_dev);
        setIsNitro(
          !!data.is_nitro ||
            !!data.is_turbo ||
            !!data.is_dev ||
            !!data.is_admin
        );
        setIsTurbo(
          !!data.is_dev ||
            !!data.is_admin ||
            (data.is_turbo === true
              ? true
              : data.is_turbo === false
              ? false
              : (data.tier || 0) >= 2)
        );
        setUserTier(getUserTier(data));
        setTurboTagline(data.turbo_tagline || "");
        setTurboIcon(data.turbo_icon || "⚡");
        setTurboTheme(data.turbo_theme || "none");
        setTurboAccent(safeCssColor(data.turbo_accent, "#22d3ee"));
        setTurboHeaderAura(safeCssColor(data.turbo_header_aura, "#6366f1"));
        setTurboCardGlow(safeCssColor(data.turbo_card_glow, "#a78bfa"));
        setBadgeDisplay(data.badge_display || "auto");
        setStaffBadge(data.staff_badge || "auto");
        setNameColor(data.name_color || "");
        setNameAnimation(data.name_animation || "none");
        setNameFont(data.name_font || "default");
        applyTurboThemeFromProfile(data);
        setAvatarDeco(data.avatar_decoration || "none");
        setCardDeco(data.card_decoration || "none");
        setMemberCardStyle(data.member_card_style || data.card_decoration || "none");
        setBannerEffect(data.banner_effect || data.card_decoration || "none");
        setAvatarFrame(data.avatar_frame || data.avatar_decoration || "none");
        if (data.email) setEmail(data.email);
      }
    })();
  }, []);

  const save = async () => {
    setError("");
    setBusy(true);
    const nick = String(name || "").trim().slice(0, 32);
    const pr = String(pronouns || "").trim().slice(0, 40);
    const bioMax =
      typeof bioCharLimit === "function" ? bioCharLimit() : 300;
    const about = String(bio || "").trim().slice(0, bioMax);
    const statusMsg = String(customStatus || "").trim().slice(0, 80);
    if (nick && !/^[A-Za-z0-9_ ]{2,32}$/.test(nick)) {
      setError("Display name: 2–32 letters, numbers, spaces, or underscores.");
      setBusy(false);
      return;
    }
    localStorage.setItem("username", nick);
    const client = getSupabaseClient();
    if (client) {
      const { data: sessionData } = await client.auth.getSession();
      const session = sessionData && sessionData.session;
      if (session) {
        const { error: uErr } = await client
          .from("profiles")
          .update({
            display_name: nick || null,
            pronouns: pr || null,
            bio: about || null,
            custom_status: statusMsg || null,
            share_activity: !!shareActivity,
            presence_status: presenceStatus || "online",
            custom_banner_url:
              isAdmin || isNitro
                ? String(bannerUrl || "").trim() || null
                : undefined,
            custom_activity:
              isAdmin || isNitro
                ? String(customActivity || "").trim().slice(0, 80) || null
                : undefined,
            ...(isAdmin || isDev || isNitro
              ? {
                  avatar_decoration: avatarFrame || avatarDeco || "none",
                  card_decoration: bannerEffect || cardDeco || "none",
                  member_card_style: memberCardStyle || "none",
                  banner_effect: bannerEffect || "none",
                  avatar_frame: avatarFrame || "none",
                  badge_display: badgeDisplay != null ? badgeDisplay : "auto",
                  name_animation: nameAnimation || "none",
                  name_font: nameFont || "default"
                }
              : {}),
            ...(isAdmin || isDev
              ? {
                  staff_badge: staffBadge != null ? staffBadge : "auto",
                  name_color: nameColor ? safeCssColor(nameColor, "") || null : null
                }
              : {}),
            ...(isAdmin || isTurbo
              ? {
                  turbo_tagline: String(turboTagline || "").trim().slice(0, 40),
                  turbo_icon: String(turboIcon || "⚡").slice(0, 4),
                  turbo_theme: turboTheme || "none",
                  turbo_accent: safeCssColor(turboAccent, "#22d3ee"),
                  turbo_header_aura: safeCssColor(turboHeaderAura, "#6366f1"),
                  turbo_card_glow: safeCssColor(turboCardGlow, "#a78bfa")
                }
              : {})
          })
          .eq("user_id", session.user.id);
        if (uErr) {
          setError(uErr.message || "Could not save profile.");
          setBusy(false);
          return;
        }
        if (window.__browserOSProfile) {
          window.__browserOSProfile.display_name = nick || null;
          window.__browserOSProfile.pronouns = pr || null;
          window.__browserOSProfile.bio = about || null;
          window.__browserOSProfile.custom_status = statusMsg || null;
          window.__browserOSProfile.share_activity = !!shareActivity;
          window.__browserOSProfile.presence_status = presenceStatus || "online";
          window.__browserOSProfile.custom_activity =
            isAdmin || isNitro ? String(customActivity || "").trim() : null;
          window.__browserOSProfile.badge_display = badgeDisplay != null ? badgeDisplay : "auto";
          window.__browserOSProfile.staff_badge = staffBadge != null ? staffBadge : "auto";
          window.__browserOSProfile.name_color = nameColor || null;
          window.__browserOSProfile.name_animation = nameAnimation || "none";
          window.__browserOSProfile.name_font = nameFont || "default";
        }
        try {
          window.dispatchEvent(
            new CustomEvent("browseros-profile-updated", {
              detail: {
                email: String(email || "").toLowerCase(),
                display_name: nick || null,
                custom_status: statusMsg || null,
                presence_status: presenceStatus || "online"
              }
            })
          );
        } catch (_) {}
        try {
          const em = String(email || "").toLowerCase();
          window.dispatchEvent(
            new CustomEvent("browseros-profile-cosmetics", {
              detail: {
                email: em,
                badge_display: badgeDisplay != null ? badgeDisplay : "auto",
                staff_badge: staffBadge != null ? staffBadge : "auto",
                name_color: nameColor || null,
                name_animation: nameAnimation || "none",
                name_font: nameFont || "default"
              }
            })
          );
        } catch (_) {}
        window.__browserOSPresence = presenceStatus || "online";
      }
    }
    setBusy(false);
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  };

  const openBannerCrop = file => {
    if (!file) return;
    if (!file.type.startsWith("image/")) {
      setError("Please choose an image file.");
      return;
    }
    if (file.size > 1.8 * 1024 * 1024) {
      setError("Banner image too large — keep under ~1.5–2 MB.");
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      if (typeof reader.result !== "string") {
        setError("Could not read banner file.");
        return;
      }
      setCropEditor({
        mode: "banner",
        src: reader.result,
        next: dataUrl => {
          setBannerUrl(dataUrl);
          setError("");
        }
      });
    };
    reader.onerror = () => setError("Failed to read banner file.");
    reader.readAsDataURL(file);
  };

  const onAvatar = async (file) => {
    if (!file) return;
    setError("");
    if (!file.type.startsWith("image/")) {
      setError("Please choose an image file.");
      return;
    }
    if (file.size > 5 * 1024 * 1024) {
      setError("Avatar must be under 5 MB.");
      return;
    }
    const isGif =
      file.type === "image/gif" || /\.gif$/i.test(file.name || "");
    if (isGif && !(isAdmin || isTurbo)) {
      setError("Animated GIF avatars require BrowserOS Turbo (or staff).");
      return;
    }
    // Non-GIF: crop first
    if (!isGif) {
      const reader = new FileReader();
      reader.onload = () => {
        if (typeof reader.result !== "string") {
          setError("Could not read image.");
          return;
        }
        setCropEditor({
          mode: "avatar",
          src: reader.result,
          next: async dataUrl => {
            try {
              const res = await fetch(dataUrl);
              const blob = await res.blob();
              const client = getSupabaseClient();
              if (!client) {
                setError("Supabase not configured.");
                return;
              }
              setBusy(true);
              const { data: sessionData } = await client.auth.getSession();
              const session = sessionData && sessionData.session;
              if (!session) {
                setBusy(false);
                setError("Not signed in.");
                return;
              }
              const path = session.user.id + "/avatar.jpg";
              const { error: upErr } = await client.storage
                .from("avatars")
                .upload(path, blob, { upsert: true, contentType: "image/jpeg" });
              if (upErr) {
                setBusy(false);
                setError(upErr.message || "Upload failed.");
                return;
              }
              const { data: pub } = client.storage.from("avatars").getPublicUrl(path);
              const url =
                pub && pub.publicUrl ? pub.publicUrl + "?t=" + Date.now() : "";
              await client
                .from("profiles")
                .update({ avatar_url: url })
                .eq("user_id", session.user.id);
              setBusy(false);
              setAvatarUrl(url);
              setSaved(true);
              setTimeout(() => setSaved(false), 2000);
            } catch (err) {
              setBusy(false);
              setError((err && err.message) || "Avatar upload failed.");
            }
          }
        });
      };
      reader.onerror = () => setError("Failed to read image.");
      reader.readAsDataURL(file);
      return;
    }
    const client = getSupabaseClient();
    if (!client) {
      setError("Supabase not configured.");
      return;
    }
    setBusy(true);
    const { data: sessionData } = await client.auth.getSession();
    const session = sessionData && sessionData.session;
    if (!session) {
      setBusy(false);
      setError("Not signed in.");
      return;
    }
    const ext = (file.name.split(".").pop() || "png").toLowerCase().replace(/[^a-z0-9]/g, "");
    const path = session.user.id + "/avatar." + (ext || "png");
    const { error: upErr } = await client.storage.from("avatars").upload(path, file, {
      upsert: true,
      contentType: file.type
    });
    if (upErr) {
      setBusy(false);
      setError(upErr.message || "Upload failed. Create the avatars bucket.");
      return;
    }
    const { data: pub } = client.storage.from("avatars").getPublicUrl(path);
    const url = pub && pub.publicUrl ? pub.publicUrl + "?t=" + Date.now() : "";
    const { error: pErr } = await client
      .from("profiles")
      .update({ avatar_url: url })
      .eq("user_id", session.user.id);
    setBusy(false);
    if (pErr) {
      setError(pErr.message || "Saved file but profile update failed.");
      return;
    }
    setAvatarUrl(url);
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  };

  return (
    <div className="profile internal" style={{ padding: 24, maxWidth: 480 }}>
      {cropEditor && (
        <ImageCropModal
          src={cropEditor.src}
          mode={cropEditor.mode}
          onCancel={() => setCropEditor(null)}
          onConfirm={dataUrl => {
            const next = cropEditor.next;
            setCropEditor(null);
            if (typeof next === "function") next(dataUrl);
          }}
        />
      )}
      <h2 style={{ marginTop: 0 }}>Profile</h2>
      <p style={{ fontSize: 13, color: "var(--text-muted)", marginBottom: 16 }}>
        Display name is used for chat pings like <code>@YourName</code>. Avatar is separate from wallpaper.
      </p>
      <div className="profile-card" style={{ display: "flex", flexDirection: "column", gap: 14 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
          <div
            style={{
              width: 72,
              height: 72,
              borderRadius: "50%",
              overflow: "hidden",
              background: "var(--surface2)",
              border: "1px solid var(--border)",
              flexShrink: 0
            }}
          >
            {avatarUrl ? (
              <img src={avatarUrl} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} />
            ) : (
              <div style={{ width: "100%", height: "100%", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 28 }}>
                👤
              </div>
            )}
          </div>
          <div>
            <button type="button" className="notes-btn" disabled={busy} onClick={() => fileRef.current && fileRef.current.click()}>
              Change avatar
            </button>
            <input
              ref={fileRef}
              type="file"
              accept="image/*"
              style={{ display: "none" }}
              onChange={e => onAvatar(e.target.files && e.target.files[0])}
            />
            <div style={{ fontSize: 11, color: "var(--text-muted)", marginTop: 6 }}>
              Max 5 MB · JPG/PNG/GIF/WebP
              {(isAdmin || isTurbo) && " · Animated GIF avatars unlocked (Turbo/staff)"}
              {isNitro && !isTurbo && !isAdmin && " · GIF avatars require Turbo"}
            </div>
          </div>
        </div>
        {(isAdmin || isTurbo) && (
          <div>
            <div className="field-label">Animated avatar GIF URL (Turbo)</div>
            <input
              className="field-input"
              value={avatarUrl}
              onChange={e => setAvatarUrl(e.target.value)}
              placeholder="https://example.com/avatar.gif"
              disabled={busy}
            />
            <button
              type="button"
              className="notes-btn"

                const url = String(avatarUrl || "").trim();
                if (!url) return;
                if (!/\.(gif|png|jpe?g|webp)(\?|$)/i.test(url) && !url.includes("gif")) {
                  setError("Use a direct image URL (gif/png/jpg/webp).");
                  return;
                }
                const client = getSupabaseClient();
                if (!client) return;
                setBusy(true);
                const { data: sessionData } = await client.auth.getSession();
                const session = sessionData && sessionData.session;
                if (!session) {
                  setBusy(false);
                  return;
                }
                const { error: pErr } = await client
                  .from("profiles")
                  .update({ avatar_url: url })
                  .eq("user_id", session.user.id);
                setBusy(false);
                if (pErr) setError(pErr.message || "Could not save avatar URL.");
                else {
                  setSaved(true);
                  setTimeout(() => setSaved(false), 2000);
                }
              }}
            >

/* ─── DOCK PINS + SLEEP SESSION ─── */
const DOCK_DEFAULT_PINS = ["homepage", "notes", "terminal", "projects", "chat", "settings"];
const DOCK_PINS_KEY = "browserOS_dock_pins";
const SLEEP_SESSION_KEY = "browserOS_sleep_session";

function loadDockPins() {
  try {
    const raw = JSON.parse(localStorage.getItem(DOCK_PINS_KEY) || "null");
    if (Array.isArray(raw) && raw.length) {
      return raw.map(String).slice(0, 12);
    }
  } catch (_) {}
  return DOCK_DEFAULT_PINS.slice();
}

function saveDockPins(pins) {
  try {
    localStorage.setItem(DOCK_PINS_KEY, JSON.stringify(pins));
  } catch (_) {}
}

function resolveDockAppMeta(key) {
  const catalog = typeof getBrowserOSAppCatalog === "function" ? getBrowserOSAppCatalog() : [];
  const hit = catalog.find(a => a.key === key);
  if (hit) return hit;
  const builtins = {
    homepage: { key: "homepage", icon: "🌐", label: "Home" },
    notes: { key: "notes", icon: "📝", label: "Notes" },
    terminal: { key: "terminal", icon: "⌨️", label: "Terminal" },
    projects: { key: "projects", icon: "🧩", label: "Projects" },
    chat: { key: "chat", icon: "💬", label: "Chat" },
    settings: { key: "settings", icon: "⚙️", label: "Settings" },
    history: { key: "history", icon: "🕒", label: "History" },
    store: { key: "store", icon: "🛍️", label: "Store" },
    sessionsave: { key: "sessionsave", icon: "💾", label: "Session Save" }
  };
  return builtins[key] || { key, icon: "📦", label: key };
}

function getSleepSession() {
  try {
    const data = JSON.parse(localStorage.getItem(SLEEP_SESSION_KEY) || "null");
    if (data && Array.isArray(data.tabs) && data.tabs.length) return data;
  } catch (_) {}
  return null;
}

function saveSleepSession(tabs, cur) {
  try {
    const slim = (tabs || []).map(t => ({
      title: t.title,
      icon: t.icon,
      type: t.type,
      data: t.data,
      sandboxPerms: t.sandboxPerms,
      history: t.history,
      historyIndex: t.historyIndex
    }));
    localStorage.setItem(
      SLEEP_SESSION_KEY,
      JSON.stringify({ tabs: slim, cur: cur || 0, at: Date.now() })
    );
    return true;
  } catch (_) {
    return false;
  }
}

function clearSleepSession() {
  try {
    localStorage.removeItem(SLEEP_SESSION_KEY);
  } catch (_) {}
}

function getLauncherQuickLook(appKey) {
  const key = String(appKey || "").toLowerCase();
  if (key === "notes") {
    let text = "";
    try {
      text = localStorage.getItem("notes") || "";
    } catch (_) {}
    return {
      title: "Notes preview",
      body: text.trim() ? text.slice(0, 600) : "(empty notes)"
    };
  }
  if (key === "projects" || key.endsWith(".os")) {
    try {
      const list =
        typeof UserProjects !== "undefined" && UserProjects.get
          ? UserProjects.get()
          : [];
      if (key === "projects") {
        if (!list.length) return { title: "Projects", body: "No projects yet." };
        return {
          title: "Projects (" + list.length + ")",
          body: list
            .slice(0, 8)
            .map(p => (p.icon || "📦") + " " + (p.title || p.slug))
            .join("\n")
        };
      }
      const slug = key.replace(/\.os$/i, "");
      const p = list.find(x => x.slug === slug || x.slug === key);
      if (p) {
        return {
          title: (p.icon || "📦") + " " + (p.title || p.slug),
          body: (p.html || p.js || p.css || "(no code yet)").toString().slice(0, 500)
        };
      }
    } catch (_) {}
  }
  if (key === "history") {
    try {
      const h = JSON.parse(localStorage.getItem("browserOS_history") || "[]");
      if (!Array.isArray(h) || !h.length) return { title: "History", body: "No visits yet." };
      return {
        title: "Recent history",
        body: h
          .slice(0, 8)
          .map(x => (x.title || x.url || "").toString().slice(0, 40))
          .join("\n")
      };
    } catch (_) {}
  }
  return {
    title: resolveDockAppMeta(key).label || key,
    body: "Press Enter to open · Space toggles preview"
  };
}


/* ─── OS VERSION / SHELL HELPERS ─── */
function getBrowserOSAppCatalog() {
  const pinned = typeof homePinnedApps !== "undefined" ? homePinnedApps : [];
  const more = typeof homeMoreApps !== "undefined" ? homeMoreApps : [];
  const map = {};
  [...pinned, ...more].forEach(a => {
    if (a && a.key) map[a.key] = a;
  });
  // ensure settings always present
  if (!map.settings) map.settings = { key: "settings", icon: "⚙️", label: "Settings" };
  if (!map.homepage) map.homepage = { key: "homepage", icon: "🌐", label: "Home" };
  return Object.values(map);
}

function OsStatusBar() {
  const [online, setOnline] = useState(
    typeof navigator !== "undefined" ? navigator.onLine !== false : true
  );
  const [email, setEmail] = useState("");
  useEffect(() => {
    const on = () => setOnline(true);
    const off = () => setOnline(false);
    window.addEventListener("online", on);
    window.addEventListener("offline", off);
    try {
      const p = window.__browserOSProfile;
      if (p && p.email) setEmail(String(p.email));
    } catch (_) {}
    return () => {
      window.removeEventListener("online", on);
      window.removeEventListener("offline", off);
    };
  }, []);
  const ver =
    typeof BROWSEROS_VERSION !== "undefined" ? BROWSEROS_VERSION : "dev";
  return (
    <div className="os-status-bar">
      <span className={"os-status-pill " + (online ? "online" : "offline")}>
        <span className="dot" />
        {online ? "Online" : "Offline · local mode"}
      </span>
      <span className="os-status-pill" title="Distribution build">
        v{ver}
      </span>
      {email ? (
        <span className="os-status-pill" style={{ maxWidth: 180, overflow: "hidden", textOverflow: "ellipsis" }}>
          {email}
        </span>
      ) : (
        <span className="os-status-pill">Local shell</span>
      )}
      <span style={{ marginLeft: "auto", opacity: 0.75 }}>
        ⌘⇧K / Ctrl+Shift+K launcher
      </span>
    </div>
  );
}

function OsAppLauncher({ open, onClose, onLaunch, onPin, dockPins }) {
  const [q, setQ] = useState("");
  const [idx, setIdx] = useState(0);
  const [preview, setPreview] = useState(null);
  const inputRef = useRef(null);
  const apps = getBrowserOSAppCatalog().filter(a => a.key !== "homepage");
  const filtered = apps.filter(a => {
    const s = (a.label + " " + a.key).toLowerCase();
    return !q || s.includes(q.toLowerCase());
  });
  const pins = dockPins || [];

  useEffect(() => {
    if (open) {
      setQ("");
      setIdx(0);
      setPreview(null);
      setTimeout(() => inputRef.current && inputRef.current.focus(), 30);
    }
  }, [open]);
  useEffect(() => {
    setIdx(0);
  }, [q]);

  if (!open) return null;

  const selected = filtered[idx];
  const launch = key => {
    onLaunch(key);
    onClose();
  };
  const showPreviewFor = app => {
    if (!app) {
      setPreview(null);
      return;
    }
    setPreview(getLauncherQuickLook(app.key));
  };

  return (
    <div className="os-launcher-backdrop" onClick={onClose}>
      <div className="os-launcher" onClick={e => e.stopPropagation()}>
        <input
          ref={inputRef}
          className="os-launcher-input"
          placeholder="Search apps…"
          value={q}
          onChange={e => setQ(e.target.value)}
          onKeyDown={e => {
            if (e.key === "Escape") {
              if (preview) {
                setPreview(null);
                return;
              }
              onClose();
              return;
            }
            if (e.key === "ArrowDown") {
              e.preventDefault();
              setIdx(i => Math.min(filtered.length - 1, i + 1));
              return;
            }
            if (e.key === "ArrowUp") {
              e.preventDefault();
              setIdx(i => Math.max(0, i - 1));
              return;
            }
            if (e.key === " " && selected) {
              e.preventDefault();
              if (preview) setPreview(null);
              else showPreviewFor(selected);
              return;
            }
            if (e.key === "Enter" && selected) {
              e.preventDefault();
              launch(selected.key);
            }
          }}
        />
        <div className="os-launcher-body">
          <div className="os-launcher-list">
            {filtered.length === 0 && (
              <div style={{ padding: 16, color: "var(--text-muted)", fontSize: 13 }}>
                No apps match.
              </div>
            )}
            {filtered.map((a, i) => (
              <button
                key={a.key}
                type="button"
                className={"os-launcher-item" + (i === idx ? " active" : "")}
                onMouseEnter={() => setIdx(i)}
                onClick={() => launch(a.key)}
                onContextMenu={e => {
                  e.preventDefault();
                  if (onPin) onPin(a.key);
                }}
              >
                <span className="ic">{a.icon}</span>
                <span style={{ flex: 1, minWidth: 0 }}>
                  <div className="nm">
                    {a.label}
                    {pins.indexOf(a.key) >= 0 ? " · pinned" : ""}
                  </div>
                  <div className="ds">{a.key}.os</div>
                </span>
              </button>
            ))}
          </div>
          {preview && (
            <div className="os-launcher-preview">
              <div style={{ fontWeight: 700, color: "var(--text)", marginBottom: 8 }}>
                {preview.title}
              </div>
              <pre>{preview.body}</pre>
            </div>
          )}
        </div>
        <div className="os-launcher-hint">
          Enter open · Space Quick Look · Right-click pin/unpin · Esc close
        </div>
      </div>
    </div>
  );
}

function OsDock({ openApp, currentAppKey, onOpenLauncher, onHide, pins, onPinsChange }) {
  const [trayOpen, setTrayOpen] = useState(false);
  const [ctx, setCtx] = useState(null); // {x,y,key}
  const [tick, setTick] = useState(0);
  const dockPins = pins && pins.length ? pins : loadDockPins();

  useEffect(() => {
    const id = setInterval(() => setTick(t => t + 1), 4000);
    return () => clearInterval(id);
  }, []);

  useEffect(() => {
    if (!ctx) return;
    const close = () => setCtx(null);
    const t = setTimeout(() => window.addEventListener("click", close), 0);
    return () => {
      clearTimeout(t);
      window.removeEventListener("click", close);
    };
  }, [ctx]);

  const online = typeof navigator !== "undefined" ? navigator.onLine !== false : true;
  let email = "";
  let pro = false;
  let unread = 0;
  try {
    const p = window.__browserOSProfile;
    if (p && p.email) email = String(p.email);
    if (typeof hasProAccess === "function") pro = !!hasProAccess(p);
  } catch (_) {}
  try {
    unread = Number(window.__browserOSUnreadCount || 0) || 0;
  } catch (_) {}

  const metaFor = key => resolveDockAppMeta(key);

  const togglePin = key => {
    if (key === "homepage") return;
    let next = dockPins.slice();
    const i = next.indexOf(key);
    if (i >= 0) next.splice(i, 1);
    else next.push(key);
    if (!next.length) next = ["homepage"];
    if (next.indexOf("homepage") < 0) next.unshift("homepage");
    next = next.slice(0, 12);
    saveDockPins(next);
    if (onPinsChange) onPinsChange(next);
    setCtx(null);
  };

  return (
    <>
      {trayOpen && (
        <div className="os-tray-panel" onClick={e => e.stopPropagation()}>
          <div style={{ fontWeight: 800, fontSize: 13, marginBottom: 6 }}>System</div>
          <div className="os-tray-row">
            <span className="ti">{online ? "🟢" : "🟠"}</span>
            <div className="tb">
              <div className="tt">{online ? "Online" : "Offline · local mode"}</div>
              <div className="td">
                {online
                  ? "Network available for Chat & account features"
                  : "Local apps still work"}
              </div>
            </div>
          </div>
          <div className="os-tray-row">
            <span className="ti">👤</span>
            <div className="tb">
              <div className="tt">{email ? "Signed in" : "Local shell"}</div>
              <div className="td">{email || "No account session on this open"}</div>
            </div>
          </div>
          <div className="os-tray-row">
            <span className="ti">{pro ? "🚀" : "🆓"}</span>
            <div className="tb">
              <div className="tt">{pro ? "Nitro / Pro access" : "Free tier"}</div>
              <div className="td">
                {pro
                  ? "Chat & Session Save unlocked"
                  : "Chat & cloud session need Nitro"}
              </div>
            </div>
          </div>
          <div className="os-tray-row">
            <span className="ti">🔔</span>
            <div className="tb">
              <div className="tt">
                {unread > 0 ? unread + " unread" : "No unread alerts"}
              </div>
              <div className="td">Chat pings appear here when signed in</div>
            </div>
          </div>
          <div style={{ fontSize: 11, color: "var(--text-muted)", marginTop: 8 }}>
            Right-click dock icons to pin/unpin · Ctrl+/ shortcuts
          </div>
        </div>
      )}
      <div className="os-dock" role="toolbar" aria-label="BrowserOS dock">
        <button
          type="button"
          className="os-dock-btn"
          title="App launcher (Ctrl+Shift+K)"
          onClick={onOpenLauncher}
        >
          🔍
        </button>
        <button
          type="button"
          className={"os-dock-btn" + (trayOpen ? " tray-active" : "")}
          title="System tray"
          onClick={() => setTrayOpen(v => !v)}
        >
          {unread > 0 ? "🔔" : "📟"}
        </button>
        <div className="os-dock-sep" />
        {dockPins.map(key => {
          const a = metaFor(key);
          return (
            <button
              key={key}
              type="button"
              className={
                "os-dock-btn" + (currentAppKey === key ? " active" : "")
              }
              title={a.label + " (right-click to pin/unpin)"}
              onClick={() => openApp && openApp(key)}
              onContextMenu={e => {
                e.preventDefault();
                setCtx({ x: e.clientX, y: e.clientY, key });
              }}
            >
              {a.icon}
            </button>
          );
        })}
        <div className="os-dock-sep" />
        <button
          type="button"
          className="os-dock-btn"
          title="Hide dock (Ctrl+Shift+D)"
          onClick={onHide}
        >
          ▾
        </button>
      </div>
      {ctx && (
        <div
          className="os-dock-ctx"
          style={{ left: Math.min(ctx.x, window.innerWidth - 180), top: Math.max(8, ctx.y - 90) }}
          onClick={e => e.stopPropagation()}
        >
          <button type="button" onClick={() => { openApp && openApp(ctx.key); setCtx(null); }}>
            Open
          </button>
          {ctx.key !== "homepage" && (
            <button type="button" onClick={() => togglePin(ctx.key)}>
              {dockPins.indexOf(ctx.key) >= 0 ? "Unpin from dock" : "Pin to dock"}
            </button>
          )}
        </div>
      )}
    </>
  );
}

function Terminal({ openSite }) {
  const [input, setInput] = useState("");
  const [log, setLog] = useState([]);

  const engine = useRef(null);

  useEffect(() => {
    engine.current = createTerminalRuntime({
      openSite,
      setOutput: setLog
    });
  }, []);

    const run = () => {
    
      if (!engine.current || !input.trim()) {
        return;
      }
    
      /* ── CLEAR TERMINAL ── */
      if (input.trim() === "clear") {
        setLog([]);
        setInput("");
        return;
      }
    
        Promise.resolve(
          engine.current.parse(input)
        ).then(result => {
        
          if (result !== undefined) {
            setLog(l => [
              ...l,
              "> " + input,
              String(result)
            ]);
          }
        
        });
        
        setInput("");
    };

  return (
    <div className="terminal-wrap">

      <div className="terminal-log">
        {log.map((line, i) => (
          <div key={i} className="terminal-line">
            {line}
          </div>
        ))}
      </div>

      <input
        className="terminal-input"
        value={input}
        onChange={e => setInput(e.target.value)}
        onKeyDown={e => e.key === "Enter" && run()}
        placeholder="ostools --help"
      />

    </div>
  );
}

        // ship portal

          h: 120,

        { x: 3350, y: 260, w: 25, h: 40, type: "deadly" },

        { x: 3650, y: 260, w: 25, h: 40, type: "deadly" },

        {
          x: 4000,
          y: 150,
          w: 30,
          h: 150,
          type: "finish"
        }

      ]

    };

    let obstacles = [];

    /* ─────────────────────────────
       COLLISION
    ───────────────────────────── */

    function collision(a, b) {

      return (
        a.x < b.x + b.w &&
        a.x + a.w > b.x &&
        a.y < b.y + b.h &&
        a.y + a.h > b.y
      );

    }

    /* ─────────────────────────────
       RESET LEVEL
    ───────────────────────────── */

    function resetLevel() {

      cancelAnimationFrame(animationId);

      obstacles = levels[mode].map(o => ({ ...o }));

      player.x = 120;
      player.y = 260;
      player.velY = 0;
      player.jumping = false;
      player.mode = "cube";

      setScore(0);
      setStatus("");

      running = true;

      loop();

    }

    /* ─────────────────────────────
       JUMP / SHIP CONTROLS
    ───────────────────────────── */

    function jump() {

      if (!running) return;

      // cube jump
      if (player.mode === "cube") {

        if (!player.jumping) {

          player.velY = jumpPower;
          player.jumping = true;

        }

      }

      // ship fly
      else {

        player.velY -= 1.4;

      }

    }

    /* ─────────────────────────────
       MAIN LOOP
    ───────────────────────────── */

    function loop() {

      if (!running) return;

      // background
      ctx.fillStyle = "#111";
      ctx.fillRect(0, 0, 900, 320);

      // ground
      ctx.fillStyle = "#333";
      ctx.fillRect(0, 280, 900, 40);

      /* ─────────────────────────────
         PLAYER PHYSICS
      ───────────────────────────── */

      if (player.mode === "cube") {

        player.velY += gravity;

      } else {

        // ship gravity weaker
        player.velY += 0.25;

      }

      player.y += player.velY;

      // floor collision (cube only)
      if (player.mode === "cube") {

        if (player.y >= 256) {

          player.y = 256;
          player.velY = 0;
          player.jumping = false;

        }

      }

      // ceiling collision for ship
      if (player.y < 0) {

        player.y = 0;
        player.velY = 0;

      }

      // bottom collision in ship mode
      if (player.mode === "ship" && player.y > 290) {

        running = false;
        setStatus("Ship Crashed!");

      }

      /* ─────────────────────────────
         DRAW PLAYER
      ───────────────────────────── */

      if (player.mode === "cube") {

        ctx.fillStyle = "#00ff88";
        ctx.fillRect(player.x, player.y, player.w, player.h);

      } else {

        // triangle ship
        ctx.fillStyle = "#00ffff";

        ctx.beginPath();
        ctx.moveTo(player.x, player.y + 12);
        ctx.lineTo(player.x + 24, player.y);
        ctx.lineTo(player.x + 24, player.y + 24);
        ctx.closePath();
        ctx.fill();

      }

      /* ─────────────────────────────
         OBJECTS
      ───────────────────────────── */

      for (let o of obstacles) {

        o.x -= 4;

        // colors
        if (o.type === "deadly") ctx.fillStyle = "#ff4444";
        if (o.type === "safe") ctx.fillStyle = "#4488ff";
        if (o.type === "jumpPad") ctx.fillStyle = "#ffee00";
        if (o.type === "coin") ctx.fillStyle = "#ffd700";
        if (o.type === "finish") ctx.fillStyle = "#00ff88";
        if (o.type === "shipPortal") ctx.fillStyle = "#ff00ff";
        if (o.type === "cubePortal") ctx.fillStyle = "#00aaff";

        // draw object
        if (!(o.type === "coin" && o.collected)) {

          ctx.fillRect(o.x, o.y, o.w, o.h);

        }

        /* ─────────────────────────────
           DEADLY OBJECTS
        ───────────────────────────── */

        if (o.type === "deadly") {

          if (collision(player, o)) {

            running = false;
            setStatus("Game Over");

          }

        }

        /* ─────────────────────────────
           SAFE PLATFORMS
        ───────────────────────────── */

        if (o.type === "safe" && player.mode === "cube") {

          const touchingTop =
            player.y + player.h <= o.y + 10 &&
            player.y + player.h + player.velY >= o.y &&
            player.x + player.w > o.x &&
            player.x < o.x + o.w;

          if (touchingTop) {

            player.y = o.y - player.h;
            player.velY = 0;
            player.jumping = false;

          }

        }

        /* ─────────────────────────────
           JUMP PAD
        ───────────────────────────── */

        if (o.type === "jumpPad") {

          if (collision(player, o)) {

            player.velY = -16;
            player.jumping = true;

          }

        }

        /* ─────────────────────────────
           COINS
        ───────────────────────────── */

        if (o.type === "coin" && !o.collected) {

          if (collision(player, o)) {

            o.collected = true;
            setScore(s => s + 10);

          }

        }

        /* ─────────────────────────────
           SHIP PORTAL
        ───────────────────────────── */

        if (o.type === "shipPortal") {

          if (collision(player, o)) {

            player.mode = "ship";

          }

        }

        /* ─────────────────────────────
           CUBE PORTAL
        ───────────────────────────── */

        if (o.type === "cubePortal") {

          if (collision(player, o)) {

            player.mode = "cube";

          }

        }

        /* ─────────────────────────────
           FINISH
        ───────────────────────────── */

        if (o.type === "finish") {

          if (collision(player, o)) {

            running = false;
            setStatus("LEVEL COMPLETE!");

          }

        }

      }

      animationId = requestAnimationFrame(loop);

    }

    /* ─────────────────────────────
       CONTROLS
    ───────────────────────────── */

    function handleKey(e) {

      if (e.code === "Space") jump();

      if (e.code === "KeyR") resetLevel();

      if (e.code === "Escape") {

        running = false;
        setMode("menu");

      }

    }

    window.addEventListener("keydown", handleKey);

    resetLevel();

    return () => {

      running = false;

      cancelAnimationFrame(animationId);

      window.removeEventListener("keydown", handleKey);

    };

  }, [mode]);

  /* ─────────────────────────────
     MENU
  ───────────────────────────── */

  if (mode === "menu") {

    return (

      <div style={{
        color: "#fff",
        fontFamily: "monospace",
        padding: "20px"
      }}>

        <h2>Geometry Dash</h2>

        <p>Select a level:</p>

        <button onClick={() => setMode("level1")}>
          ▶ Stereo Madness Style
        </button>

        <br /><br />

        <button onClick={() => setMode("level2")}>
          🔥 Hard Mode
        </button>

        <p style={{
          opacity: 0.7,
          marginTop: "15px"
        }}>
          Space = Jump / Fly | R = Restart | ESC = Menu
        </p>

      </div>

    );

  }

  /* ─────────────────────────────
     GAME SCREEN
  ───────────────────────────── */

  return (

    <div style={{
      color: "#fff",
      fontFamily: "monospace"
    }}>

      <p>
        Score: {score} | Level: {mode}
      </p>

      <p style={{
        color:
          status === "LEVEL COMPLETE!"
            ? "#00ff88"
            : "#ff4444"
      }}>
        {status}
      </p>

      <canvas
        ref={canvasRef}
        style={{
          border: "1px solid #444",
          background: "#000"
        }}
      />

    </div>

  );

}

function ParticleCanvas({ particles }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        let animationFrameId;

        let activeParticles = particles.map(p => ({
          ...p,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          alpha: 1,
          size: Math.random() * 4 + 2
        }));

        const render = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          activeParticles.forEach((p) => {
            p.x += p.vx;
            p.y += p.vy;
            p.alpha -= 0.03;

            if (p.alpha > 0) {
              ctx.save();
              ctx.globalAlpha = p.alpha;
              ctx.fillStyle = p.color;
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
            }
          });

          activeParticles = activeParticles.filter(p => p.alpha > 0);

          if (activeParticles.length > 0) {

function Game2048() {
      const SIZE = 4;
      const [board, setBoard] = useState([]);
      const [score, setScore] = useState(0);
      const [gameOver, setGameOver] = useState(false);
      
      // Tracking metadata for animations
      const [newTileCoord, setNewTileCoord] = useState(null);
      const [particles, setParticles] = useState([]);

      const tileColors = {
        0: "#111827",
        2: "#1e293b",
        4: "#334155",
        8: "#2563eb",
        16: "#7c3aed",
        32: "#9333ea",
        64: "#c026d3",
        128: "#db2777",
        256: "#e11d48",
        512: "#ea580c",
        1024: "#d97706",
        2048: "#16a34a",
        4096: "#0d9488",
        8192: "#06b6d4",
        16384: "#4f46e5",
        32768: "#e11d48",
        65536: "#f8fafc",
        131072: "#030712"
      };

      const createEmptyBoard = () => Array(SIZE).fill(null).map(() => Array(SIZE).fill(0));
      const clone = (grid) => grid.map(r => [...r]);
      const reverse = (grid) => grid.map(r => [...r].reverse());
      const transpose = (grid) => {
        const next = createEmptyBoard();
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            next[c][r] = grid[r][c];
          }
        }
        return next;
      };

      const addRandomTile = (grid) => {
        const empty = [];
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            if (grid[r][c] === 0) empty.push({ r, c });
          }
        }

        if (empty.length === 0) return { grid, newCoord: null };

        const spot = empty[Math.floor(Math.random() * empty.length)];
        const val = Math.random() > 0.1 ? 2 : 4;
        grid[spot.r][spot.c] = val;
        return { grid, newCoord: spot };
      };

      const triggerParticles = (r, c, color) => {
        // Calculate center position inside the board container
        const tileOffset = 10; // Padding
        const tileSize = 70;
        const gap = 8;

        const x = tileOffset + c * (tileSize + gap) + tileSize / 2;
        const y = tileOffset + r * (tileSize + gap) + tileSize / 2;

        const newParticles = Array.from({ length: 16 }).map(() => ({
          x,
          y,
          color
        }));

        setParticles(prev => [...prev, ...newParticles]);
      };

      const startGame = () => {
        let b = createEmptyBoard();
        let res1 = addRandomTile(b);
        let res2 = addRandomTile(res1.grid);

        setBoard(res2.grid);
        setNewTileCoord(res2.newCoord);
        setScore(0);
        setGameOver(false);
        setParticles([]);
      };

      const slideRow = (row, rowIndex, isTransposed, isReversed) => {
        let arr = row.filter(v => v !== 0);
        let gained = 0;
        let mergedPositions = [];

        for (let i = 0; i < arr.length - 1; i++) {
          if (arr[i] === arr[i + 1]) {
            arr[i] *= 2;
            gained += arr[i];
            arr[i + 1] = 0;
            mergedPositions.push({ colIndex: i, value: arr[i] });
          }
        }

        arr = arr.filter(v => v !== 0);
        while (arr.length < SIZE) arr.push(0);

        return { row: arr, score: gained, mergedPositions };
      };

      const canMove = (grid) => {
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            if (grid[r][c] === 0) return true;
          }
        }
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE - 1; c++) {
            if (grid[r][c] === grid[r][c + 1]) return true;
          }
        }
        for (let r = 0; r < SIZE - 1; r++) {
          for (let c = 0; c < SIZE; c++) {
            if (grid[r][c] === grid[r + 1][c]) return true;
          }
        }
        return false;
      };

      const move = (dir) => {
        if (gameOver) return;

        let working = clone(board);
        let isReversed = false;
        let isTransposed = false;

        if (dir === "right") {
          working = reverse(working);
          isReversed = true;
        } else if (dir === "up") {
          working = transpose(working);
          isTransposed = true;
        } else if (dir === "down") {
          working = transpose(working);
          working = reverse(working);
          isTransposed = true;
          isReversed = true;
        }

          const res = slideRow(working[r]);

              mergesToAnimate.push({ r, c: m.colIndex, value: m.value });

        }

        /* REVERSE TRANSFORM */
        if (dir === "right") {
          working = reverse(working);
        } else if (dir === "up") {
          working = transpose(working);
        } else if (dir === "down") {
          working = reverse(working);
          working = transpose(working);
        }

        const changed = JSON.stringify(working) !== JSON.stringify(board);

        if (changed) {
          const spawnResult = addRandomTile(working);
          setBoard(spawnResult.grid);
          setNewTileCoord(spawnResult.newCoord);
          setScore(s => s + pointsGained);

          mergesToAnimate.forEach(m => {

          if (!canMove(spawnResult.grid)) {
            setGameOver(true);
          }
        }
      };

      useEffect(() => {
        const handleKey = (e) => {
          if (e.key === "ArrowLeft") move("left");
          else if (e.key === "ArrowRight") move("right");
          else if (e.key === "ArrowUp") move("up");
          else if (e.key === "ArrowDown") move("down");
        };

        window.addEventListener("keydown", handleKey);
        return () => window.removeEventListener("keydown", handleKey);
      }, [board, gameOver]);

      useEffect(() => {
        startGame();
      }, []);

      return (
          <div className="game2048-page">
          <h2>2048.os Visuals</h2>

          <div style={{ margin: "10px 0", fontSize: "18px" }}>
            Score: <b>{score}</b>
          </div>

          <button
            onClick={startGame}
            style={{
              padding: "8px 14px",
              borderRadius: "8px",
              border: "1px solid rgba(255,255,255,0.1)",
              background: "rgba(255,255,255,0.05)",
              color: "#fff",
              cursor: "pointer",
              marginBottom: "16px",
              fontFamily: "'Syne', sans-serif"
            }}
          >
            Restart
          </button>

          {/* BOARD */}
          <div
            style={{
              position: "relative",
              display: "grid",
              gridTemplateColumns: "repeat(4, 70px)",
              gridTemplateRows: "repeat(4, 70px)",
              gap: "8px",
              background: "#030712",
              padding: "10px",
              borderRadius: "12px",
              border: "1px solid rgba(255,255,255,0.1)"
            }}
          >
            <ParticleCanvas particles={particles} />

            {board.map((row, r) =>
              row.map((val, c) => {
                const isNew = newTileCoord && newTileCoord.r === r && newTileCoord.c === c;
                const color = tileColors[val] || "#16a34a";
                const isGlowing = val >= 2048;

                return (
                  <div

                    className={`${isNew ? "tile-pop" : ""} ${isGlowing ? "tile-glow" : ""}`}

                      width: "70px",
                      height: "70px",
                      borderRadius: "8px",
                      background: color,

            <div style={{ marginTop: "16px", color: "#f87171", fontWeight: "bold" }}>
              Game Over!
            </div>
          )}
        </div>
      );
    }

/* ─── FLAPPY.OS ─── */
function FlappyBird() {

  /* ─────────────────────────────
     🧠 GAME CONSTANTS
  ───────────────────────────── */

  const WIDTH = 400;
  const HEIGHT = 600;

  const GRAVITY = 0.35;
  const JUMP = -7;

  const PIPE_WIDTH = 70;
  const PIPE_GAP = 170;
  const PIPE_SPEED = 2.5;

  /* ─────────────────────────────
     🧠 STATE
  ───────────────────────────── */

  const [birdY, setBirdY] = useState(250);
  const [velocity, setVelocity] = useState(0);

  const [pipes, setPipes] = useState([]);

  const [score, setScore] = useState(0);

  const [started, setStarted] = useState(false);
  const [gameOver, setGameOver] = useState(false);

  /* ─────────────────────────────
     🐤 RESET GAME
  ───────────────────────────── */

  const resetGame = () => {

    setBirdY(250);
    setVelocity(0);

    setScore(0);

    setStarted(false);
    setGameOver(false);

    setPipes([
      createPipe(500),
      createPipe(750)
    ]);
  };

  /* ─────────────────────────────
     🧱 CREATE PIPE
  ───────────────────────────── */

  const createPipe = (x) => {

    const topHeight =
      80 + Math.random() * 250;

    return {
      x,
      topHeight,
      passed: false
    };
  };

  /* ─────────────────────────────
     🚀 START
  ───────────────────────────── */

  useEffect(() => {
    resetGame();
  }, []);

  /* ─────────────────────────────
     🐤 FLAP
  ───────────────────────────── */

  const flap = () => {

    if (gameOver) {
      resetGame();
      return;
    }

    if (!started) {
      setStarted(true);
    }

    setVelocity(JUMP);
  };

  /* ─────────────────────────────
     🎹 CONTROLS
  ───────────────────────────── */

  useEffect(() => {

    const handleKey = (e) => {

      if (e.code === "Space") {
        flap();
      }
    };

    window.addEventListener("keydown", handleKey);

    return () =>
      window.removeEventListener("keydown", handleKey);

  });

  /* ─────────────────────────────
     🎮 MAIN GAME LOOP
  ───────────────────────────── */

  useEffect(() => {

    if (!started || gameOver) return;

    const loop = setInterval(() => {

      /* 🐤 PHYSICS */

      setVelocity(v => v + GRAVITY);

      setBirdY(y => y + velocity);

      /* 🧱 MOVE PIPES */

      setPipes(prev => {

        let updated = prev.map(pipe => {

          const nextX = pipe.x - PIPE_SPEED;

          /* SCORE */

          if (
            !pipe.passed &&
            nextX + PIPE_WIDTH < 80
          ) {

            pipe.passed = true;

            setScore(s => s + 1);
          }

          return {
            ...pipe,
            x: nextX
          };
        });

        /* ♻ RECYCLE PIPES */

        updated = updated.map(pipe => {

          if (pipe.x < -PIPE_WIDTH) {

            const furthest =
              Math.max(...updated.map(p => p.x));

            return createPipe(furthest + 250);
          }

          return pipe;
        });

        return updated;
      });

    }, 1000 / 60);

    return () => clearInterval(loop);

  }, [started, gameOver, velocity]);

  /* ─────────────────────────────
     💥 COLLISION DETECTION
  ───────────────────────────── */

  useEffect(() => {

    // floor / ceiling
    if (birdY < 0 || birdY > HEIGHT - 40) {
      setGameOver(true);
    }

    // pipes
    pipes.forEach(pipe => {

      const birdLeft = 80;
      const birdRight = 120;

      const pipeLeft = pipe.x;
      const pipeRight = pipe.x + PIPE_WIDTH;

      const hitPipe =
        birdRight > pipeLeft &&
        birdLeft < pipeRight;

      const hitTop =
        birdY < pipe.topHeight;

      const hitBottom =
        birdY > pipe.topHeight + PIPE_GAP;

      if (
        hitPipe &&
        (hitTop || hitBottom)
      ) {
        setGameOver(true);
      }

    });

  }, [birdY, pipes]);

  /* ─────────────────────────────
     🖥 RENDER
  ───────────────────────────── */

  return (

    <div
      onClick={flap}

      style={{
        width: WIDTH,
        height: HEIGHT,

        position: "relative",
        overflow: "hidden",

        background:
          "linear-gradient(#38bdf8, #0ea5e9)",

        borderRadius: 16,

        userSelect: "none",
        cursor: "pointer"
      }}
    >

      {/* SCORE */}
      <div
        style={{
          position: "absolute",
          top: 20,
          left: 20,

          color: "white",
          fontSize: 32,
          fontWeight: "bold",

          zIndex: 10
        }}
      >
        {score}
      </div>

      {/* START MESSAGE */}
      {!started && !gameOver && (

        <div
          style={{
            position: "absolute",
            width: "100%",
            top: 120,

            textAlign: "center",

            color: "white",
            fontSize: 28,
            fontWeight: "bold",

            zIndex: 10
          }}
        >
          Click or Press Space
        </div>

      )}

      {/* GAME OVER */}
      {gameOver && (

        <div
          style={{
            position: "absolute",
            width: "100%",
            top: 120,

            textAlign: "center",

            color: "white",
            fontSize: 32,
            fontWeight: "bold",

            zIndex: 10
          }}
        >
          Game Over
          <div
            style={{
              fontSize: 18,
              marginTop: 10
            }}
          >
            Click to Restart
          </div>
        </div>

      )}

      {/* PIPES */}
      {pipes.map((pipe, i) => (

        <React.Fragment key={i}>

          {/* TOP PIPE */}
          <div
            style={{
              position: "absolute",

              left: pipe.x,
              top: 0,

              width: PIPE_WIDTH,
              height: pipe.topHeight,

              background: "#22c55e",
              border: "3px solid #15803d"
            }}
          />

          {/* BOTTOM PIPE */}
          <div
            style={{
              position: "absolute",

              left: pipe.x,
              top: pipe.topHeight + PIPE_GAP,

              width: PIPE_WIDTH,
              height:
                HEIGHT -
                pipe.topHeight -
                PIPE_GAP,

              background: "#22c55e",
              border: "3px solid #15803d"
            }}
          />

        </React.Fragment>

      ))}

      {/* BIRD */}
      <div
        style={{
          position: "absolute",

          left: 80,
          top: birdY,

          width: 40,
          height: 40,

          borderRadius: "50%",

          background: "#facc15",

          display: "flex",
          justifyContent: "center",
          alignItems: "center",

          fontSize: 24,

          transform:
            `rotate(${Math.min(velocity * 4, 45)}deg)`,

          transition: "transform 0.05s linear"
        }}
      >
        🐤
      </div>

      {/* FLOOR */}
      <div
        style={{
          position: "absolute",
          bottom: 0,

          width: "100%",
          height: 40,

          background: "#65a30d"
        }}
      />

    </div>
  );
}

/* ─── SNAKE.OS ─── */
function SnakeGame() {

  /* ─────────────────────────────
     🧠 GAME CONSTANTS
  ───────────────────────────── */

  const GRID_SIZE = 20;
  const CELL = 20;

  const START_SNAKE = [
    [10, 10],
    [9, 10],
    [8, 10]
  ];

  const START_FOOD = [15, 10];

  /* ─────────────────────────────
     🧠 STATE
  ───────────────────────────── */

  const [snake, setSnake] = useState(START_SNAKE);

  const [food, setFood] = useState(START_FOOD);

  const [dir, setDir] = useState([1, 0]);
  // [x, y]

  const [running, setRunning] = useState(false);

  const [gameOver, setGameOver] = useState(false);

  const [score, setScore] = useState(0);

  /* ─────────────────────────────
     🍎 RANDOM FOOD
  ───────────────────────────── */

  const randomFood = (snakeBody) => {

    while (true) {

      const x =
        Math.floor(Math.random() * GRID_SIZE);

      const y =
        Math.floor(Math.random() * GRID_SIZE);

      const onSnake =
        snakeBody.some(
          ([sx, sy]) => sx === x && sy === y
        );

      if (!onSnake) {
        return [x, y];
      }
    }
  };

  /* ─────────────────────────────
     🚀 RESET GAME
  ───────────────────────────── */

  const resetGame = () => {

    setSnake(START_SNAKE);

    setFood(randomFood(START_SNAKE));

    setDir([1, 0]);

    setRunning(false);
    setGameOver(false);

    setScore(0);
  };

  /* ─────────────────────────────
     🎮 INITIALIZE
  ───────────────────────────── */

  useEffect(() => {
    resetGame();
  }, []);

  /* ─────────────────────────────
     🎹 KEYBOARD INPUT
  ───────────────────────────── */

  useEffect(() => {

    const handleKey = (e) => {

      // start game
      if (!running) {
        setRunning(true);
      }

      // prevent reverse movement
      if (e.key === "ArrowUp" && dir[1] !== 1) {
        setDir([0, -1]);
      }

      if (e.key === "ArrowDown" && dir[1] !== -1) {
        setDir([0, 1]);
      }

      if (e.key === "ArrowLeft" && dir[0] !== 1) {
        setDir([-1, 0]);
      }

      if (e.key === "ArrowRight" && dir[0] !== -1) {
        setDir([1, 0]);
      }
    };

    window.addEventListener("keydown", handleKey);

    return () =>
      window.removeEventListener("keydown", handleKey);

  }, [dir, running]);

  /* ─────────────────────────────
     🐍 MAIN GAME LOOP
  ───────────────────────────── */

  useEffect(() => {

    if (!running || gameOver) return;

    const loop = setInterval(() => {

      setSnake(prev => {

        const head = prev[0];

        const newHead = [
          head[0] + dir[0],
          head[1] + dir[1]
        ];

        /* 💥 WALL COLLISION */

        if (
          newHead[0] < 0 ||
          newHead[1] < 0 ||
          newHead[0] >= GRID_SIZE ||
          newHead[1] >= GRID_SIZE
        ) {

          setGameOver(true);
          setRunning(false);

          return prev;
        }

        /* 💥 SELF COLLISION */

        const hitSelf =
          prev.some(
            ([x, y]) =>
              x === newHead[0] &&
              y === newHead[1]
          );

        if (hitSelf) {

          setGameOver(true);
          setRunning(false);

          return prev;
        }

        /* 🐍 MOVE */

        const nextSnake = [
          newHead,
          ...prev
        ];

        /* 🍎 FOOD */

        if (
          newHead[0] === food[0] &&
          newHead[1] === food[1]
        ) {

          setScore(s => s + 1);

          setFood(randomFood(nextSnake));

          // grow snake
          return nextSnake;
        }

        // normal movement
        nextSnake.pop();

        return nextSnake;

      });

    }, 100);

    return () => clearInterval(loop);

  }, [dir, running, gameOver, food]);


  return (

    <div
      style={{
        padding: 20,
        color: "white",
        background: "#080c12",
        minHeight: "100%"
      }}
    >

      {/* HEADER */}
      <div
        style={{
          display: "flex",
          justifyContent: "space-between",
          alignItems: "center",
          marginBottom: 20
        }}
      >

        <h2 style={{ margin: 0 }}>
          Snake.os
        </h2>

        <div
          style={{
            padding: "8px 12px",
            borderRadius: 10,

            background:
              "rgba(255,255,255,0.05)",

            border:
              "1px solid rgba(255,255,255,0.08)"
          }}
        >
          Score: {score}
        </div>

      </div>

      {/* GAME BOARD */}
      <div
        style={{
          position: "relative",

          width: GRID_SIZE * CELL,
          height: GRID_SIZE * CELL,

          background: "#111827",

          borderRadius: 16,

          overflow: "hidden",

          border:
            "1px solid rgba(255,255,255,0.08)"
        }}
      >

        {/* GRID */}
        {Array(GRID_SIZE * GRID_SIZE)
          .fill()
          .map((_, i) => (

            <div
              key={i}

              style={{
                position: "absolute",

                left:
                  (i % GRID_SIZE) * CELL,

                top:
                  Math.floor(i / GRID_SIZE) * CELL,

                width: CELL,
                height: CELL,

                border:
                  "1px solid rgba(255,255,255,0.03)"
              }}
            />

        ))}

        {/* FOOD */}
        <div
          style={{
            position: "absolute",

            left: food[0] * CELL,
            top: food[1] * CELL,

            width: CELL,
            height: CELL,

            background: "#ef4444",

            borderRadius: 6
          }}
        />

        {/* SNAKE */}
        {snake.map(([x, y], i) => (

          <div
            key={i}

            style={{
              position: "absolute",

              left: x * CELL,
              top: y * CELL,

              width: CELL,
              height: CELL,

              background:
                i === 0
                  ? "#22c55e"
                  : "#16a34a",

              borderRadius: 6,

              transition: "0.05s linear"
            }}
          />

        ))}

        {/* START MESSAGE */}
        {!running && !gameOver && (

          <div
            style={{
              position: "absolute",

              width: "100%",
              top: "45%",

              textAlign: "center",

              color: "white",
              fontSize: 24,
              fontWeight: "bold"
            }}
          >
            Press Arrow Keys
          </div>

        )}

        {/* GAME OVER */}
        {gameOver && (

          <div
            style={{
              position: "absolute",

              width: "100%",
              top: "40%",

              textAlign: "center",

              color: "white",
              fontSize: 28,
              fontWeight: "bold"
            }}
          >
            Game Over

            <div
              style={{
                marginTop: 10,
                fontSize: 16
              }}
            >
              Score: {score}
            </div>

            <button
              onClick={resetGame}

              style={{
                marginTop: 16,

                padding: "10px 16px",

                borderRadius: 10,

                border: "none",

                background: "#22c55e",
                color: "white",

                cursor: "pointer"
              }}
            >
              Restart
            </button>

          </div>

        )}

      </div>

      {/* FOOTER */}
      <div
        style={{
          marginTop: 16,
          opacity: 0.7,
          fontSize: 13
        }}
      >
        Use arrow keys to move
      </div>

    </div>
  );

function DdgSearch(){
  const [query, setQuery] = useState("");
  const [loading, setLoading] = useState(false);
  const [raw, setRaw] = useState(null);
  const [error, setError] = useState("");

  const search = async () => {
    const q = query.trim();
    if (!q) return;

    setLoading(true);
    setError("");
    setRaw(null);

    try {
      const url =
        "https://api.duckduckgo.com/?" +
        new URLSearchParams({
          q,
          format: "json",
          pretty: "1",
          no_html: "1",
          skip_disambig: "1"
        }).toString();

      const res = await fetch(url);
      if (!res.ok) throw new Error("HTTP " + res.status);

      const data = await res.json();
      setRaw(data);
    } catch (e) {
      setError(e.message || "Search failed");
    } finally {
      setLoading(false);
    }
  };

  const topics = (() => {
    if (!raw?.RelatedTopics) return [];
    return raw.RelatedTopics.flatMap(t => t.Text ? [t] : (t.Topics || []))
      .filter(Boolean)
      .slice(0, 5);
  })();

  return (
    <div style={{padding:20, height:"100%", overflow:"auto"}}>
      <h2 style={{marginBottom:12}}>DuckDuckGo Search</h2>

      <div style={{display:"flex", gap:8, marginBottom:12}}>
        <input
          value={query}
          onChange={e=>setQuery(e.target.value)}
          onKeyDown={e=>e.key==="Enter" && search()}
          placeholder="Search DuckDuckGo..."
            style={{
              flex:1,
              padding:"10px 12px",
              background:"var(--surface2)",
              color:"var(--text)",
              border:"1px solid var(--border)",
              borderRadius:"8px",
              outline:"none",
              fontFamily:"'DM Mono', monospace"
            }}
        />
        <button onClick={search} style={{padding:"10px 14px"}}>Search</button>
      </div>

      {loading && <div>Searching...</div>}
      {error && <div style={{color:"var(--danger)"}}>{error}</div>}

      {raw && (
        <>
          <div style={{marginBottom:16}}>
            <div><strong>Heading:</strong> {raw.Heading || "(none)"}</div>
            <div>
              <strong>Abstract URL:</strong>{" "}
              {raw.AbstractURL ? <a href={raw.AbstractURL} target="_blank" rel="noreferrer">{raw.AbstractURL}</a> : "(none)"}
            </div>
          </div>

          <div style={{marginBottom:16}}>
            <h3 style={{marginBottom:8}}>Top related links</h3>
            {topics.length ? topics.map((t, i) => (
              <div key={i} style={{marginBottom:8}}>
                <div>Result {i + 1}: {t.Text}</div>
                <div style={{fontSize:12, color:"#aaa"}}>
                  {t.FirstURL ? <a href={t.FirstURL} target="_blank" rel="noreferrer">{t.FirstURL}</a> : "(no link)"}
                </div>
              </div>
            )) : <div>No related topics found.</div>}
          </div>

          <details>
            <summary>Raw JSON</summary>
            <pre style={{whiteSpace:"pre-wrap",background:"var(--surface)",padding:"12px",border:"1px solid var(--border)",borderRadius:"10px",color:"var(--text)"}}>
              {JSON.stringify(raw, null, 2)}
            </pre>
          </details>
        </>
      )}
    </div>
  );
}
