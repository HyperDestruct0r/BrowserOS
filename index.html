/** Detect client privilege spoofing vs server gate; report + hard lock. */
window.__browserOSTamperReported = window.__browserOSTamperReported || false;
window.__browserOSIntegrityStrikes = window.__browserOSIntegrityStrikes || 0;
/** Only hard-ban on clear role/tier spoof — never on free-tier unlock quirks. */
window.__browserOSIntegrityAutoBan = false; // soft: report only unless enabled

async function reportClientTamper(reason, detail) {
  if (window.__browserOSTamperReported) return true;
  const client = typeof getSupabaseClient === "function" ? getSupabaseClient() : null;
  if (!client) return false;
  try {
    const { data, error } = await client.rpc("report_client_tamper", {
      p_reason: reason || "client_privilege_spoof",
      p_detail: detail || {}
    });
    if (error) {
      console.warn("tamper report failed", error);
      return false;
    }
    if (data && data.skipped) return false;
    window.__browserOSTamperReported = true;
    try {
      window.dispatchEvent(
        new CustomEvent("browseros-tamper-ban", {
          detail: { reason: reason, data: data }
        })
      );
    } catch (_) {}
    return true;
  } catch (_) {
    return false;
  }
}

function collectClientPrivilegeClaims() {
  const p = window.__browserOSProfile || {};
  return {
    is_admin: !!p.is_admin,
    is_dev: !!p.is_dev,
    is_nitro: !!p.is_nitro,
    is_turbo: !!p.is_turbo,
    activated: !!p.activated,
    status: p.status || null,
    tier: Number(p.tier) || 0,
    unlocked_flag: !!window.__browserOSUnlockedHint
  };
}

/**
 * Compare local claims to server entitlements.
 * ONLY flags clear privilege elevation (admin / dev / turbo / nitro).
 * Free-tier unlock (approved without activation) is intentional and must NOT ban.
 */
function detectPrivilegeTamper(ent) {
  if (!ent || ent.ok === false) return { tamper: false, reasons: [] };
  // Incomplete server payload — do not ban
  if (ent.status == null && ent.is_admin == null && ent.tier == null && ent.is_nitro == null) {
    return { tamper: false, reasons: [] };
  }
  try {
    if (typeof isPrimaryOwnerClient === "function" && isPrimaryOwnerClient()) {
      return { tamper: false, reasons: [] };
    }
    if (typeof isPrimaryOwnerEmail === "function") {
      const em =
        (window.__browserOSProfile && window.__browserOSProfile.email) ||
        ent.email ||
        "";
      if (em && isPrimaryOwnerEmail(em)) {
        return { tamper: false, reasons: [] };
      }
    }
  } catch (_) {}

  const local = collectClientPrivilegeClaims();
  const reasons = [];

  // Staff / role spoof only when server explicitly says false
  if (local.is_admin === true && ent.is_admin === false && ent.is_staff !== true && ent.is_dev !== true) {
    reasons.push("spoofed_is_admin");
  }
  if (local.is_dev === true && ent.is_dev === false && ent.is_staff !== true) {
    reasons.push("spoofed_is_dev");
  }
  // Turbo spoof — only when server has definitive false
  if (
    (local.is_turbo === true || local.tier >= 2) &&
    ent.is_turbo === false &&
    (ent.tier === 0 || ent.tier === 1) &&
    ent.is_staff !== true
  ) {
    reasons.push("spoofed_turbo");
  }
  // Nitro spoof — only definitive false; staff exempt
  if (
    (local.is_nitro === true || local.tier >= 1) &&
    ent.is_nitro === false &&
    (ent.tier === 0 || ent.tier == null) &&
    ent.is_staff !== true &&
    ent.is_admin !== true &&
    ent.is_dev !== true
  ) {
    reasons.push("spoofed_nitro");
  }

  // REMOVED (caused false bans after freemium):
  // - spoofed_activated (activation no longer required for free OS)
  // - spoofed_approved_status (race / laggy gate)
  // - forced_unlock_without_gate (free approved users unlock while server can_use_os may still be false)

  return { tamper: reasons.length > 0, reasons: reasons, local: local };
}

async function runIntegrityCheck(client) {
  try {
    const ent =
      (await refreshServerEntitlements(client)) || getServerEntitlements();
    if (!ent || ent.ok === false) {
      window.__browserOSIntegrityStrikes = 0;
      return { ok: true };
    }
    const hit = detectPrivilegeTamper(ent);
    if (!hit.tamper) {
      window.__browserOSIntegrityStrikes = 0;
      return { ok: true, ent: ent };
    }
    // Require 3 consecutive hits before ban — avoids race after login / entitlement lag
    window.__browserOSIntegrityStrikes =
      (window.__browserOSIntegrityStrikes || 0) + 1;
    console.warn(
      "[BrowserOS integrity]",
      hit.reasons,
      "strike",
      window.__browserOSIntegrityStrikes
    );
    if (window.__browserOSIntegrityStrikes < 3) {
      return { ok: true, pending: true, reasons: hit.reasons, ent: ent };
    }
    if (window.__browserOSIntegrityAutoBan === false) {
      console.warn("[BrowserOS integrity] auto-ban disabled; reasons:", hit.reasons);
      return { ok: true, tamper: true, reasons: hit.reasons, ent: ent };
    }
    await reportClientTamper(hit.reasons.join(","), {
      reasons: hit.reasons,
      local: hit.local,
      server: {
        tier: ent.tier,
        is_admin: ent.is_admin,
        is_dev: ent.is_dev,
        is_nitro: ent.is_nitro,
        is_turbo: ent.is_turbo,
        activated: ent.activated,
        status: ent.status,
        can_use_os: ent.can_use_os
      },
      ua: typeof navigator !== "undefined" ? navigator.userAgent : "",
      at: new Date().toISOString()
    });
    return { ok: false, tamper: true, reasons: hit.reasons, ent: ent };
  } catch (_) {
    return { ok: true };
  }
}

function startBrowserOSIntegrityMonitor() {
  if (window.__browserOSIntegrityStarted) return;
  window.__browserOSIntegrityStarted = true;
  const tick = () => {
    try {
      runIntegrityCheck();
    } catch (_) {}
  };
  // Slower interval; first check after 15s so entitlements can settle post-login
  setInterval(tick, 45000);
  setTimeout(tick, 15000);
  window.addEventListener("focus", () => {
    // Soft focus recheck — still needs 3 strikes
    try {
      runIntegrityCheck();
    } catch (_) {}
  });
}


function serverAllowsOsAccess() {
  const ent = getServerEntitlements();

  if (ent) {

    if (ent.access_expired) return false;

    if (ent.approved || ent.status === "approved") return true;
  }
  if (typeof isAccessExpired === "function" && isAccessExpired(p)) return false;
  if (p && p.status === "approved") return true;

function getUserTier(profile) {
  const ent = getServerEntitlements();
  if (ent) {
    if (ent.is_staff || ent.is_admin || ent.is_dev) return 2;
    if (typeof ent.tier === "number") {
      return Math.min(2, Math.max(0, ent.tier | 0));
    }
    if (ent.is_turbo === true) return 2;
    if (ent.is_nitro === true) return 1;
    if (ent.is_turbo === false && ent.is_nitro === false) return 0;
  }
  const p = profile || window.__browserOSProfile;
  if (!p) return 0;
  const t = parseInt(p.tier, 10);
  if (!isNaN(t) && t >= 0) return Math.min(2, Math.max(0, t));
  if (p.is_turbo) return 2;
  if (p.is_nitro) return 1;
  return 0;
}

function isNitroUser(profile) {
  const ent = getServerEntitlements();
  if (ent) {
    if (ent.is_staff || ent.is_admin || ent.is_dev) return true;
    if (typeof ent.tier === "number") return (ent.tier | 0) >= 1;
    if (typeof ent.is_nitro === "boolean" || typeof ent.is_turbo === "boolean") {
      return !!ent.is_nitro || !!ent.is_turbo;
    }
  }
  return getUserTier(profile) >= 1;
}

  if (!isTurbo) return null;

  if (p === "admin") return isAdmin || isDev ? "admin" : null;

function isTurboUser(profile) {

/* ── Freemium: free OS entry; Pro (Nitro/Turbo/staff) unlocks social + soft limits ── */
const FREE_MAX_TABS = 5;
const FREE_MAX_PROJECTS = 2;
const FREE_MAX_BOOKMARKS = 2;
const PAID_MAX_TABS = 11;

function hasProAccess(profile) {
  // Server entitlements win when available (client-edited flags are untrusted)
  try {
    const ent = typeof getServerEntitlements === "function" ? getServerEntitlements() : null;
    if (ent) {
      if (ent.is_staff || ent.is_admin || ent.is_dev) return true;
      if (ent.is_turbo === true || Number(ent.tier) >= 2) return true;
      if (ent.is_nitro === true || Number(ent.tier) >= 1) return true;
      // Explicit zeros from server → deny even if local profile was patched
      if (
        ent.is_nitro === false &&
        ent.is_turbo === false &&
        (ent.tier === 0 || ent.tier == null) &&
        ent.is_admin === false &&
        ent.is_dev === false
      ) {
        return false;
      }
    }
  } catch (_) {}
  const p = profile || (typeof window !== "undefined" ? window.__browserOSProfile : null);
  if (!p) {
    try {
      if (typeof isNitroUser === "function" && isNitroUser()) return true;
      if (typeof isTurboUser === "function" && isTurboUser()) return true;
    } catch (_) {}
    return false;
  }
  if (p.is_admin || p.is_dev) return true;
  try {
    if (typeof isNitroUser === "function" && isNitroUser(p)) return true;
    if (typeof isTurboUser === "function" && isTurboUser(p)) return true;
  } catch (_) {}
  return !!(p.is_nitro || p.is_turbo || Number(p.tier) >= 1);
}

function safeCssColor(value, fallback) {
  const v = String(value || "").trim();
  if (/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$/.test(v)) return v;
  if (/^rgba?\(\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}(?:\s*,\s*(0|1|0?\.\d+))?\s*\)$/.test(v))
    return v;
  return fallback || "#6366f1";
}

function browserOSPlaySfx(kind) {
  if (browserOSIsDnd()) return;

  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!window.__bosAudioCtx) window.__bosAudioCtx = new Ctx();
    const ctx = window.__bosAudioCtx;
    if (ctx.state === "suspended") ctx.resume().catch(() => {});
    const now = ctx.currentTime;
    const beep = (freq, t0, dur, type, gain) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = type || "sine";
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(gain || 0.08, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g);
      g.connect(ctx.destination);
      o.start(t0);
      o.stop(t0 + dur + 0.02);
    };
    if (kind === "join") {
      beep(523.25, now, 0.12, "sine", 0.07);
      beep(659.25, now + 0.12, 0.16, "sine", 0.07);
    } else if (kind === "leave") {
      beep(392, now, 0.12, "triangle", 0.06);
      beep(293.66, now + 0.12, 0.18, "triangle", 0.06);
    } else if (kind === "click") {
      beep(800, now, 0.04, "square", 0.03);
    } else if (kind === "ping") {
      beep(880, now, 0.06, "sine", 0.05);
      beep(1320, now + 0.07, 0.1, "sine", 0.04);
    }
  } catch (_) {}
}


function extractImageUrls(text) {
  const src = String(text || "");
  const re = /https?:\/\/[^\s<>"']+\.(?:png|jpe?g|gif|webp)(?:\?[^\s<>"']*)?/gi;
  const found = [];
  let m;
  while ((m = re.exec(src))) found.push(m[0]);
  return found;
}

function privateLabelStorageKey(ownerEmail) {

function loadLocalPrivateLabels(ownerEmail) {
  try {
    const raw = localStorage.getItem(privateLabelStorageKey(ownerEmail));
    const obj = raw ? JSON.parse(raw) : {};
    return obj && typeof obj === "object" ? obj : {};
  } catch (_) {
    return {};
  }
}

function saveLocalPrivateLabel(ownerEmail, targetEmail, label) {
  const owner = String(ownerEmail || "").toLowerCase();
  const target = String(targetEmail || "").toLowerCase();
  const map = loadLocalPrivateLabels(owner);
  const lab = String(label || "").trim().slice(0, 64);
  if (!lab) delete map[target];
  else map[target] = lab;
  try {
    localStorage.setItem(privateLabelStorageKey(owner), JSON.stringify(map));
  } catch (_) {}
  return lab;
}

function getLocalPrivateLabel(ownerEmail, targetEmail) {
  const map = loadLocalPrivateLabels(ownerEmail);
  return map[String(targetEmail || "").toLowerCase()] || "";
}

function dmChannelId(emailA, emailB) {
  const a = String(emailA || "").toLowerCase().trim();
  const b = String(emailB || "").toLowerCase().trim();
  if (!a || !b) return null;
  return a < b ? "dm:" + a + "|" + b : "dm:" + b + "|" + a;
}

function dmPeerFromChannel(channel, myEmail) {
  if (
    !channel ||
    channel === "general" ||
    channel === "rules" ||
    channel === "admin-chat" ||
    channel.indexOf("dm:") !== 0
  )
    return null;
  const rest = channel.slice(3);
  const parts = rest.split("|");
  if (parts.length !== 2) return null;
  const me = String(myEmail || "").toLowerCase();
  if (parts[0] === me) return parts[1];
  if (parts[1] === me) return parts[0];
  return null;
}

/** True only if this user is a party to the DM (or GDM member if groups provided). */
function isPrivateChannelForUser(channel, myEmail, gdmList) {
  const ch = String(channel || "");
  const me = String(myEmail || "").toLowerCase();
  if (!me) return false;
  if (ch.indexOf("dm:") === 0) {
    return !!dmPeerFromChannel(ch, me);
  }
  if (ch.indexOf("gdm:") === 0) {
    const list = gdmList || (typeof loadGdmStore === "function" ? loadGdmStore() : []);
    const g = (list || []).find(
      x => x && (x.channel === ch || ("gdm:" + x.id) === ch)
    );
    return !!(g && (g.members || []).map(e => String(e).toLowerCase()).indexOf(me) >= 0);
  }
  return false;
}

function formatDuration(seconds) {
  const s = Math.max(0, parseInt(seconds, 10) || 0);
  if (s < 60) return s + " second" + (s === 1 ? "" : "s");
  if (s < 3600) {
    const m = Math.round(s / 60);
    return m + " minute" + (m === 1 ? "" : "s");
  }
  const h = Math.round(s / 3600);
  return h + " hour" + (h === 1 ? "" : "s");
}

function loadGdmStore() {

  try {
    const raw = localStorage.getItem("browserOS_gdms_v2");
    const list = raw ? JSON.parse(raw) : [];
    if (!Array.isArray(list)) return [];
    return list
      .filter(g => g && (g.channel || g.id))
      .map(g => ({
        id: String(g.id || ""),
        channel: String(g.channel || ("gdm:" + g.id)),
        name: String(g.name || "Group chat").slice(0, 80),
        icon: String(g.icon || "👥").slice(0, 8),
        members: Array.isArray(g.members)
          ? g.members.map(e => String(e).toLowerCase()).slice(0, 10)
          : [],
        created_at: g.created_at || null
      }))
      .slice(0, 40);
  } catch (_) {
    return [];
  }
}

function saveGdmStore(list) {
  try {
    localStorage.setItem("browserOS_gdms_v2", JSON.stringify(list || []));
  } catch (_) {}
}

function userInGdm(group, email) {
  const me = String(email || "").toLowerCase();
  return !!(group && (group.members || []).map(e => String(e).toLowerCase()).includes(me));
}

function normalizeGdmMembers(list) {
  return Array.from(
    new Set((list || []).map(e => String(e || "").toLowerCase()).filter(Boolean))
  ).slice(0, 10);
}

function parseGdmPayload(row) {
  try {
    let ep = row && row.embed_payload;
    if (typeof ep === "string") ep = JSON.parse(ep);
    if (!ep || typeof ep !== "object") return null;
    const channel = String(ep.channel || (row && row.channel) || "");
    if (!channel || channel.indexOf("gdm:") !== 0) return null;
    const id = String(ep.id || channel.slice(4));
    return {
      id: id,
      channel: channel,
      name: String(ep.name || "Group chat").slice(0, 80),
      icon: String(ep.icon || "👥").slice(0, 8),
      members: normalizeGdmMembers(ep.members),
      created_at: (row && row.created_at) || new Date().toISOString()
    };
  } catch (_) {
    return null;
  }
}

class ChatErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error: error };
  }
  componentDidCatch(error, info) {
    console.error("Chat crashed", error, info);
  }
  render() {
    if (this.state.error) {
      return (
        <div className="internal" style={{ padding: 24 }}>
          <h2>Chat failed to load</h2>
          <p style={{ color: "var(--text-muted)", fontSize: 13 }}>
            {String(this.state.error && this.state.error.message
              ? this.state.error.message
              : this.state.error)}
          </p>
          <button
            type="button"
            className="notes-btn"
            onClick={() => this.setState({ error: null })}
          >
            Try again
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

  /** Latest N messages for a room (chronological ascending for display). */
  const loadMessagesForChannel = async (client, ch, limit) => {
    const room = String(ch || "general");
    const take = Math.max(1, limit || MSG_INITIAL);
    // Fetch newest first, then reverse so UI stays oldest → newest
    const { data, error } = await client
      .from("chat_messages")
      .select(CHAT_MSG_SELECT)
      .eq("channel", room)
      .order("created_at", { ascending: false })
      .limit(take);
    if (error) {
      console.warn("chat load for channel failed:", room, error.message || error);
      return { data: [], error: error, hasMore: false };
    }
    const newestFirst = (data || []).filter(
      m => String(m.channel || "general") === room
    );
    const rows = newestFirst.slice().reverse();
    return {
      data: rows,
      error: null,
      hasMore: newestFirst.length >= take
    };
  };

    try {
      const { data, error } = await client
        .from("chat_messages")
        .select(CHAT_MSG_SELECT)
        .eq("channel", room)
        .lt("created_at", oldest.created_at)
        .order("created_at", { ascending: false })
        .limit(MSG_OLDER_PAGE);
      if (error) {
        setLoadingOlder(false);
        return;
      }
      const batch = (data || [])
        .filter(m => String(m.channel || "general") === room)
        .slice()
        .reverse();
      if (!batch.length) {
        setHasMoreOlder(false);
        setLoadingOlder(false);
        return;
      }
      setHasMoreOlder(batch.length >= MSG_OLDER_PAGE);
      setMessages(prev => {

        const { data: meP } = await client
          .from("profiles")
          .select("display_name, chat_banned, chat_muted, muted_until, mute_reason, kick_token, presence_status, share_activity, custom_activity, is_nitro, is_dev, is_admin")
          .eq("user_id", session.user.id)
          .maybeSingle();
        if (meP) {
          setDisplayName(meP.display_name || "");
          if (meP.presence_status) {
            setMyPresence(meP.presence_status);
            window.__browserOSPresence = meP.presence_status;
          }
          if (meP.share_activity != null) setShareActivity(!!meP.share_activity);
          if (meP.custom_activity) setCustomActivity(meP.custom_activity || "");
          setChatBanned(!!meP.chat_banned);
          setChatMuted(!!meP.chat_muted);
          applyMuteState(meP.muted_until, meP.mute_reason);
          if (meP.kick_token) setKicked(true);
        }
      } catch (_) {}

      try {
        const { data: nicks } = await client
          .from("profiles")
          .select("email, display_name, avatar_url, avatar_decoration, card_decoration, member_card_style, banner_effect, avatar_frame, badge_display, staff_badge, name_color, name_animation, name_font, is_admin, is_dev, is_nitro, is_turbo, tier");
        const map = {};
        const avatars = {};
        const aDeco = {};
        const cDeco = {};
        const mStyle = {};
        const bEff = {};
        const nickToEmail = {};
        (nicks || []).forEach(p => {
          const em = String(p.email || "").toLowerCase();
          if (em && p.display_name) {
            map[em] = p.display_name;
            nickToEmail[String(p.display_name).toLowerCase()] = em;
          }
          if (em && p.avatar_url) avatars[em] = p.avatar_url;
          const elite = !!(p.is_admin || p.is_dev || p.is_nitro);
          if (!em || !elite) return;
          const frame = p.avatar_frame || p.avatar_decoration;
          if (frame && frame !== "none") aDeco[em] = frame;
          const ban = p.banner_effect || p.card_decoration;
          if (ban && ban !== "none") {
            cDeco[em] = ban;
            bEff[em] = ban;
          }
          if (p.member_card_style && p.member_card_style !== "none") {
            mStyle[em] = p.member_card_style;
          }
        });
        const badgePrefs = {};
        const staffPrefs = {};
        const nameColors = {};
        const nameAnims = {};
        const nameFonts = {};
        (nicks || []).forEach(p => {
          const em = String(p.email || "").toLowerCase();
          if (!em) return;
          badgePrefs[em] = p.badge_display || "auto";
          staffPrefs[em] = p.staff_badge || "auto";
          if (p.name_color) nameColors[em] = p.name_color;
          nameAnims[em] = p.name_animation || "none";
          nameFonts[em] = p.name_font || "default";
        });
        if (!cancelled) {
          setNickMap(map);
          setAvatarMap(avatars);
          setAvatarDecoMap(aDeco);
          setCardDecoMap(cDeco);
          setMemberStyleMap(mStyle);
          setBannerEffectMap(bEff);
          setBadgePrefMap(badgePrefs);
          setStaffBadgeMap(staffPrefs);
          setNameColorMap(nameColors);
          setNameAnimMap(nameAnims);
          setNameFontMap(nameFonts);
          setNickToEmail(nickToEmail);
        }
      } catch (_) {}

      try {
        const { data: blocks } = await client
          .from("chat_blocks")
          .select("blocked_email")
          .ilike("blocker_email", myEmail);
        if (!cancelled) {
          setBlockedSet(new Set((blocks || []).map(b => String(b.blocked_email || "").toLowerCase())));
        }
      } catch (_) {}

      try {
        const { data: sm } = await client
          .from("chat_settings")
          .select("value")
          .eq("key", "slowmode_seconds")
          .maybeSingle();
        if (sm && sm.value != null) setSlowmodeSec(parseInt(sm.value, 10) || 0);
      } catch (_) {}


      // Seed DM list from recent dm channels
      try {
        const { data: dmRows } = await client
          .from("chat_messages")
          .select("channel, message, created_at, author_email")
          .like("channel", "dm:%")
          .order("created_at", { ascending: false })
          .limit(300);
        if (!cancelled) setDmList(rebuildDmList(dmRows || [], myEmail));
      } catch (_) {}

      const { data, error: loadErr, hasMore } = await loadMessagesForChannel(
        client,
        "general",
        MSG_INITIAL
      );
      if (cancelled) return;
      if (loadErr) {
        setError(loadErr.message || "Could not load messages.");
        setStatus("Error");
        return;
      }
      setMessages(data || []);
      setHasMoreOlder(!!hasMore);
      setStatus("Live");
      setError("");
      scrollToBottom();

      const channelSub = client
        .channel("browseros-chat-v2")
        .on(
          "postgres_changes",
          { event: "INSERT", schema: "public", table: "chat_messages" },
          payload => {
            const row = payload.new;
            if (!row || !row.id) return;
            const rowCh = row.channel || "general";
            const me = myEmail;

            // Hide staff channel events from non-staff clients
            if (rowCh === "admin-chat" && !isStaffProfile()) {
              return;
            }

            // Group roster meta — apply before privacy gate so invitees join automatically
            if (
              rowCh.indexOf("gdm:") === 0 &&
              (row.embed_type === "gdm_meta" || row.embed_type === "gdm_update")
            ) {
              try {
                const g = parseGdmPayload(row);
                if (g) {
                  const inGroup = (g.members || []).indexOf(me) >= 0;
                  setGdmList(prev => {
                    const idx = prev.findIndex(
                      x => x.channel === g.channel || x.id === g.id
                    );
                    if (!inGroup) {
                      // Removed / not invited — drop locally
                      if (idx < 0) return prev;
                      return prev.filter((_, i) => i !== idx);
                    }
                    if (idx >= 0) {
                      const next = prev.slice();
                      next[idx] = Object.assign({}, next[idx], g);
                      return next;
                    }
                    return [g].concat(prev);
                  });
                  if (inGroup) {
                    // Ensure DM-style unread if not viewing
                    if (
                      channelRefState.current !== rowCh &&
                      String(row.author_email || "").toLowerCase() !== me
                    ) {
                      try {
                        browserOSNotify({
                          type: "ping",
                          title: "Group chat",
                          body:
                            (row.message || "You were added to a group").slice(0, 140)
                        });
                      } catch (_) {}
                    }
                  } else if (channelRefState.current === rowCh) {
                    // Kicked / left — leave room view
                    setChannel("general");
    try { loadCustomChannels(); } catch (_) {}
                  }
                }
              } catch (_) {}
            }

            // Private rooms: ignore entirely if this client is not a participant
            if (rowCh.indexOf("dm:") === 0 || rowCh.indexOf("gdm:") === 0) {
              if (!isPrivateChannelForUser(rowCh, me)) {
                let allowed = false;
                if (rowCh.indexOf("gdm:") === 0) {
                  const fromPayload = parseGdmPayload(row);
                  if (
                    fromPayload &&
                    (fromPayload.members || []).indexOf(me) >= 0
                  ) {
                    allowed = true;
                  } else if (typeof loadGdmStore === "function") {
                    allowed = loadGdmStore().some(
                      g =>
                        (g.channel === rowCh || ("gdm:" + g.id) === rowCh) &&
                        userInGdm(g, me)
                    );
                  }
                }
                if (!allowed) return;
              }
            }

            if (rowCh.indexOf("dm:") === 0) {
              setDmList(prev => {
                const peer = dmPeerFromChannel(rowCh, me);
                if (!peer) return prev;
                const next = prev.filter(d => d.channel !== rowCh);
                next.unshift({
                  channel: rowCh,
                  peer,
                  t: Date.now(),
                  last: row.message || row.body || ""
                });
                return next;
              });
            }

            if (rowCh !== channelRefState.current) {
              // Unread/notify ONLY if this user is in the private conversation
              // and is not the author
              if (
                (rowCh.indexOf("dm:") === 0 || rowCh.indexOf("gdm:") === 0) &&
                String(row.author_email || "").toLowerCase() !== me &&
                isPrivateChannelForUser(rowCh, me)
              ) {
                setDmUnread(prev => ({
                  ...prev,
                  [rowCh]: (prev[rowCh] || 0) + 1
                }));
                /* native Notification disabled */
                try {
                  browserOSPlaySfx("ping");
                } catch (_) {}
                try {
                  browserOSNotify({
                    type: "ping",
                    title:
                      rowCh.indexOf("gdm:") === 0
                        ? "Group message"
                        : "Direct message",
                    body:
                      (row.author_email || "Someone") +
                      ": " +
                      String(row.message || "").slice(0, 120)
                  });
                } catch (_) {}
              }
            } else {
              setMessages(prev => {
                if (prev.some(m => m.id === row.id)) return prev;
                return [...prev, row];
              });
              lastReadRef.current[rowCh] = row.id;
              scrollToBottom();
            }

            (async () => {
              try {
                const text = row.message || row.body || "";
                const pings = extractChatPings(text);
                const from = row.author_email || "Someone";
                if ((from || "").toLowerCase() === me) return;
                const replyHit =
                  String(row.reply_to_author || "").toLowerCase() === me;
                const everyoneHit = pings.includes("__everyone__");
                if (!pings.includes(me) && !replyHit && !everyoneHit) return;
                const viewingHere =
                  !document.hidden &&
                  window.__browserOSActiveChatChannel ===
                    (row.channel || channelRefState.current);
                if (!viewingHere && !browserOSIsDnd()) browserOSPlaySfx("ping");
                if (!viewingHere && !browserOSIsDnd())
                  browserOSNotify({
                    type: "ping",
                    title: replyHit ? "Reply" : "Chat ping",
                    body:
                      from +
                      (replyHit ? " replied: " : " mentioned you: ") +
                      String(text).slice(0, 140)
                  });
              } catch (_) {}
            })();
          }
        )
        .on(
          "postgres_changes",
          {
            event: "UPDATE",
            schema: "public",
            table: "profiles",
            filter: "user_id=eq." + session.user.id
          },
          payload => {
            const row = payload.new;
            if (!row) return;
            const active = applyMuteState(row.muted_until, row.mute_reason);
            if (row.chat_banned) setChatBanned(true);
            if (row.chat_muted != null) setChatMuted(!!row.chat_muted);
            if (row.display_name) setDisplayName(row.display_name);
            if (row.kick_token) {
              setKicked(true);
              setMessages([]);
              browserOSNotify({
                type: "ping",
                title: "You were kicked",
                body: "An admin kicked you from chat."
              });
            }
            if (active) {
              const secs = Math.max(
                0,
                Math.round((new Date(row.muted_until) - Date.now()) / 1000)
              );
              browserOSNotify({
                type: "ping",
                title: "You were muted",
                body:
                  "You were muted for " +
                  secs +
                  " second" +
                  (secs === 1 ? "" : "s") +
                  (row.mute_reason ? " because of " + row.mute_reason : "")
              });
            }
          }
        )
        .on(
          "postgres_changes",
          { event: "UPDATE", schema: "public", table: "chat_messages" },
          payload => {
            const row = payload.new;
            if (!row || !row.id) return;
            const rowCh = row.channel || "general";
            if (rowCh !== channelRefState.current) return;
            setMessages(prev =>
              prev.map(m => (String(m.id) === String(row.id) ? { ...m, ...row } : m))
            );
          }
        )
        .subscribe(subStatus => {
          if (subStatus === "SUBSCRIBED") setStatus("Live");
          if (subStatus === "CHANNEL_ERROR") setStatus("Realtime error");
        });

      channelRef.current = channelSub;
    })();

    return () => {
      cancelled = true;
      window.__browserOSActiveChatChannel = null;
      const client2 = getSupabaseClient();
      if (client2 && channelRef.current) {
        client2.removeChannel(channelRef.current);
        channelRef.current = null;
      }
      if (client2 && presenceRef.current) {
        client2.removeChannel(presenceRef.current);
        presenceRef.current = null;
      }
    };
  }, []);

  // Reload message list when switching channel
  useEffect(() => {
    const client = getSupabaseClient();
    if (!client || !userEmail) return;
    let cancelled = false;
    (async () => {
      setError("");
      setMessages([]); // prevent showing previous channel while loading
      // Staff-only room guard
      if (channel === "admin-chat" && !canViewChannel("admin-chat")) {
        setError("Admin chat is only available to staff.");
        if (channel !== "general") setChannel("general");
        return;
      }
      if (String(channel).indexOf("gdm:") === 0) {
        const g = (gdmList || []).find(
          x => x && (x.channel === channel || ("gdm:" + x.id) === channel)
        );
        if (!g || !userInGdm(g, userEmail)) {
          setError("You are not a member of this group chat.");
          if (channel !== "general") setChannel("general");
          return;
        }
      }
      const room = String(channel || "general");
      setHasMoreOlder(false);
      setLoadingOlder(false);
      const { data, error: loadErr, hasMore } = await loadMessagesForChannel(
        client,
        room,
        MSG_INITIAL
      );
      if (cancelled) return;
      if (loadErr) {
        setError(loadErr.message || "Could not load this conversation.");
        setMessages([]);
        setHasMoreOlder(false);
        return;
      }
      let rows = data || [];
      setHasMoreOlder(!!hasMore);
      // Inject queued ModOS DMs for this user
      try {
        if (String(room).indexOf("dm:") === 0) {
          const key = "browserOS_modos_dm_queue";
          const raw = localStorage.getItem(key);
          const q = raw ? JSON.parse(raw) : [];
          const mine = (Array.isArray(q) ? q : []).filter(
            e =>
              e &&
              e.channel === room &&
              (String(e.target).toLowerCase() === String(userEmail || "").toLowerCase() ||
                String(room).toLowerCase().indexOf(String(userEmail || "").toLowerCase()) >= 0)
          );
          if (mine.length) {
            const existing = new Set(rows.map(r => String(r.id)));
            mine.forEach(e => {
              if (!existing.has(String(e.id))) {
                rows = rows.concat([
                  {
                    id: e.id,
                    author_email: MODOS_EMAIL,
                    display_name: MODOS_NAME,
                    is_bot: true,
                    message: e.message,
                    channel: room,
                    created_at: e.created_at,
                    embed_type: "modos_dm"
                  }
                ]);
              }
            });
            rows = rows.slice().sort(
              (a, b) =>
                new Date(a.created_at).getTime() - new Date(b.created_at).getTime()
            );
          }
        }
      } catch (_) {}
      // Prefill #rules if empty
      if (room === "rules" && rows.length === 0) {
        const welcome = {
          id: "local-rules-welcome",
          author_email: "system@browseros",
          author_is_admin: true,
          message: BROWSEROS_RULES_BODY,
          channel: "rules",
          created_at: new Date().toISOString(),
          pinned: true,
          embed_type: "rules_card"
        };
        // Staff can persist once
        const staff =
          window.__browserOSProfile &&
          (window.__browserOSProfile.is_dev || window.__browserOSProfile.is_admin);
        if (staff) {
          try {
            await client.rpc("send_chat_message", {
              p_channel: "rules",
              p_message: BROWSEROS_RULES_BODY,
              p_reply_to_id: null,
              p_reply_to_author: null,
              p_reply_to_preview: null,
              p_image_url: null,
              p_embed_type: "rules_card",
              p_embed_payload: { pinned: true }
            });
            const { data: again } = await client
              .from("chat_messages")
              .select(CHAT_MSG_SELECT)
              .eq("channel", "rules")
              .order("created_at", { ascending: false })
              .limit(MSG_INITIAL);
            if (again && again.length) rows = again.slice().reverse();
            else rows = [welcome];
          } catch (_) {
            rows = [welcome];
          }
        } else {
          rows = [welcome];
        }
      }
      setMessages(rows);
      await loadReactionsFor(client, rows);
      // NEW MESSAGES divider: if we had unread, mark first message newer than last read
      try {
        const unread = pendingUnreadRef.current || 0;
        pendingUnreadRef.current = 0;
        const lastId = lastReadRef.current[room];
        if (unread > 0 && rows.length) {
          const start = Math.max(0, rows.length - unread);
          setNewMsgMarkerId(String(rows[start].id));
        } else if (lastId && rows.length) {
          const idx = rows.findIndex(r => String(r.id) === String(lastId));
          if (idx >= 0 && idx < rows.length - 1) {
            setNewMsgMarkerId(String(rows[idx + 1].id));
          } else {
            setNewMsgMarkerId(null);
          }
        } else {
          setNewMsgMarkerId(null);
        }
        if (rows.length) {
          lastReadRef.current[room] = rows[rows.length - 1].id;
        }
      } catch (_) {}
      scrollToBottom();
    })();
    return () => {
      cancelled = true;
    };
  }, [channel, userEmail]);

  useEffect(() => {
    scrollToBottom();
  }, [messages.length]);

  const notifyUser = async (client, toEmail, title, body, type) => {
    try {
      await client.from("notifications").insert({
        recipient_email: String(toEmail).toLowerCase(),
        actor_email: userEmail,
        type: type || "info",
        title,
        body,
        read: false
      });
    } catch (_) {}
  };

  const rpcAdmin = async (client, fn, args) => {
    const { data, error } = await client.rpc(fn, args);
    if (error) throw error;
    return data;
  };

  const updateTargetProfile = async (client, targetEmail, patch) => {
    const { data, error } = await client
      .from("profiles")
      .update(patch)
      .ilike("email", targetEmail)
      .select("user_id, email");
    if (error) return { error, data: null };
    if (!data || !data.length) return { error: { message: "No profile found for " + targetEmail }, data: null };
    return { error: null, data };
  };

  const postSystem = async (client, session, authorEmail, msg, ch) => {
    const { error } = await client.rpc("post_system_message", {
      p_channel: ch || "general",
      p_message: msg
    });
    if (error) {
      await client.rpc("send_chat_message", {
        p_channel: ch || "general",
        p_message: msg
      });
    }
  };

  const modosPublicAnnounce = async (client, ch, message) => {
    const room = ch || channel || "general";
    const body = String(message || "");
    // Prefer system RPC so it is not attributed to the human moderator
    try {
      await client.rpc("post_system_message", {
        p_channel: room,
        p_message: body,
        p_author_email: MODOS_EMAIL,
        p_author_name: MODOS_NAME,
        p_embed_type: "modos"
      });
    } catch (_) {
      try {
        await client.rpc("post_system_message", {
          p_channel: room,
          p_message: body
        });
      } catch (_) {
        try {
          await client.rpc("send_chat_message", {
            p_channel: room,
            p_message: body,
            p_embed_type: "modos",
            p_embed_payload: { bot: "ModOS" }
          });
        } catch (_) {}
      }
    }
    // Optimistic local row as ModOS
    if (room === (channel || "general")) {
      setMessages(prev =>
        prev.concat([
          {
            id: "local-modos-" + Date.now(),
            author_email: MODOS_EMAIL,
            display_name: MODOS_NAME,
            is_bot: true,
            message: body,
            channel: room,
            created_at: new Date().toISOString(),
            embed_type: "modos"
          }
        ])
      );
    }
  };

  const modosDmTarget = async (client, targetEmail, lines) => {
    const target = String(targetEmail || "").toLowerCase();
    if (!target || !target.includes("@")) return;
    const body = Array.isArray(lines) ? lines.join("\n") : String(lines || "");
    const ch = dmChannelId(MODOS_EMAIL, target);
    // Persist locally so target sees it even if RPC cannot impersonate ModOS
    try {
      const key = "browserOS_modos_dm_queue";
      const raw = localStorage.getItem(key);
      const q = raw ? JSON.parse(raw) : [];
      const entry = {
        id: "modos-dm-" + Date.now(),
        channel: ch,
        target: target,
        author_email: MODOS_EMAIL,
        message: body,
        created_at: new Date().toISOString(),
        embed_type: "modos_dm"
      };
      const next = [entry].concat(Array.isArray(q) ? q : []).slice(0, 100);
      localStorage.setItem(key, JSON.stringify(next));
    } catch (_) {}
    try {
      await client.rpc("send_chat_message", {
        p_channel: ch,
        p_message: body,
        p_embed_type: "modos_dm",
        p_embed_payload: { bot: "ModOS", target: target }
      });
    } catch (_) {}
    try {
      await client.from("notifications").insert({
        recipient_email: target,
        actor_email: MODOS_EMAIL,
        type: "moderation",
        title: "ModOS moderation notice",
        body: body.slice(0, 200),
        read: false
      });
    } catch (_) {}
  };

  const modosAction = async (client, opts) => {
    // opts: { action, target, reason, seconds, channel, byAutoMod }
    const action = opts.action || "action";
    const target = String(opts.target || "").toLowerCase();
    const reason = opts.reason || "No reason given";
    const seconds = opts.seconds;
    const room = opts.channel || "general";
    const auto = !!opts.byAutoMod;
    let publicMsg = "";
    let dmLines = ["🤖 **ModOS Bot**", ""];

    if (action === "timeout" || action === "mute_timed") {
      const dur = formatDuration(seconds);
      publicMsg = auto
        ? "🤖 **ModOS** [BOT]: @" +
          target +
          " has been automatically muted for **" +
          dur +
          "** by AutoMod *(Reason: " +
          reason +
          ")*."
        : "🤖 **ModOS** [BOT]: @" +
          target +
          " was timed out for **" +
          dur +
          "** by staff. *(Reason: " +
          reason +
          ")*";
      dmLines = dmLines.concat([
        "⚠️ **You have been muted in BrowserOS.**",
        "",
        "⏱️ **Duration:** " + dur,
        "📝 **Reason:** " + reason,
        "📅 **Expires:** " +
          (seconds
            ? new Date(Date.now() + seconds * 1000).toLocaleString()
            : "When staff unmute you"),
        "",
        "_If you believe this action was taken in error, please contact an Admin or Developer._"
      ]);
    } else if (action === "mute") {
      publicMsg =
        "🤖 **ModOS** [BOT]: @" +
        target +
        " was muted in public channels by staff. *(Reason: " +
        reason +
        ")*";
      dmLines = dmLines.concat([
        "⚠️ **You have been muted in BrowserOS public channels.**",
        "",
        "📝 **Reason:** " + reason,
        "",
        "_Contact an Admin or Developer if you believe this was a mistake._"
      ]);
    } else if (action === "kick") {
      publicMsg =
        "🤖 **ModOS** [BOT]: @" + target + " has been removed from the server.";
      dmLines = dmLines.concat([
        "⚠️ **You were kicked from BrowserOS chat.**",
        "",
        "📝 **Reason:** " + reason,
        "",
        "_You may still be able to rejoin depending on staff policy._"
      ]);
    } else if (action === "ban") {
      publicMsg =
        "🤖 **ModOS** [BOT]: @" + target + " has been removed from the server.";
      dmLines = dmLines.concat([
        "🚫 **You have been banned from BrowserOS chat.**",
        "",
        "📝 **Reason:** " + reason,
        "",
        "_Contact an Admin or Developer if you believe this was a mistake._"
      ]);
    } else if (action === "warn") {
      publicMsg =
        "🤖 **ModOS** [BOT]: @" +
        target +
        " received a formal warning. *(Reason: " +
        reason +
        ")*";
      dmLines = dmLines.concat([
        "⚠️ **You received a warning in BrowserOS.**",
        "",

  const votePoll = async (messageId, optionIndex) => {
    const client = getSupabaseClient();
    if (!client || !userEmail) return;
    const mid = String(messageId);
    const msg = messages.find(m => String(m.id) === mid);
    if (!msg || msg.embed_type !== "poll") return;
    let payload = msg.embed_payload || {};
    if (typeof payload === "string") {
      try {
        payload = JSON.parse(payload);
      } catch (_) {
        payload = {};
      }
    }
    const ends = payload.ends_at ? new Date(payload.ends_at).getTime() : 0;
    if (ends && Date.now() > ends) {
      setError("This poll has ended.");
      return;
    }
    const me = String(userEmail).toLowerCase();
    // Prefer server RPC so votes sync for everyone
    const { error: rpcErr } = await client.rpc("vote_chat_poll", {
      p_message_id: mid,
      p_option_index: Number(optionIndex)
    });
    if (!rpcErr) {
      // Refresh payload from optimistic merge; realtime UPDATE will confirm
      const votes = Object.assign({}, payload.votes || {});
      Object.keys(votes).forEach(k => {
        votes[k] = (votes[k] || []).filter(
          e => String(e).toLowerCase() !== me
        );
        if (!votes[k].length) delete votes[k];
      });
      const key = String(optionIndex);
      votes[key] = (votes[key] || []).concat([me]);
      const nextPayload = Object.assign({}, payload, { votes: votes });
      setMessages(prev =>
        prev.map(m =>
          String(m.id) === mid
            ? { ...m, embed_payload: nextPayload }
            : m
        )
      );
      return;
    }
    setError(
      (rpcErr && rpcErr.message) ||
        "Could not save vote. Run browseros_high_priority_security.sql."
    );
  };

    if (em.charAt(0) === ":" && em.charAt(em.length - 1) === ":" && typeof expandEmojiShortcodes === "function") {
      em = expandEmojiShortcodes(em);
    }
    if (em.charAt(0) === ":" && em.charAt(em.length - 1) === ":") return; // invalid shortcode
    const { error } = await client.rpc("toggle_chat_reaction", {
      p_message_id: String(messageId),
      p_emoji: em
    });
    if (error) {
      setError(error.message || "Reaction failed.");
      return;
    }
    // optimistic local update
    setReactions(prev => {
      const list = [...(prev[messageId] || [])];
      const i = list.findIndex(x => x.emoji === em);
      if (i >= 0) {
        const item = { ...list[i] };
        if (item.mine) {
          item.count -= 1;
          item.mine = false;
          if (item.count <= 0) list.splice(i, 1);
          else list[i] = item;
        } else {
          item.count += 1;
          item.mine = true;
          list[i] = item;
        }
      } else {
        list.push({ emoji: em, count: 1, mine: true });
      }
      return { ...prev, [messageId]: list };
    });

    setReactQuery("");

  const startVad = (stream) => {
    stopVad();
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const src = ctx.createMediaStreamSource(stream);
      const analyser = ctx.createAnalyser();
      analyser.fftSize = 512;
      src.connect(analyser);
      const data = new Uint8Array(analyser.frequencyBinCount);
      let speaking = false;
      const tick = () => {
        analyser.getByteFrequencyData(data);
        let sum = 0;
        for (let i = 0; i < data.length; i++) sum += data[i];
        const avg = sum / data.length;
        const now = avg > 18;
        if (now !== speaking) {
          speaking = now;
          setIAmSpeaking(now);
          const ch = voiceSigRef.current;
          if (ch) {
            ch.send({
              type: "broadcast",
              event: "signal",
              payload: {
                type: "speaking",
                from: userEmail,
                speaking: now
              }
            }).catch(() => {});
          }
        }
        vadRef.current.raf = requestAnimationFrame(tick);
      };
      vadRef.current = { ctx, analyser, raf: 0 };
      tick();
    } catch (_) {}
  };

  const removePeer = (email) => {

  const ensurePeer = async (peerEmail, polite) => {
    if (!peerEmail || peerEmail === userEmail) return null;
    if (peersRef.current[peerEmail]) return peersRef.current[peerEmail];
    const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    const audio = document.createElement("audio");
    audio.autoplay = true;
    audio.playsInline = true;
    audio.style.display = "none";
    document.body.appendChild(audio);
    const entry = { pc, audio, polite: !!polite };
    peersRef.current[peerEmail] = entry;

    if (localStreamRef.current) {
      localStreamRef.current.getTracks().forEach(t => {
        try {
          pc.addTrack(t, localStreamRef.current);
        } catch (_) {}
      });
    }

    pc.ontrack = ev => {
      if (ev.streams && ev.streams[0]) {
        audio.srcObject = ev.streams[0];
        audio.muted = voiceDeafenedRef.current;
        // Remote speaking detection
        try {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (Ctx) {
            const ctx = new Ctx();
            const src = ctx.createMediaStreamSource(ev.streams[0]);
            const analyser = ctx.createAnalyser();
            analyser.fftSize = 512;
            src.connect(analyser);
            const data = new Uint8Array(analyser.frequencyBinCount);
            let speaking = false;
            const tick = () => {
              if (!peersRef.current[peerEmail]) {
                try { ctx.close(); } catch (_) {}
                return;
              }
              analyser.getByteFrequencyData(data);
              let sum = 0;
              for (let i = 0; i < data.length; i++) sum += data[i];
              const avg = sum / data.length;
              const now = avg > 16;
              if (now !== speaking) {
                speaking = now;
                setVoicePeers(prev =>
                  prev.map(p =>
                    p.email === peerEmail ? { ...p, speaking: now } : p
                  )
                );
              }
              requestAnimationFrame(tick);
            };
            tick();
          }
        } catch (_) {}
      }
    };

    pc.onicecandidate = ev => {
      if (!ev.candidate || !voiceSigRef.current) return;
      voiceSigRef.current
        .send({
          type: "broadcast",
          event: "signal",
          payload: {
            type: "ice",
            from: userEmail,
            to: peerEmail,
            candidate: ev.candidate.toJSON()
          }
        })
        .catch(() => {});
    };

    pc.onconnectionstatechange = () => {
      if (pc.connectionState === "failed" || pc.connectionState === "closed") {
        removePeer(peerEmail);
      }
    };

    setVoicePeers(prev => {
      if (prev.some(x => x.email === peerEmail)) return prev;
      return [...prev, { email: peerEmail, displayName: peerEmail, speaking: false }];
    });

    return entry;
  };

  const handleVoiceSignal = async (payload) => {
    if (!payload || !payload.from || payload.from === userEmail) return;
    const from = String(payload.from).toLowerCase();

    if (payload.type === "leave") {
      removePeer(from);
      return;
    }

    if (payload.type === "speaking") {
      setVoicePeers(prev =>
        prev.map(p =>
          p.email === from ? { ...p, speaking: !!payload.speaking } : p
        )
      );
      return;
    }

    if (payload.type === "join") {
      // Existing members create offer toward the joiner
      const entry = await ensurePeer(from, true);
      if (!entry || !voiceSigRef.current) return;
      try {
        const offer = await entry.pc.createOffer();
        await entry.pc.setLocalDescription(offer);
        await voiceSigRef.current.send({
          type: "broadcast",
          event: "signal",
          payload: {
            type: "offer",
            from: userEmail,
            to: from,
            sdp: entry.pc.localDescription
          }
        });
      } catch (_) {}
      setVoicePeers(prev =>
        prev.map(p =>
          p.email === from
            ? { ...p, displayName: payload.displayName || from }
            : p
        )
      );
      return;
    }

    if (payload.type === "offer" && payload.to === userEmail && payload.sdp) {
      const entry = await ensurePeer(from, false);
      if (!entry) return;
      try {
        await entry.pc.setRemoteDescription(payload.sdp);
        const answer = await entry.pc.createAnswer();
        await entry.pc.setLocalDescription(answer);
        await voiceSigRef.current.send({
          type: "broadcast",
          event: "signal",
          payload: {
            type: "answer",
            from: userEmail,
            to: from,
            sdp: entry.pc.localDescription
          }
        });
      } catch (_) {}
      return;
    }

    if (payload.type === "answer" && payload.to === userEmail && payload.sdp) {
      const entry = peersRef.current[from];
      if (!entry) return;
      try {
        await entry.pc.setRemoteDescription(payload.sdp);
      } catch (_) {}
      return;
    }

    if (payload.type === "ice" && payload.to === userEmail && payload.candidate) {
      const entry = peersRef.current[from] || (await ensurePeer(from, false));
      if (!entry) return;
      try {
        await entry.pc.addIceCandidate(payload.candidate);
      } catch (_) {}
    }
  };

      body = body
        .replace(new RegExp("^@" + a + "\\b\\s*", "i"), "")
        .replace(new RegExp("^@" + a.split("@")[0] + "\\b\\s*", "i"), "")
        .trim();
    }
    if (body.length > chatCharLimit()) {
      setError("Message too long (max " + chatCharLimit() + " characters).");
      return;
    }

    const client = getSupabaseClient();
    if (!client) return;

    const { data: sessionData } = await client.auth.getSession();
    const session = sessionData && sessionData.session;
    if (!session) {
      setError("Session expired. Refresh and sign in again.");
      return;
    }

    const authorEmail = (session.user.email || "user").toLowerCase();
    const authorIsAdmin = !!(
      (window.__browserOSProfile && window.__browserOSProfile.is_admin) ||
      adminEmails.has(authorEmail)
    );

    // Local-only clear
    if (/^\/clear\s*$/i.test(body)) {
      setMessages([]);
      setText("");
      return;
    }

    // /shrug — append shrug to rest of message (or alone)
    if (/^\/shrug\b/i.test(body)) {
      const rest = body.replace(/^\/shrug\s*/i, "").trim();
      body = (rest ? rest + " " : "") + "¯\\_(ツ)_/¯";
    }

    // /me action
    const meMatch = body.match(/^\/me\s+(.+)$/i);
    if (meMatch) {
      body = "* " + (displayName || authorEmail) + " " + meMatch[1].trim();
    }

    // /nick
    const nickMatch = body.match(/^\/nick\s+(.+)$/i);
    if (nickMatch) {
      const nick = nickMatch[1].trim().slice(0, 32);
      if (!nick) {
        setError("Usage: /nick new_name");
        return;
      }
      setSending(true);
      const { error: nErr } = await client
        .from("profiles")
        .update({ display_name: nick })
        .eq("user_id", session.user.id);
      setSending(false);
      if (nErr) {
        setError(nErr.message || "Could not update nickname.");
        return;
      }
      setDisplayName(nick);
      setNickMap(prev => ({ ...prev, [authorEmail]: nick }));
      setText("");
      browserOSNotify({ title: "Nickname updated", body: "You are now " + nick });
      return;
    }

    // /block /unblock
    const blockMatch = body.match(/^\/block\s+@?([^\s]+)\s*$/i);
    if (blockMatch) {
      const target = blockMatch[1].replace(/^@/, "").toLowerCase();
      if (!target.includes("@")) {
        setError("Usage: /block user@email.com");
        return;
      }
      setSending(true);
      const { error: bErr } = await client.rpc("block_user", { p_email: target });
      setSending(false);
      if (bErr) {
        setError(bErr.message || "Block failed.");
        return;
      }
      setBlockedSet(prev => new Set([...prev, target]));
      setText("");
      browserOSNotify({ title: "Blocked", body: target });
      return;
    }
    const unblockMatch = body.match(/^\/unblock\s+@?([^\s]+)\s*$/i);
    if (unblockMatch) {
      const target = unblockMatch[1].replace(/^@/, "").toLowerCase();
      setSending(true);
      const { error: ubErr } = await client.rpc("unblock_user", { p_email: target });
      setSending(false);
      if (ubErr) {
        setError(ubErr.message || "Unblock failed.");
        return;
      }
      setBlockedSet(prev => {
        const n = new Set(prev);
        n.delete(target);
        return n;
      });
      setText("");
      browserOSNotify({ title: "Unblocked", body: target });
      return;
    }

    // /dm user message
    const dmMatch = body.match(/^\/dm\s+@?([^\s]+)\s+(.+)$/i);
    if (dmMatch) {
      const target = dmMatch[1].replace(/^@/, "").toLowerCase();
      const msg = dmMatch[2].trim();
      if (!target.includes("@") || !msg) {
        setError("Usage: /dm user@email.com hello there");
        return;
      }
      const ch = dmChannelId(authorEmail, target);
      setChannel(ch);
      // fall through to send as normal message in that channel after reassignment
      body = msg;
      // continue with body as msg and channel will be updated async - set channel then send in DM
      setSending(true);
      setError("");
      const stillMutedDm = await refreshMyMute(client, session.user.id, authorEmail);
      if (stillMutedDm && !authorIsAdmin) {
        setSending(false);
        setError("You are timed out and cannot send messages.");
        return;
      }
      const { data: banCheck } = await client
        .from("profiles")
        .select("chat_banned")
        .eq("user_id", session.user.id)
        .maybeSingle();
      if (banCheck && banCheck.chat_banned && !authorIsAdmin) {
        setSending(false);
        setError("You are banned from chat.");
        return;
      }
      const { error: dmErr } = await client.rpc("send_chat_message", {
        p_channel: ch,
        p_message: msg
      });
      setSending(false);
      if (dmErr) {
        setError(dmErr.message || "DM failed.");
        return;
      }
      await notifyUser(client, target, "Direct message", authorEmail + ": " + msg.slice(0, 140), "dm");
      setText("");
      setLastSentAt(Date.now());
      return;
    }

    // —— Admin commands ——
    const requireAdmin = () => {
      if (!authorIsAdmin) {
        setError("Only admins can use that command.");
        return false;
      }
      return true;
    };

    const parseUserReason = (raw, cmd) => {
      // /cmd user@x.com reason...
      const m = raw.match(new RegExp("^/" + cmd + "\\s+@?([^\\s]+)\\s*(.*)$", "i"));
      if (!m) return null;
      return {
        user: String(m[1] || "").replace(/^@/, "").toLowerCase(),
        reason: String(m[2] || "").trim() || "No reason given"
      };
    };

    if (/^\/kick\s+/i.test(body)) {
      if (!requireAdmin()) return;
      const p = parseUserReason(body, "kick");
      if (!p || !p.user.includes("@")) {
        setError("Usage: /kick user@email.com reason");
        return;
      }
      setSending(true);
      try {
        await rpcAdmin(client, "admin_kick", {
          target_email: p.user,
          reason: p.reason
        });
        await modosAction(client, {
          action: "kick",
          target: p.user,
          reason: p.reason,
          channel: "general"
        });
      } catch (err) {
        setSending(false);
        setError((err && err.message) || "Kick failed (server).");
        return;
      }
      setSending(false);
      setText("");
      return;
    }

    if (/^\/ban\s+/i.test(body)) {
      if (!requireAdmin()) return;
      const p = parseUserReason(body, "ban");
      if (!p || !p.user.includes("@")) {
        setError("Usage: /ban user@email.com reason");
        return;
      }
      setSending(true);
      try {
        await rpcAdmin(client, "admin_ban", {
          target_email: p.user,
          reason: p.reason
        });
        await modosAction(client, {
          action: "ban",
          target: p.user,
          reason: p.reason,
          channel: "general"
        });
      } catch (err) {
        setSending(false);
        setError((err && err.message) || "Ban failed (server).");
        return;
      }
      setSending(false);
      setText("");
      return;
    }

    if (/^\/unban\s+/i.test(body)) {
      if (!requireAdmin()) return;
      const p = parseUserReason(body, "unban");
      if (!p || !p.user.includes("@")) {
        setError("Usage: /unban user@email.com");
        return;
      }
      setSending(true);
      try {
        await rpcAdmin(client, "admin_unban", { target_email: p.user });
      } catch (err) {
        setSending(false);
        setError((err && err.message) || "Unban failed (server).");
        return;
      }
      setSending(false);
      setText("");
      return;
    }

    if (/^\/timeout\s+/i.test(body)) {
      if (!requireAdmin()) return;
      const m = body.match(/^\/timeout\s+@?([^\s]+)\s+(\d+)\s*(.*)$/i);
      if (!m) {
        setError("Usage: /timeout user@email.com 60 reason");
        return;
      }
      const targetEmail = String(m[1] || "").replace(/^@/, "").toLowerCase();
      const seconds = Math.min(86400, Math.max(1, parseInt(m[2], 10) || 0));
      const reason = String(m[3] || "").trim() || "No reason given";
      setSending(true);
      try {
        await rpcAdmin(client, "admin_timeout", {
          target_email: targetEmail,
          seconds: seconds,
          reason: reason
        });
        await modosAction(client, {
          action: "timeout",
          target: targetEmail,
          reason: reason,
          seconds: seconds,
          channel: "general"
        });
      } catch (err) {
        setSending(false);
        setError((err && err.message) || "Timeout failed (server).");
        return;
      }
      setSending(false);
      setText("");
      return;
    }

    if (/^\/untimeout\s+/i.test(body)) {
      if (!requireAdmin()) return;
      const p = parseUserReason(body, "untimeout");
      if (!p || !p.user.includes("@")) {
        setError("Usage: /untimeout user@email.com");
        return;
      }
      setSending(true);
      try {
        await rpcAdmin(client, "admin_untimeout", { target_email: p.user });
      } catch (err) {
        setSending(false);
        setError((err && err.message) || "Untimeout failed (server).");
        return;
      }
      setSending(false);
      setText("");
      return;
    }

    if (/^\/mute\s+/i.test(body)) {
      if (!requireAdmin()) return;
      const p = parseUserReason(body, "mute");
      if (!p || !p.user.includes("@")) {
        setError("Usage: /mute user@email.com");
        return;
      }
      setSending(true);
      try {
        await rpcAdmin(client, "admin_mute", { target_email: p.user });
        await modosAction(client, {
          action: "mute",
          target: p.user,
          reason: p.reason || "Muted by staff",
          channel: "general"
        });
      } catch (err) {
        setSending(false);
        setError((err && err.message) || "Mute failed (server).");
        return;
      }
      setSending(false);
      setText("");
      return;
    }

    if (/^\/unmute\s+/i.test(body)) {
      if (!requireAdmin()) return;
      const p = parseUserReason(body, "unmute");
      if (!p || !p.user.includes("@")) {
        setError("Usage: /unmute user@email.com");
        return;
      }
      setSending(true);
      try {
        await rpcAdmin(client, "admin_unmute", { target_email: p.user });
      } catch (err) {
        setSending(false);
        setError((err && err.message) || "Unmute failed (server).");
        return;
      }
      setSending(false);
      setText("");
      return;
    }

    if (/^\/purge\s+/i.test(body)) {
      if (!requireAdmin()) return;
      const m = body.match(/^\/purge\s+(\d+)\s*$/i);
      if (!m) {
        setError("Usage: /purge 20");
        return;
      }
      const count = Math.min(100, Math.max(1, parseInt(m[1], 10) || 0));
      setSending(true);
      const ch = channel || "general";
      try {
        const data = await rpcAdmin(client, "admin_purge_messages", {
          p_channel: ch,
          p_count: count
        });
        const deleted = (data && data.deleted) || count;
        setMessages([]);
        browserOSNotify({
          title: "Purged",
          body: "Deleted " + deleted + " messages"
        });
      } catch (err) {
        setSending(false);
        setError((err && err.message) || "Purge failed (server).");
        return;
      }
      setSending(false);
      setText("");
      return;
    }

    if (/^\/slowmode\s+/i.test(body)) {
      if (!requireAdmin()) return;
      const m = body.match(/^\/slowmode\s+(\d+)\s*$/i);
      if (!m) {
        setError("Usage: /slowmode 5  (0 to disable)");
        return;
      }
      const sec = Math.min(3600, Math.max(0, parseInt(m[1], 10) || 0));
      setSending(true);
      try {
        await rpcAdmin(client, "admin_set_slowmode", { seconds: sec });
        setSlowmodeSec(sec);
        await postSystem(
          client,
          session,
          authorEmail,
          "🐢 Slowmode is now " + sec + "s",
          "general"
        );
      } catch (err) {
        setSending(false);
        setError((err && err.message) || "Slowmode failed (server).");
        return;
      }
      setSending(false);
      setText("");
      return;
    }

    if (/^\/warn\s+/i.test(body)) {
      if (!requireAdmin()) return;
      const p = parseUserReason(body, "warn");
      if (!p || !p.user.includes("@")) {
        setError("Usage: /warn user@email.com reason");
        return;
      }
      setSending(true);
      try {
        await rpcAdmin(client, "admin_warn", {
          target_email: p.user,
          reason: p.reason
        });
        await modosAction(client, {
          action: "warn",
          target: p.user,
          reason: p.reason,
          channel: "general"
        });
      } catch (err) {
        setSending(false);
        setError((err && err.message) || "Warn failed (server).");
        return;
      }
      setSending(false);
      setText("");
      return;
    }



    // /setrole email role  (primary owner only)
    const setRoleMatch = body.match(/^\/setrole\s+(\S+)\s+(user|admin|dev)\s*$/i);
    if (setRoleMatch) {
      if (!isPrimaryOwnerClient()) {
        setError("Only the BrowserOS owner can use /setrole.");
        return;
      }
      const targetEm = setRoleMatch[1].toLowerCase();
      if (
        typeof isPrimaryOwnerEmail === "function" &&
        isPrimaryOwnerEmail(targetEm)
      ) {
        setError("Cannot change the primary owner role.");
        return;
      }
      if (targetEm === "mhing@uiowa.edu") {
        setError("Cannot change the primary owner role.");
        return;
      }
      setSending(true);
      try {
        await client.rpc("owner_set_role", {
          target_email: targetEm,
          new_role: setRoleMatch[2].toLowerCase()
        });
        await postSystem(
          client,
          session,
          authorEmail,
          "👑 " + setRoleMatch[1] + " is now " + setRoleMatch[2],
          "general"
        );
      } catch (err) {
        setSending(false);
        setError((err && err.message) || "setrole failed.");
        return;
      }
      setSending(false);
      setText("");
      return;
    }

    // /appshare slug  (built-in or user project)
    const appShareMatch = body.match(/^\/appshare\s+([a-zA-Z0-9_.-]+)\s*$/i);
    if (appShareMatch) {
      const slug = normalizeProjectSlug(appShareMatch[1]);
      const project =
        typeof UserProjects !== "undefined" ? UserProjects.getBySlug(slug) : null;
      const builtIn = typeof apps !== "undefined" && apps[slug] ? apps[slug] : null;
      if (!project && !builtIn) {
        setError(
          "App not found: " +
            slug +
            ".os — use a built-in app or one from My Projects."
        );
        return;
      }
      const title = project
        ? project.title || slug
        : builtIn.title || slug;
      const icon = project
        ? project.icon || "📦"
        : builtIn.icon || "📦";
      // Embed full source for custom apps so recipients can Launch
      const payload = project
        ? {
            slug: slug,
            title: title,
            icon: icon,
            custom: true,
            html: project.html || "",
            css: project.css || "",
            js: project.js || ""
          }
        : {
            slug: slug,
            title: title,
            icon: icon,
            custom: false
          };
      setSending(true);
      const { error: shareErr } = await client.rpc("send_chat_message", {
        p_channel: channel || "general",
        p_message: "📦 Shared app: " + title + " (" + slug + ".os)",
        p_reply_to_id: null,
        p_reply_to_author: null,
        p_reply_to_preview: null,
        p_image_url: null,
        p_embed_type: "appshare",
        p_embed_payload: payload
      });
      if (shareErr) {
        const marker =
          "📦 APP_SHARE::" +
          JSON.stringify({
            slug: payload.slug,
            title: payload.title,
            icon: payload.icon,
            custom: !!payload.custom,
            html: payload.html || undefined,
            css: payload.css || undefined,
            js: payload.js || undefined
          });
        const { error: e2 } = await client.rpc("send_chat_message", {
          p_channel: channel || "general",
          p_message: marker
        });
        setSending(false);
        if (e2) {
          setError(shareErr.message || e2.message || "Share failed.");
          return;
        }
      } else {
        setSending(false);
      }
      setText("");
      setLastSentAt(Date.now());
      return;
    }

    // /announce (admin)
    const announceMatch = body.match(/^\/announce\s+(.+)$/is);
    if (announceMatch) {
      if (!authorIsAdmin) {
        setError("Only admins can use /announce.");
        return;
      }
      setSending(true);
      await postSystem(
        client,
        session,
        authorEmail,
        "📢 " + announceMatch[1].trim(),
        channel || "general"
      );
      setSending(false);
      setText("");
      return;
    }

    // —— Normal message gates ——
    if (!canPostInChannel(channel || "general")) {
      setError("Only Admins and Developers can post in this channel.");
      return;
    }
    if (kicked && !authorIsAdmin) {
      setError("You were kicked from chat. Rejoin by reopening Chat.");
      return;
    }

    const { data: liveProf } = await client
      .from("profiles")
      .select("chat_banned, chat_muted, muted_until, mute_reason, display_name")
      .eq("user_id", session.user.id)
      .maybeSingle();
    if (liveProf) {
      setChatBanned(!!liveProf.chat_banned);
      setChatMuted(!!liveProf.chat_muted);
      setDisplayName(liveProf.display_name || displayName);
      applyMuteState(liveProf.muted_until, liveProf.mute_reason);
    }
    if (liveProf && liveProf.chat_banned && !authorIsAdmin) {
      setError("You are banned from chat.");
      return;
    }
    if (
      liveProf &&
      liveProf.muted_until &&
      new Date(liveProf.muted_until) > new Date() &&
      !authorIsAdmin
    ) {
      const secs = Math.max(
        1,
        Math.round((new Date(liveProf.muted_until) - Date.now()) / 1000)
      );
      setError(
        "You are timed out for " +
          secs +
          "s" +
          (liveProf.mute_reason ? " (" + liveProf.mute_reason + ")" : "")
      );
      return;
    }
    if (
      liveProf &&
      liveProf.chat_muted &&
      (channel || "general") === "general" &&
      !authorIsAdmin
    ) {
      setError("You are muted in public channels. You can still use DMs.");
      return;
    }

    if (!authorIsAdmin && slowmodeSec > 0) {
      const wait = slowmodeSec * 1000 - (Date.now() - lastSentAt);
      if (wait > 0) {
        setError("Slowmode: wait " + Math.ceil(wait / 1000) + "s");
        return;
      }
    }

    // /polls "question" ["a","b"] minutes
    const pollMatch = body.match(
      /^\/polls?\s+"([^"]+)"\s+(\[.*?\])\s+(\d+)\s*$/i
    );
    if (pollMatch) {
      let options = [];
      try {
        options = JSON.parse(pollMatch[2]);
      } catch (_) {
        setError('Usage: /polls "Question?" ["opt1","opt2"] 60');
        return;
      }
      if (!Array.isArray(options) || options.length < 2) {
        setError("Poll needs at least 2 options.");
        return;
      }
      options = options.map(o => String(o).slice(0, 80)).slice(0, 10);
      const mins = Math.max(1, Math.min(10080, parseInt(pollMatch[3], 10) || 60));
      const endsAt = new Date(Date.now() + mins * 60 * 1000).toISOString();
      const payload = {
        question: pollMatch[1].slice(0, 200),
        options: options,
        votes: {},
        ends_at: endsAt,
        minutes: mins
      };
      setSending(true);
      setError("");
      try {
        const { error: pollErr } = await client.rpc("send_chat_message", {
          p_channel: channel || "general",
          p_message: "📊 Poll: " + payload.question,
          p_reply_to_id: null,
          p_reply_to_author: null,
          p_reply_to_preview: null,
          p_image_url: null,
          p_embed_type: "poll",
          p_embed_payload: payload
        });
        setSending(false);
        if (pollErr) {
          setError(pollErr.message || "Poll failed.");
          return;
        }
        setText("");
        setLastSentAt(Date.now());
        return;
      } catch (err) {
        setSending(false);
        setError((err && err.message) || "Poll failed.");
        return;
      }
    }

    setSending(true);
    setError("");
    try {
      let imageUrl = null;
      let fileEmbed = null;
      if (pendingImage && pendingImage.file) {
        const f = pendingImage.file;
        // Soft client hint (real enforcement is the Edge Function)
        if (f.size > uploadByteLimit()) {
          setSending(false);
          setError(
            "File must be under " +
              Math.round(uploadByteLimit() / (1024 * 1024)) +
              " MB for your plan."
          );
          return;
        }
        try {
          const uploaded = await uploadChatMediaViaProxy(client, session, f);
          const url = uploaded.url || null;
          const isImg =
            uploaded.kind === "image" ||
            pendingImage.kind === "image" ||
            String(f.type || "").indexOf("image/") === 0;
          if (isImg) {
            imageUrl = url;
          } else {
            fileEmbed = {
              name: uploaded.name || f.name || "file",
              size: uploaded.size || f.size,
              mime: uploaded.mime || f.type || "application/octet-stream",
              url: url
            };
          }
        } catch (upErr) {
          setSending(false);
          const code = (upErr && upErr.code) || (upErr && upErr.message) || "";
          if (/upload_too_large/i.test(String(code))) {
            const mb = upErr.maxBytes
              ? Math.round(Number(upErr.maxBytes) / (1024 * 1024))
              : Math.round(uploadByteLimit() / (1024 * 1024));
            setError(
              "File too large for your plan (limit " +
                mb +
                " MB). Free 5 · Nitro 15 · Turbo 50."
            );
          } else if (/not_approved|banned|invalid_session|missing_authorization/i.test(String(code))) {
            setError("Upload blocked: " + code);
          } else {
            setError(
              (upErr && upErr.message) ||
                "Upload failed. Deploy the chat-upload Edge Function and chat-media bucket."
            );
          }
          return;
        }
      }
      const msgBody =
        body ||
        (imageUrl
          ? ""
          : fileEmbed
          ? "📎 " + fileEmbed.name
          : "");
      const { error: sendErr } = await client.rpc("send_chat_message", {
        p_channel: channel || "general",
        p_message: msgBody,
        p_reply_to_id: replyTo ? replyTo.id : null,
        p_reply_to_author: replyTo ? replyTo.author : null,
        p_reply_to_preview: replyTo ? replyTo.preview : null,
        p_image_url: imageUrl,
        p_embed_type: fileEmbed ? "file" : null,
        p_embed_payload: fileEmbed
      });
      if (sendErr) {
        setSending(false);
        const msg = sendErr.message || "";
        if (/banned/i.test(msg)) setError("You are banned from chat.");
        else if (/timed_out|timeout/i.test(msg)) setError("You are timed out.");
        else if (/muted/i.test(msg)) setError("You are muted in public channels.");
        else if (/slowmode/i.test(msg)) setError("Slowmode active — wait a moment.");
        else if (/not_approved/i.test(msg)) setError("Your account is not approved.");
        else if (/rate_limited/i.test(msg)) setError("You are sending messages too quickly. Slow down.");
        else if (/channel_forbidden|forbidden/i.test(msg)) setError("You cannot access this channel.");
        else if (/channel_readonly/i.test(msg)) setError("This channel is read-only for your role.");
        else if (/not_activated/i.test(msg)) setError("Activate your account before chatting.");
        else setError(msg || "Failed to send. Deploy send_chat_message RPC.");
        return;
      }
      // Silent reply ping (no @ in body)
      if (replyTo && replyTo.author) {
        const target = String(replyTo.author).toLowerCase();
        if (target && target !== authorEmail) {
          try {
            await notifyUser(
              client,
              target,
              "Reply",
              (displayName || authorEmail) +
                " replied to you: " +
                String(body || "").slice(0, 120),
              "ping"
            );
          } catch (_) {}
        }
      } else {
        try {
          await createSupabaseNotificationsForPings(client, session, body);
        } catch (_) {}
      }
    } catch (err) {
      setSending(false);
      setError((err && err.message) || "Failed to send.");
      return;
    }
    setSending(false);
    setLastSentAt(Date.now());
    setReplyTo(null);
    if (pendingImage && pendingImage.preview) {
      try { URL.revokeObjectURL(pendingImage.preview); } catch (_) {}

          authorEmail + ": " + body.slice(0, 140),
          "dm"
        );
      }
    }
