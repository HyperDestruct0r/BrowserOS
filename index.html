function AdminApprovalsApp() {
  const [rows, setRows] = useState([]);
  const [error, setError] = useState("");
  const [info, setInfo] = useState("");
  const [busyId, setBusyId] = useState(null);
  const [loading, setLoading] = useState(true);
  const [isAdmin, setIsAdmin] = useState(false);
  const [audit, setAudit] = useState([]);
  const [approveAccessPreset, setApproveAccessPreset] = useState("never");
  const [editExpiry, setEditExpiry] = useState({}); // userId -> { access, nitro }
  const [actRequests, setActRequests] = useState([]);
  const [subRequests, setSubRequests] = useState([]);
  const channelRef = useRef(null);

  const load = async () => {
    setError("");
    setLoading(true);
    const client = getSupabaseClient();
    if (!client) {
      setError("Supabase not configured.");
      setLoading(false);
      return;
    }

    // Refresh admin flag from session + profile
    try {
      const { data: sessionData } = await client.auth.getSession();
      const session = sessionData && sessionData.session;
      const email = session && session.user && session.user.email;
      let profile = window.__browserOSProfile;
      if (session && session.user) {
        try {
          profile = await ensureUserProfile(client, session.user);
        } catch (_) {}
      }
      const adminOk = !!(
        (profile && (profile.is_admin || profile.is_dev)) ||
        isConfiguredAdminEmail(email)
      );
      setIsAdmin(adminOk);
      if (!adminOk) {
        setLoading(false);
        setError("You need administrator privileges to manage registrations.");
        return;
      }
    } catch (_) {}

    const { data, error: qErr } = await client
      .from("profiles")
      .select("user_id, email, status, is_admin, is_dev, is_nitro, created_at, muted_until, access_expires_at, nitro_expires_at")
      .order("created_at", { ascending: false });
    setLoading(false);
    if (qErr) {
      setError(
        qErr.message ||
          "Failed to load profiles. Check RLS: admins need SELECT on all profiles (is_browseros_admin)."
      );
      setRows([]);
      return;
    }
    setRows(data || []);
    if (!(data || []).length) {
      setInfo(
        "No profiles yet. New registrations appear after the auth trigger creates a profiles row."
      );
    } else {
      setInfo("");
    }

    try {
      const { data: logs } = await client
        .from("admin_audit")
        .select("id, actor_email, action, target, detail, created_at")
        .order("created_at", { ascending: false })
        .limit(50);
      setAudit(logs || []);
    } catch (_) {
      setAudit([]);
    }

    try {
      const { data: reqs } = await client
        .from("activation_requests")
        .select("id, email, plan, coupon_code, discount_percent, status, created_at")
        .order("created_at", { ascending: false })
        .limit(40);
      setActRequests(reqs || []);
    } catch (_) {
      setActRequests([]);
    }

    try {
      const { data: subs } = await client
        .from("subscription_requests")
        .select("id, email, plan, status, created_at, reviewed_at, reviewed_by")
        .order("created_at", { ascending: false })
        .limit(50);
      setSubRequests(subs || []);
    } catch (_) {
      setSubRequests([]);
    }
  };

  useEffect(() => {
    load();
    const client = getSupabaseClient();
    if (!client) return;
    const channel = client
      .channel("admin-profiles")
      .on(
        "postgres_changes",
        { event: "*", schema: "public", table: "profiles" },
        () => {
          load();
        }
      )
      .subscribe();
    channelRef.current = channel;
    return () => {
      if (channelRef.current) {
        client.removeChannel(channelRef.current);
        channelRef.current = null;
      }
    };
  }, []);

  const setStatus = async (userId, status, accessPreset) => {
    setBusyId(userId);
    setInfo("");
    setError("");
    const client = getSupabaseClient();
    const row = rows.find(r => r.user_id === userId);
    const email = row && row.email;
    if (email && isPrimaryOwnerEmail(email)) {
      setBusyId(null);
      setError("Cannot modify the primary Owner account.");
      return;
    }
    const accessIso =
      status === "approved"
        ? computeExpiryIso(accessPreset || approveAccessPreset)
        : null;
    // Optimistic UI: drop from pending immediately on reject/approve
    setRows(prev =>
      prev.map(r =>
        r.user_id === userId
          ? {
              ...r,
              status,
              access_expires_at:
                status === "approved" ? accessIso : r.access_expires_at
            }
          : r
      )
    );
    let uErr = null;
    if (!email) {
      uErr = { message: "Missing user email — cannot change status without server RPC." };
    } else {
      let res = await client.rpc("admin_set_status", {
        target_email: email,
        new_status: status,
        access_expires_at: accessIso
      });
      uErr = res.error;
      if (uErr) {
        res = await client.rpc("admin_set_status", {
          target_email: email,
          new_status: status
        });
        uErr = res.error;
        if (!uErr && accessIso) {
          const exp = await client.rpc("admin_set_expiry", {
            target_email: email,
            access_expires_at: accessIso,
            nitro_expires_at: null,
            set_access: true,
            set_nitro: false
          });
          if (exp.error) console.warn("admin_set_expiry:", exp.error.message || exp.error);
        }
      }
    }
    setBusyId(null);
    if (uErr) {
      setError(uErr.message || "Update failed.");
      load();
      return;
    }
    setInfo(
      status === "rejected"
        ? "Rejected " + (email || "user") + " — removed from pending."
        : "Updated " + (email || "user") + " → " + status + "."
    );
    // Soft refresh without bringing rejected back into pending
    load();
  };

  const applyExpiry = async (userId, kind, preset) => {
    const row = rows.find(r => r.user_id === userId);
    if (!row || !row.email) return;
    if (isPrimaryOwnerEmail(row.email)) {
      setError("Cannot modify the primary Owner account.");
      return;
    }
    const iso = computeExpiryIso(preset);
    setBusyId(userId);
    const client = getSupabaseClient();
    const payload =
      kind === "access"
        ? { access_expires_at: iso }
        : {
            nitro_expires_at: iso,
            is_nitro: preset === "never" || iso ? true : row.is_nitro
          };
    if (kind === "nitro" && preset !== "never" && iso) {
      payload.is_nitro = true;
    }
    if (kind === "nitro" && preset === "never") {
      payload.is_nitro = true;
      payload.nitro_expires_at = null;
    }
    const { error: rpcErr } = await client.rpc("admin_set_expiry", {
      target_email: row.email,
      access_expires_at: kind === "access" ? iso : null,
      nitro_expires_at: kind === "nitro" ? iso : null,
      set_access: kind === "access",
      set_nitro: kind === "nitro"
    });
    if (rpcErr) {
      setBusyId(null);
      setError(
        (rpcErr.message || "Could not set expiry.") +
          " Server authorization required — direct profile writes are disabled."
      );
      return;
    }
    setBusyId(null);
    setInfo("Updated " + kind + " expiry for " + row.email);
    setRows(prev =>
      prev.map(r => (r.user_id === userId ? { ...r, ...payload } : r))
    );
  };

  const removeMember = async (row) => {
    if (!row || !row.user_id) return;
    if (row.is_admin) {
      setError("You cannot remove an admin account from here.");
      return;
    }
    const ok = confirm(
      "Remove member " +
        (row.email || row.user_id) +
        "?\n\nThey will be rejected and blocked from BrowserOS.\n" +
        "To fully delete their Auth login, remove them under Authentication → Users in Supabase."
    );
    if (!ok) return;

    setBusyId(row.user_id);
    setInfo("");
    setError("");
    const client = getSupabaseClient();
    let uErr = null;
    if (row.email) {
      const res = await client.rpc("admin_set_status", {
        target_email: row.email,
        new_status: "rejected"
      });
      uErr = res.error;
    } else {
      uErr = { message: "Missing email — cannot remove without server RPC." };
    }
    setBusyId(null);
    if (uErr) {
      setError(
        (uErr.message || "Remove failed.") +
          " Direct profile privilege writes are disabled."
      );
      return;
    }
    setInfo("Removed " + (row.email || "member") + " (status: rejected).");
    setRows(prev =>
      prev.map(r =>
        r.user_id === row.user_id ? { ...r, status: "rejected", is_admin: false } : r
      )
    );
    load();
  };

  const reviewSubscription = async (id, approve) => {
    setBusyId(id);
    setError("");
    setInfo("");
    const client = getSupabaseClient();
    if (!client) {
      setBusyId(null);
      return;
    }
    try {
      const { error: err } = await client.rpc("admin_review_subscription", {
        p_id: id,
        p_approve: !!approve
      });
      if (err) throw err;
      setInfo(approve ? "Subscription approved (1 month)." : "Subscription denied.");
      setSubRequests(prev =>
        prev.map(r =>
          r.id === id
            ? {
                ...r,
                status: approve ? "approved" : "denied",
                reviewed_at: new Date().toISOString()
              }
            : r
        )
      );
      load();
    } catch (e) {
      setError((e && e.message) || "Review failed. Deploy subscription_requests SQL.");
    }
    setBusyId(null);
  };

  if (!isAdmin) {
    return (
      <div className="internal" style={{ padding: 24 }}>
        <h2>Admin</h2>
        <p style={{ color: "var(--text-muted)" }}>
          {error ||
            "You need administrator privileges to manage registrations."}
        </p>
        <button type="button" className="notes-btn" onClick={load}>
          Retry
        </button>
      </div>
    );
  }

  const pending = rows.filter(
    r => String(r.status || "").toLowerCase() === "pending"
  );
  const others = rows.filter(
    r => String(r.status || "").toLowerCase() !== "pending"
  );

  return (
    <div className="internal" style={{ padding: 24, maxWidth: 640 }}>
      <h2 style={{ margin: "0 0 6px", fontSize: 22, fontWeight: 800 }}>
        Registration approvals
      </h2>
      <p style={{ color: "var(--text-muted)", fontSize: 13, marginBottom: 16 }}>
        Approve or reject users who requested BrowserOS access.
        {loading ? " Loading…" : " " + rows.length + " total profile(s)."}
      </p>
      <button type="button" className="notes-btn" onClick={load} style={{ marginBottom: 14 }}>
        Refresh
      </button>
      {error && <div style={{ color: "var(--danger)", fontSize: 13, marginBottom: 8 }}>{error}</div>}
      {info && <div style={{ color: "var(--accent)", fontSize: 13, marginBottom: 8 }}>{info}</div>}

      <h3 style={{ fontSize: 14, margin: "12px 0 8px" }}>
        Nitro / Turbo requests (
        {subRequests.filter(r => r.status === "pending").length})
      </h3>
      {subRequests.filter(r => r.status === "pending").length === 0 && (
        <div style={{ fontSize: 12, color: "var(--text-muted)", marginBottom: 10 }}>
          No pending Nitro or Turbo requests.
        </div>
      )}
      {subRequests.filter(r => r.status === "pending").map(r => (
        <div
          key={r.id}
          style={{
            display: "flex",
            alignItems: "center",
            gap: 10,
            flexWrap: "wrap",
            padding: 12,
            borderRadius: 10,
            border: "1px solid var(--border)",
            background: "var(--surface)",
            marginBottom: 8
          }}
        >
          <div style={{ flex: 1, minWidth: 140 }}>
            <div style={{ fontWeight: 700, fontSize: 13 }}>{r.email}</div>
            <div style={{ fontSize: 11, color: "var(--text-muted)" }}>
              {String(r.plan || "").toUpperCase()} · $
              {r.plan === "turbo" ? "1.99" : "0.99"}/mo · 1 month if approved
              {" · "}
              {r.created_at ? new Date(r.created_at).toLocaleString() : ""}
            </div>
          </div>
          <button
            type="button"
            className="notes-btn"
            style={{ fontWeight: 700, color: "var(--accent)" }}
            disabled={busyId === r.id}
            onClick={() => reviewSubscription(r.id, true)}
          >
            Approve
          </button>
          <button
            type="button"
            className="notes-btn"
            style={{ color: "var(--danger)" }}
            disabled={busyId === r.id}
            onClick={() => reviewSubscription(r.id, false)}
          >
            Deny
          </button>
        </div>
      ))}

      <h3 style={{ fontSize: 14, margin: "12px 0 8px" }}>
        Activation requests ({actRequests.filter(r => r.status === "pending").length})
      </h3>
      {actRequests.filter(r => r.status === "pending").map(r => (
        <div
          key={r.id}
          style={{
            display: "flex",
            alignItems: "center",
            gap: 10,
            flexWrap: "wrap",
            padding: 12,
            borderRadius: 10,
            border: "1px solid var(--border)",
            background: "var(--surface)",
            marginBottom: 8
          }}
        >
          <div style={{ flex: 1, minWidth: 140 }}>
            <div style={{ fontWeight: 700, fontSize: 13 }}>{r.email}</div>
            <div style={{ fontSize: 11, color: "var(--text-muted)" }}>
              {r.plan}
              {r.coupon_code ? " · coupon " + r.coupon_code + " (" + (r.discount_percent || 0) + "%)" : ""}
              {" · "}
              {r.created_at ? new Date(r.created_at).toLocaleString() : ""}
            </div>
          </div>
          <button
            type="button"
            className="notes-btn"
            disabled={busyId === r.id}
            onClick={async () => {
              const client = getSupabaseClient();
              if (!client) return;
              setBusyId(r.id);
              const access =
                r.plan === "trial_7d" ? "trial_7d" : "month_1";
              const { error: err } = await client.rpc("admin_activate_user", {
                target_email: r.email,
                access_type: access
              });
              setBusyId(null);
              if (err) setError(err.message || "Activate failed.");
              else {
                setInfo("Activated " + r.email);
                load();
              }
            }}
          >
            Fulfill
          </button>
          <button
            type="button"
            className="notes-btn"
            disabled={busyId === r.id}
            onClick={async () => {
              const client = getSupabaseClient();
              if (!client) return;
              setBusyId(r.id);
              const { error: err } = await client.rpc("admin_activate_user", {
                target_email: r.email,
                access_type: "permanent"
              });
              setBusyId(null);
              if (err) setError(err.message || "Activate failed.");
              else {
                setInfo("Permanent access for " + r.email);
                load();
              }
            }}
          >
            Permanent
          </button>
        </div>
      ))}

      <h3 style={{ fontSize: 14, margin: "12px 0 8px" }}>Pending ({pending.length})</h3>
      <div style={{ fontSize: 12, color: "var(--text-muted)", marginBottom: 8 }}>
        Default access length when approving:{" "}
        <select
          value={approveAccessPreset}
          onChange={e => setApproveAccessPreset(e.target.value)}
          style={{
            fontSize: 12,
            padding: "4px 8px",
            borderRadius: 8,
            border: "1px solid var(--border)",
            background: "var(--surface2)",
            color: "var(--text)"
          }}
        >
          <option value="never">Never (permanent)</option>
          <option value="1d">1 Day</option>
          <option value="7d">7 Days</option>
          <option value="30d">30 Days</option>
        </select>
      </div>
      {!pending.length && (
        <div style={{ fontSize: 13, color: "var(--text-muted)", marginBottom: 16 }}>
          No pending requests.
        </div>
      )}
      {pending.map(r => (
        <div
          key={r.user_id}
          style={{
            display: "flex",
            alignItems: "center",
            gap: 10,
            flexWrap: "wrap",
            padding: 12,
            borderRadius: 10,
            border: "1px solid var(--border)",
            background: "var(--surface)",
            marginBottom: 8
          }}
        >
          <div style={{ flex: 1, minWidth: 140 }}>
            <div style={{ fontWeight: 700, fontSize: 13 }}>{r.email}</div>
            <div style={{ fontSize: 11, color: "var(--text-muted)" }}>
              {r.created_at ? new Date(r.created_at).toLocaleString() : ""}
            </div>
          </div>
          <button
            type="button"
            className="notes-btn"
            disabled={busyId === r.user_id}
            onClick={() => setStatus(r.user_id, "approved", approveAccessPreset)}
          >
            Approve
          </button>
          <button
            type="button"
            className="notes-btn"
            style={{ color: "var(--danger)" }}
            disabled={busyId === r.user_id}
            onClick={() => setStatus(r.user_id, "rejected")}
          >
            Reject
          </button>
        </div>
      ))}

      <h3 style={{ fontSize: 14, margin: "20px 0 8px" }}>All users</h3>
      {others.map(r => (
        <div
          key={r.user_id}
          style={{
            display: "flex",
            justifyContent: "space-between",
            alignItems: "center",
            gap: 8,
            flexWrap: "wrap",
            padding: "10px 0",
            borderBottom: "1px solid var(--border)",
            fontSize: 12
          }}
        >
          <span style={{ flex: 1, minWidth: 160 }}>
            <div>
              {r.email}
              {isPrimaryOwnerEmail(r.email) ? (
                <span
                  style={{
                    marginLeft: 8,
                    fontWeight: 800,
                    color: "#facc15",
                    letterSpacing: "0.04em"
                  }}
                >
                  · Owner
                </span>
              ) : (
                <>
                  {r.is_admin ? " · admin" : ""}
                  {r.is_dev ? " · dev" : ""}
                  {r.is_nitro ? " · nitro" : ""}
                  {" · "}
                  <span style={{ color: "var(--text-muted)" }}>{r.status}</span>
                </>
              )}
            </div>
            <div style={{ fontSize: 10, color: "var(--text-muted)", marginTop: 2 }}>
              {isPrimaryOwnerEmail(r.email) ? (
                <span style={{ color: "#facc15", fontWeight: 700 }}>
                  Access: Owner · Turbo: Owner
                </span>
              ) : (
                <>
                  Access:{" "}
                  {r.access_expires_at
                    ? new Date(r.access_expires_at).toLocaleString()
                    : "permanent"}
                  {" · Nitro: "}
                  {r.nitro_expires_at
                    ? new Date(r.nitro_expires_at).toLocaleString()
                    : r.is_nitro
                    ? "permanent"
                    : "—"}
                </>
              )}
            </div>
          </span>
          <span style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center" }}>
            {isPrimaryOwnerEmail(r.email) ? (
              <span
                style={{
                  fontSize: 11,
                  fontWeight: 800,
                  color: "#facc15",
                  padding: "4px 10px",
                  borderRadius: 8,
                  border: "1px solid rgba(250,204,21,0.45)",
                  background: "rgba(245,158,11,0.12)"
                }}
              >
                Owner
              </span>
            ) : (
              <>
            <select
              title="Access expiry"
              defaultValue=""
              disabled={busyId === r.user_id}
              onChange={e => {
                const v = e.target.value;
                e.target.value = "";
                if (!v) return;
                applyExpiry(r.user_id, "access", v);
              }}
              style={{ fontSize: 11, padding: "4px 6px", borderRadius: 8 }}
            >
              <option value="">Access…</option>
              <option value="never">Permanent access</option>
              <option value="1d">Access 1 day</option>
              <option value="7d">Access 7 days</option>
              <option value="30d">Access 30 days</option>
            </select>
            <select
              title="Nitro expiry"
              defaultValue=""
              disabled={busyId === r.user_id}
              onChange={e => {
                const v = e.target.value;
                e.target.value = "";
                if (!v) return;
                applyExpiry(r.user_id, "nitro", v);
              }}
              style={{ fontSize: 11, padding: "4px 6px", borderRadius: 8 }}
            >
              <option value="">Nitro…</option>
              <option value="never">Permanent Nitro</option>
              <option value="1d">Nitro 1 day</option>
              <option value="7d">Nitro 7 days</option>
              <option value="30d">Nitro 30 days</option>
            </select>
              </>
            )}
            {!isPrimaryOwnerEmail(r.email) && r.status !== "approved" && !r.is_admin && (
              <button
                type="button"
                className="notes-btn"
                disabled={busyId === r.user_id}
                onClick={() => setStatus(r.user_id, "approved", approveAccessPreset)}
              >
                Approve
              </button>
            )}
            {!isPrimaryOwnerEmail(r.email) && r.status === "approved" && !r.is_admin && (
              <button
                type="button"
                className="notes-btn"
                style={{ color: "var(--danger)" }}
                disabled={busyId === r.user_id}
                onClick={() => setStatus(r.user_id, "rejected")}
              >
                Revoke
              </button>
            )}
            {!isPrimaryOwnerEmail(r.email) && !r.is_admin && (
              <button
                type="button"
                className="notes-btn"
                style={{ color: "var(--danger)" }}
                disabled={busyId === r.user_id}
                onClick={() => removeMember(r)}
              >
                Remove
              </button>
            )}
          </span>
        </div>
      ))}


      <h3 style={{ fontSize: 14, margin: "28px 0 8px" }}>Activation codes</h3>
      <p style={{ fontSize: 12, color: "var(--text-muted)", marginBottom: 10 }}>
        Generate single-use codes for 7-day trial, 1-month, or permanent access.
      </p>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 12 }}>
        {[
          { id: "trial_7d", label: "7-Day Trial" },
          { id: "month_1", label: "1-Month" },
          { id: "permanent", label: "Permanent" }
        ].map(opt => (
          <button
            key={opt.id}
            type="button"
            className="notes-btn"
            disabled={!!busyId}
            onClick={async () => {
              setError("");
              setInfo("");
              const client = getSupabaseClient();
              if (!client) return;
              setBusyId("codegen");
              const { data, error: err } = await client.rpc("admin_create_activation_code", {
                p_access_type: opt.id
              });
              setBusyId(null);
              if (err) {
                setError(err.message || "Could not create code.");
                return;
              }
              setInfo("Code created: " + (data && data.code) + " (" + opt.label + ") — copy and send to the user.");
              try {
                if (data && data.code && navigator.clipboard) {
                  await navigator.clipboard.writeText(data.code);
                }
              } catch (_) {}
            }}
          >
            Generate {opt.label}
          </button>
        ))}
      </div>

      <h3 style={{ fontSize: 14, margin: "24px 0 8px" }}>
        Audit log ({audit.length})
      </h3>
      <p style={{ fontSize: 12, color: "var(--text-muted)", marginBottom: 10 }}>
        Server-side record of moderation actions (ban, timeout, approve, …).
      </p>
      {!audit.length && (
        <div style={{ fontSize: 12, color: "var(--text-muted)" }}>
          No audit entries yet.
        </div>
      )}
      {audit.map(a => (
        <div
          key={a.id}
          style={{
            fontSize: 12,
            padding: "8px 0",
            borderBottom: "1px solid var(--border)",
            display: "flex",
            flexDirection: "column",
            gap: 2
          }}
        >
          <div>
            <strong>{a.action}</strong>
            {a.target ? " → " + a.target : ""}
            {a.detail ? " · " + a.detail : ""}
          </div>
          <div style={{ color: "var(--text-muted)" }}>
            {a.actor_email || "admin"}
            {a.created_at
              ? " · " + new Date(a.created_at).toLocaleString()
              : ""}
          </div>
        </div>
      ))}
    </div>
  );
}


/** Chrome-style offline dinosaur runner — shown when BrowserOS has no network. */
function OfflineDinoGame({ onOnline }) {
  const canvasRef = useRef(null);
  const [score, setScore] = useState(0);
  const [hi, setHi] = useState(() => {
    try {
      return parseInt(localStorage.getItem("browserOS_dino_hi") || "0", 10) || 0;
    } catch (_) {
      return 0;
    }
  });
  const [night, setNight] = useState(false);
  const [status, setStatus] = useState("Press Space or tap to start");

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const W = 700;
    const H = 200;
    canvas.width = W;
    canvas.height = H;

    const groundY = 160;
    let dino = { x: 48, y: groundY, vy: 0, w: 44, h: 48, duck: false, onGround: true };
    let obstacles = [];
    let clouds = [
      { x: 120, y: 40, s: 1 },
      { x: 360, y: 28, s: 0.8 },
      { x: 560, y: 50, s: 1.1 }
    ];
    let speed = 6;
    let frame = 0;
    let running = false;
    let dead = false;
    let sc = 0;
    let spawnTimer = 0;
    let raf = 0;
    let groundOffset = 0;

    const gravity = 0.7;
    const jumpV = -12;

    function reset() {
      dino = { x: 48, y: groundY, vy: 0, w: 44, h: 48, duck: false, onGround: true };
      obstacles = [];
      speed = 6;
      frame = 0;
      running = true;
      dead = false;
      sc = 0;
      spawnTimer = 60;
      setStatus("Running — Space/↑ jump · ↓ duck");
      setScore(0);
      setNight(false);
    }

    function spawnObstacle() {
      const roll = Math.random();
      if (sc > 400 && roll > 0.65) {
        // pterodactyl
        obstacles.push({
          type: "bird",
          x: W + 20,
          y: groundY - (Math.random() > 0.5 ? 55 : 20),
          w: 42,
          h: 28
        });
      } else {
        const tall = Math.random() > 0.55;
        const pair = Math.random() > 0.75;
        const h = tall ? 48 : 32;
        const w = tall ? 18 : 14;
        obstacles.push({ type: "cactus", x: W + 10, y: groundY - h + 48, w, h });
        if (pair) {
          obstacles.push({
            type: "cactus",
            x: W + 28,
            y: groundY - 32 + 48,
            w: 14,
            h: 32
          });
        }
      }
    }

    function hitTest() {
      const pad = 6;
      const dy = dino.duck ? 20 : 0;
      const dh = dino.duck ? dino.h - 18 : dino.h;
      const box = {
        x: dino.x + pad,
        y: dino.y - dh + dy + pad,
        w: dino.w - pad * 2,
        h: dh - pad * 2
      };
      for (let i = 0; i < obstacles.length; i++) {
        const o = obstacles[i];
        if (
          box.x < o.x + o.w - 4 &&
          box.x + box.w > o.x + 4 &&
          box.y < o.y + o.h - 4 &&
          box.y + box.h > o.y + 4
        ) {
          return true;
        }
      }
      return false;
    }

    function drawDino() {
      ctx.fillStyle = nightMode() ? "#e0e0e0" : "#535353";
      const duck = dino.duck && dino.onGround;
      const feet = Math.floor(frame / 6) % 2;
      if (duck) {
        ctx.fillRect(dino.x, dino.y - 22, 52, 22);
        ctx.fillRect(dino.x + 40, dino.y - 30, 14, 10);
      } else {
        ctx.fillRect(dino.x + 8, dino.y - 40, 28, 30);
        ctx.fillRect(dino.x + 28, dino.y - 52, 18, 16);
        ctx.fillRect(dino.x + 36, dino.y - 48, 4, 4);
        if (dino.onGround) {
          if (feet === 0) {
            ctx.fillRect(dino.x + 12, dino.y - 10, 8, 10);
            ctx.fillRect(dino.x + 26, dino.y - 10, 8, 10);
          } else {
            ctx.fillRect(dino.x + 10, dino.y - 10, 8, 10);
            ctx.fillRect(dino.x + 28, dino.y - 10, 8, 10);
          }
        } else {
          ctx.fillRect(dino.x + 12, dino.y - 14, 8, 12);
          ctx.fillRect(dino.x + 26, dino.y - 14, 8, 12);
        }
        ctx.fillRect(dino.x + 4, dino.y - 34, 8, 6);
      }
    }

    function nightMode() {
      return sc >= 700 && Math.floor(sc / 700) % 2 === 1;
    }

    function draw() {
      const nm = nightMode();
      ctx.fillStyle = nm ? "#1a1a1a" : "#f7f7f7";
      ctx.fillRect(0, 0, W, H);

      // clouds
      ctx.fillStyle = nm ? "#3a3a3a" : "#dadce0";
      clouds.forEach(c => {
        ctx.fillRect(c.x, c.y, 46 * c.s, 14 * c.s);
        ctx.fillRect(c.x + 12 * c.s, c.y - 8 * c.s, 28 * c.s, 12 * c.s);
      });

      // ground
      ctx.strokeStyle = nm ? "#666" : "#535353";
      ctx.beginPath();
      ctx.moveTo(0, groundY + 8);
      ctx.lineTo(W, groundY + 8);
      ctx.stroke();
      ctx.fillStyle = nm ? "#666" : "#535353";
      for (let x = -((groundOffset | 0) % 24); x < W; x += 24) {
        ctx.fillRect(x, groundY + 10, 12, 2);
      }

      // obstacles
      obstacles.forEach(o => {
        ctx.fillStyle = nm ? "#e0e0e0" : "#535353";
        if (o.type === "bird") {
          const flap = Math.floor(frame / 8) % 2;
          ctx.fillRect(o.x, o.y + 8, 36, 10);
          ctx.fillRect(o.x + 8, o.y + (flap ? 0 : 14), 16, 10);
        } else {
          ctx.fillRect(o.x, o.y, o.w, o.h);
          ctx.fillRect(o.x - 4, o.y + 10, o.w + 8, 6);
        }
      });

      drawDino();

      // score on canvas
      ctx.fillStyle = nm ? "#e0e0e0" : "#535353";
      ctx.font = "bold 14px Courier New, monospace";
      ctx.textAlign = "right";
      ctx.fillText(String(Math.floor(sc)).padStart(5, "0"), W - 12, 24);
      if (hi > 0) {
        ctx.fillText("HI " + String(hi).padStart(5, "0"), W - 12, 42);
      }

      if (dead) {
        ctx.textAlign = "center";
        ctx.font = "bold 18px Courier New, monospace";
        ctx.fillText("G A M E  O V E R", W / 2, 80);
        ctx.font = "12px Courier New, monospace";
        ctx.fillText("Press Space or tap to restart", W / 2, 104);
      } else if (!running) {
        ctx.textAlign = "center";
        ctx.font = "12px Courier New, monospace";
        ctx.fillText("Press Space or tap to start", W / 2, 90);
      }
    }

    function tick() {
      frame++;
      const nm = nightMode();
      if (nm !== night) setNight(nm);

      if (running && !dead) {
        groundOffset += speed;
        clouds.forEach(c => {
          c.x -= speed * 0.15 * c.s;
          if (c.x < -60) c.x = W + Math.random() * 100;
        });

        dino.vy += gravity;
        dino.y += dino.vy;
        if (dino.y >= groundY) {
          dino.y = groundY;
          dino.vy = 0;
          dino.onGround = true;
        } else {
          dino.onGround = false;
        }

        spawnTimer--;
        if (spawnTimer <= 0) {
          spawnObstacle();
          spawnTimer = 50 + Math.random() * 70 - Math.min(30, sc / 50);
        }

        obstacles.forEach(o => {
          o.x -= speed;
        });
        obstacles = obstacles.filter(o => o.x + o.w > -20);

        sc += 0.15;
        if (Math.floor(sc) !== Math.floor(sc - 0.15)) {
          setScore(Math.floor(sc));
        }
        if (frame % 120 === 0) speed = Math.min(13, speed + 0.15);

        if (hitTest()) {
          dead = true;
          running = false;
          setStatus("Game over — Space or tap to restart");
          const final = Math.floor(sc);
          setScore(final);
          if (final > hi) {
            setHi(final);
            try {
              localStorage.setItem("browserOS_dino_hi", String(final));
            } catch (_) {}
          }
        }
      }

      draw();
      raf = requestAnimationFrame(tick);
    }

    function jump() {
      if (dead || !running) {
        reset();
        return;
      }
      if (dino.onGround) {
        dino.vy = jumpV;
        dino.onGround = false;
        dino.duck = false;
      }
    }

    function onKey(e) {
      if (e.code === "Space" || e.code === "ArrowUp") {
        e.preventDefault();
        jump();
      } else if (e.code === "ArrowDown") {
        e.preventDefault();
        if (running && !dead) dino.duck = true;
      }
    }
    function onKeyUp(e) {
      if (e.code === "ArrowDown") dino.duck = false;
    }
    function onPointer() {
      jump();
    }

    window.addEventListener("keydown", onKey);
    window.addEventListener("keyup", onKeyUp);
    canvas.addEventListener("pointerdown", onPointer);
    raf = requestAnimationFrame(tick);
    draw();

    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener("keydown", onKey);
      window.removeEventListener("keyup", onKeyUp);
      canvas.removeEventListener("pointerdown", onPointer);
    };
  }, []);

  return (
    <div className={"offline-dino-screen" + (night ? " night" : "")}>
      <div className="offline-dino-title">BrowserOS · Offline</div>
      <canvas ref={canvasRef} className="offline-dino-canvas" width={700} height={200} />
      <div className="offline-dino-bar">
        <span>Score {score}</span>
        <span>HI {hi}</span>
      </div>
      <div className="offline-dino-hint">
        No internet connection. Play the desert runner until you&apos;re back online.
        <br />
        {status}
      </div>
      {typeof onOnline === "function" && (
        <button type="button" className="offline-dino-online-btn" onClick={onOnline}>
          I&apos;m online — continue to BrowserOS
        </button>
      )}
    </div>
  );
}


function Root() {
  const [unlocked, setUnlocked] = useState(false);
  const [rejectedProfile, setRejectedProfile] = useState(null);
  const [pendingProfile, setPendingProfile] = useState(null);
  const [revokeMsg, setRevokeMsg] = useState("");
  const [staleClient, setStaleClient] = useState(null); // { message } when build token mismatch
  const [recoveryOpen, setRecoveryOpen] = useState(false);
  const [newPw, setNewPw] = useState("");
  const [newPw2, setNewPw2] = useState("");
  const [recoveryErr, setRecoveryErr] = useState("");
  const [recoveryBusy, setRecoveryBusy] = useState(false);
  const [accessExpired, setAccessExpired] = useState(false);
  const [needsActivation, setNeedsActivation] = useState(null); // profile waiting for plan/code
  const [offlineMode, setOfflineMode] = useState(() => {
    try {
      return typeof navigator !== "undefined" && navigator.onLine === false;
    } catch (_) {
      return false;
    }
  });

  useEffect(() => {
    const goOff = () => setOfflineMode(true);
    const goOn = () => setOfflineMode(false);
    window.addEventListener("offline", goOff);
    window.addEventListener("online", goOn);
    return () => {
      window.removeEventListener("offline", goOff);
      window.removeEventListener("online", goOn);
    };
  }, []);

  // Critical update gate: poll server build token while online
  useEffect(() => {
    let cancelled = false;
    const enforce = async () => {
      if (typeof navigator !== "undefined" && navigator.onLine === false) return;
      if (typeof checkClientBuildFreshness !== "function") return;
      try {
        const result = await checkClientBuildFreshness();
        if (cancelled || !result || result.ok) {
          if (!cancelled && result && result.ok) setStaleClient(null);
          return;
        }
        setStaleClient({ message: result.message });
        setUnlocked(false);
        setPendingProfile(null);
        setNeedsActivation(null);
        window.__browserOSProfile = null;
        try {
          const client = getSupabaseClient();
          if (client) await client.auth.signOut({ scope: "local" });
        } catch (_) {}
      } catch (_) {}
    };
    enforce();
    const id = setInterval(enforce, 5 * 60 * 1000); // every 5 minutes
    const onFocus = () => enforce();
    window.addEventListener("focus", onFocus);
    return () => {
      cancelled = true;
      clearInterval(id);
      window.removeEventListener("focus", onFocus);
    };
  }, []);

  useEffect(() => {
    const client = getSupabaseClient();
    if (client) {
      client.auth.signOut({ scope: "local" }).catch(() => {});
    }
    try {
      Object.keys(localStorage)
        .filter(k => k.startsWith("sb-") && k.includes("auth-token"))
        .forEach(k => localStorage.removeItem(k));
    } catch (_) {}
    window.__browserOSProfile = null;
  }, []);

  // Password recovery from email link
  useEffect(() => {
    const client = getSupabaseClient();
    if (!client) return;
    const { data } = client.auth.onAuthStateChange((event) => {
      if (event === "PASSWORD_RECOVERY") {
        setRecoveryOpen(true);
        setUnlocked(false);
      }
    });
    return () => {
      try { data.subscription.unsubscribe(); } catch (_) {}
    };
  }, []);

  // Timed access / nitro expiry polling
  useEffect(() => {
    if (!unlocked) return;
    let cancelled = false;
    const tick = async () => {
      const client = getSupabaseClient();
      if (!client) return;
      try {
        const { data: sessionData } = await client.auth.getSession();
        const session = sessionData && sessionData.session;
        if (!session || cancelled) return;
        let profile = await ensureUserProfile(client, session.user);
        profile = applyProfileExpirations(profile, client);
        window.__browserOSProfile = profile;
        try {
          refreshServerEntitlements();
        } catch (_) {}
        if (profile && profile._accessExpired) {
          setAccessExpired(true);
          setUnlocked(false);
          await client.auth.signOut({ scope: "local" }).catch(() => {});
          return;
        }
        if (profile && profile._nitroExpiredToast) {
          profile._nitroExpiredToast = false;
          if (typeof browserOSNotify === "function") {
            browserOSNotify({
              title: "Nitro expired",
              body: "Your BrowserOS Nitro access has expired."
            });
          }
        }
      } catch (_) {}
    };
    tick();
    const iv = setInterval(tick, 60000);
    return () => {
      cancelled = true;
      clearInterval(iv);
    };
  }, [unlocked]);

  // Instant revoke while session is active
  useEffect(() => {
    if (!unlocked) return;
    const client = getSupabaseClient();
    if (!client) return;
    let channel = null;
    let cancelled = false;

    (async () => {
      const { data: sessionData } = await client.auth.getSession();
      const session = sessionData && sessionData.session;
      if (!session || cancelled) return;
      const uid = session.user.id;

      const forceOut = (msg) => {
        setRevokeMsg(msg || "Your access was revoked by an administrator.");
        setUnlocked(false);
        window.__browserOSProfile = null;
        client.auth.signOut({ scope: "local" }).catch(() => {});
      };

      channel = client
        .channel("access-guard-" + uid)
        .on(
          "postgres_changes",
          {
            event: "UPDATE",
            schema: "public",
            table: "profiles",
            filter: "user_id=eq." + uid
          },
          payload => {
            const row = payload.new;
            if (!row) return;
            if (row.is_admin) return;
            if (row.status === "rejected" || row.status === "pending") {
              forceOut(
                row.status === "rejected"
                  ? "Your account was rejected or removed. Access ended."
                  : "Your account is no longer approved."
              );
              return;
            }
            if (row.chat_banned) {
              forceOut("You were banned from BrowserOS chat and access was revoked.");
            }
          }
        )
        .subscribe();
    })();

    return () => {
      cancelled = true;
      if (channel) {
        try {
          client.removeChannel(channel);
        } catch (_) {}
      }
    };
  }, [unlocked]);

  if (accessExpired) {
    return (
      <div className="auth-screen">
        <div className="auth-card">
          <div className="auth-logo">BrowserOS</div>
          <div className="auth-sub">Access expired</div>
          <p style={{ fontSize: 14, lineHeight: 1.5, margin: "12px 0 18px", color: "var(--text-muted)" }}>
            Your BrowserOS access period has expired. Please contact an Admin or Developer to extend your trial.
          </p>
          <button
            className="auth-btn"
            type="button"
            onClick={() => {
              setAccessExpired(false);
              setRevokeMsg("Access expired. Sign in again after an admin extends your trial.");
            }}
          >
            Back to sign in
          </button>
        </div>
      </div>
    );
  }

  if (recoveryOpen) {
    return (
      <div className="auth-screen">
        <div className="auth-card">
          <div className="auth-logo">BrowserOS</div>
          <div className="auth-sub">Set a new password</div>
          <div className="auth-label">New password</div>
          <input
            className="auth-input"
            type="password"
            value={newPw}
            onChange={e => setNewPw(e.target.value)}
            placeholder="New password"
            disabled={recoveryBusy}
          />
          <div className="auth-label" style={{ marginTop: 12 }}>Confirm password</div>
          <input
            className="auth-input"
            type="password"
            value={newPw2}
            onChange={e => setNewPw2(e.target.value)}
            placeholder="Confirm password"
            disabled={recoveryBusy}
          />
          {recoveryErr && <div className="auth-error">{recoveryErr}</div>}
          <button
            className="auth-btn"
            type="button"
            disabled={recoveryBusy}
            onClick={async () => {
              setRecoveryErr("");
              if (newPw.length < 6) {
                setRecoveryErr("Password must be at least 6 characters.");
                return;
              }
              if (newPw !== newPw2) {
                setRecoveryErr("Passwords do not match.");
                return;
              }
              const client = getSupabaseClient();
              if (!client) return;
              setRecoveryBusy(true);
              const { error } = await client.auth.updateUser({ password: newPw });
              setRecoveryBusy(false);
              if (error) {
                setRecoveryErr(error.message || "Update failed.");
                return;
              }
              await client.auth.signOut({ scope: "local" }).catch(() => {});
              setRecoveryOpen(false);
              setNewPw("");
              setNewPw2("");
              setRevokeMsg("Password updated. Sign in with your new password.");
            }}
          >
            {recoveryBusy ? "Saving…" : "Update password"}
          </button>
        </div>
      </div>
    );
  }

  useEffect(() => {
    const onTamper = ev => {
      try {
        setUnlocked(false);
        window.__browserOSUnlockedHint = false;
        setNeedsActivation(null);
        setPendingProfile(null);
        setRejectedProfile({
          status: "rejected",
          _tamperBanned: true,
          email:
            (window.__browserOSProfile && window.__browserOSProfile.email) ||
            ""
        });
        const client = getSupabaseClient();
        if (client) client.auth.signOut({ scope: "local" }).catch(() => {});
      } catch (_) {}
    };
    window.addEventListener("browseros-tamper-ban", onTamper);
    return () => window.removeEventListener("browseros-tamper-ban", onTamper);
  }, []);

  if (offlineMode) {
    return (
      <OfflineDinoGame
        onOnline={() => {
          try {
            if (typeof navigator !== "undefined" && navigator.onLine === false) {
              return;
            }
          } catch (_) {}
          setOfflineMode(false);
        }}
      />
    );
  }

  if (rejectedProfile) {
    return (
      <PendingApprovalScreen
        profile={rejectedProfile}
        onBack={() => {
          setRejectedProfile(null);
          setUnlocked(false);
        }}
      />
    );
  }

  if (needsActivation) {
    return (
      <PlanGateScreen
        profile={needsActivation}
        onActivated={async p => {
          const client = getSupabaseClient();
          const ent = await refreshServerEntitlements(client);
          if (ent && ent.access_expired) {
            setNeedsActivation(null);
            setAccessExpired(true);
            return;
          }
          if (ent && ent.can_use_os) {
            setNeedsActivation(null);
            setUnlocked(true);
            return;
          }
          // Still not activated according to server — stay on gate
          setError && setError;
          setNeedsActivation(p || needsActivation);
        }}
        onSignOut={async () => {
          const client = getSupabaseClient();
          if (client) await client.auth.signOut({ scope: "local" }).catch(() => {});
          setNeedsActivation(null);
          setUnlocked(false);
        }}
      />
    );
  }

  if (pendingProfile) {
    return (
      <PendingApprovalScreen
        profile={pendingProfile}
        onBack={() => {
          setPendingProfile(null);
          const client = getSupabaseClient();
          if (client) client.auth.signOut({ scope: "local" }).catch(() => {});
        }}
      />
    );
  }

  if (!unlocked) {
    return staleClient ? (
        <div className="auth-screen">
          <div className="auth-card">
            <div className="auth-logo">BrowserOS</div>
            <div className="auth-sub">Update required</div>
            <p style={{ fontSize: 13, color: "var(--text-muted)", lineHeight: 1.55, marginBottom: 14 }}>
              {staleClient.message ||
                "New Update: Refresh to regain access. Open the latest BrowserOS file."}
            </p>
            <div style={{ fontSize: 12, color: "var(--text-muted)", marginBottom: 14 }}>
              This build: <strong style={{ color: "var(--text)" }}>{localBuildVersion()}</strong>
            </div>
            <button
              type="button"
              className="auth-btn"
              onClick={() => {
                try {
                  window.location.reload();
                } catch (_) {}
              }}
            >
              Refresh page
            </button>
            <div className="auth-hint" style={{ marginTop: 12 }}>
              If this is a downloaded file, replace it with the newest BrowserOS.html from the
              publisher, then open that file.
            </div>
          </div>
        </div>
      ) : (
      <AuthScreen
        onUnlock={async (session, profile) => {
          // Block outdated clients before entering the OS
          try {
            const freshness = await checkClientBuildFreshness();
            if (freshness && !freshness.ok) {
              setStaleClient({ message: freshness.message });
              try {
                const client = getSupabaseClient();
                if (client) await client.auth.signOut({ scope: "local" });
              } catch (_) {}
              return;
            }
          } catch (_) {}
          setRevokeMsg("");
          const client = getSupabaseClient();
          // Always trust server gate — never unlock from client profile flags alone
          let ent = null;
          try {
            ent = await refreshServerEntitlements(client);
          } catch (_) {}
          if (ent) {
            if (ent.needs_approval) {
              setPendingProfile(profile || { status: "pending" });
              setUnlocked(false);
              return;
            }
            if (ent.access_expired) {
              setAccessExpired(true);
              setUnlocked(false);
              return;
            }
            // Free OS: approved users enter without paid activation.
            // Nitro/activation only gates Pro features (chat, session cloud, …).
            const approvedFree =
              (profile &&
                (profile.status === "approved" ||
                  profile.is_admin ||
                  profile.is_dev)) ||
              (ent && (ent.approved || ent.status === "approved" || ent.is_staff));
            if (ent.needs_approval) {
              setPendingProfile(profile || { status: "pending" });
              setUnlocked(false);
              return;
            }
            if (approvedFree || ent.can_use_os) {
              setNeedsActivation(null);
              setPendingProfile(null);
              setRejectedProfile(null);
              window.__browserOSUnlockedHint = true;
              try {
                startBrowserOSIntegrityMonitor();
              } catch (_) {}
              setUnlocked(true);
              return;
            }
          }
          // Fallback if RPC missing: old behavior
          if (profile && profile.status && profile.status !== "approved" && !profile.is_admin && !profile.is_dev) {
            setPendingProfile(profile);
            setUnlocked(false);
            return;
          }
          // Do not block free OS on activation — only approval matters here
          if (
            profile &&
            profile.status &&
            profile.status !== "approved" &&
            !profile.is_admin &&
            !profile.is_dev
          ) {
            setPendingProfile(profile);
            setUnlocked(false);
            return;
          }
          setNeedsActivation(null);
          setRejectedProfile(null);
          window.__browserOSUnlockedHint = true;
          try {
            startBrowserOSIntegrityMonitor();
          } catch (_) {}
          setUnlocked(true);
        }}
        onPending={profile => setPendingProfile(profile || { status: "pending" })}
        revokeMessage={revokeMsg}
      />
    );
  }
  try {
    window.__browserOSUnlockedHint = true;
    startBrowserOSIntegrityMonitor();
  } catch (_) {}
  return <App />;
}
try {
  const rootEl = document.getElementById("root");
  if (!rootEl) throw new Error("#root element missing");
  if (!window.React || !window.ReactDOM) throw new Error("React failed to load (CDN blocked?)");
  ReactDOM.createRoot(rootEl).render(<Root/>);
} catch (err) {
  console.error(err);
  const status = document.querySelector(".os-boot-status");
  if (status) status.textContent = "Boot failed: " + (err && err.message ? err.message : String(err));
}
</script>
</body>
